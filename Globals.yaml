# global BlackBox game settings, see GamePlayGlobals.cs for more info
# mods will inherit these values as defaults
Globals:
  # game start settings
  MaxOpponents: 9
  DefaultNumOpponents: 4
  TurnTimer: 5 # default time in seconds for a single turn
  TraitPoints: 6

  # gameplay modifiers
  ShipDestroyThreshold: 0.5 # ships with internal slots below this ratio will Die
  RemnantDesignStrMultiplier: 2
  CostBasedOnSizeThreshold: 3000
  HangarCombatShipCostMultiplier: 2
  RequiredExpansionPopRatio: 0.3 # required empire pop ratio before expansion is considered
  ShipyardBonus: 0.25 # default 0.25, this also improves repair rate
  CustomMineralDecay: 1 # default 1
  VolcanicActivity: 1 # default 1
  GravityWellRange: 8000 # sets the default gravity well range, 0 means disabled
  StartingPlanetRichnessBonus: 1 # bonus richness for empire capitals (default is 1 for richness of 2)
  ShipMaintenanceMultiplier: 1 # default 1
  ResearchStationProductionPerResearch: 2 # default 2
  RushCostPercentage: 1 # default 1, How much rushing costs in percentage of production cost
  MinAcceptableShipWarpRange: 600000 # minimum ship warp range which is accepted as good
  BaseShipyardRepair: 5 # multiplier of the ShipRepair of planetary buildings, giving repair per second
  BonusRepairPerColonyLevel: 0.5 # colony repair is multiplied by colony level times this: 0.5 gives x0.5 at level 1 and x2.5 at level 5
  InCombatRepairModifier: 0.1 # share of a colony's ship repair while there is fighting near the colony
  SelfRepairMultiplier: 1.0 # base repair rate multiplier from ship command/engineering modules
  BonusRepairPerCrewLevel: 0.2 # +bonus rate based on crew level, 0.2 would be +20% increase per each crew level
  ShieldPowerMultiplier: 1.0 # Global multiplier for Shields
  ProjectileHitpointsMultiplier: 0.75 # Global multiplier for Projectile Hit Points (mainly affects missiles)
  ConstructionShipOrbitalDiscount: 100 # When building orbitals, constructor ship cost over this threshold will be added to the gross orbital cost  
  ConstructionModuleBuildRate: 100 # How much consturction the construction module can process per turn   
  BuilderShipConstructionAdded: 100 # How much consturction Builder ships add when they reach the contructor
  MiningStationFoodPerOneRefining: 0.25 # How much Food is consumed per 1 refining point
  ResearchBenefitFromAlliance: 0.1 # How much research each alliance is giving you (from other party research)
  ExoticRatioStorage: 0.02 # How much exotic resource storage an empire has per resource based on all planet normal storage  
  EnableHullEditor: false # Allows modders to edit hulls. it is disabled by default since it will weaken the AI if not done correctly.

  # feature flags
  DisableShipPicker: true
  ChangeResearchCostBasedOnSize: true
  EnableShipTechLineFocusing: false
  UseDestroyers: false
  EnableECM: false
  DisableRemnantStory: false
  DisablePirates: false
  EnableSalvageOps: true # salvageable derelicts and salvage ships; mods do not inherit it and set it themselves
  EnableHullPlates: true # hull plates that ships lose in battle, on hulls whose models are cut into plates; mods do not inherit it and set it themselves
  AIUsesPlayerDesigns: false
  EnableRandomizedAIFleetSizes: false # Allows Ai to slightly alter fleet sizes within range specified in FleetBuildRatios.yaml

  # visuals modifiers
  SpaceportScale: 0.5
  ExplosionVisualIncreaser: 1 # default: 1
  ShipExplosionVisualIncreaser: 1 # default: 1
  ModuleDamageVisualIntensity: 2 # default: 1

  # misc settings
  CustomMenuMusic: ""
  # In case an event building has defense drones and drones are not researched
  DefaultEventDrone: "Xeno Fighter"
  ResearchRootUIDToDisplay: "Colonization"

  # Urls for accessing auto-updater, should be changed for mods, if unused, set to ""
  URL: "https://github.com/TeamStarDrive/CombinedArms#readme"
  DownloadSite: "https://github.com/TeamStarDrive/CombinedArms/releases"

  # mod information
  Mod:
    Name: "Combined Arms"
    Version: "v1.60.0029"
    FormatVersion: 1
    SupportedBlackBoxVersions: "main,jupiter-1.60"
    IconPath: Textures/s141.png
    Description: "Combo mod taken into the next level. More Technologies, more hulls, more weapons and a lot of balance work."
    Author: "Moonster and FatBastard"
    UseVanillaShips: false
    UseVanillaTechs: false
    UseVanillaModules: false
    UseVanillaWeapons: false
    UseVanillaBuildings: false
    UseVanillaRaces: false
