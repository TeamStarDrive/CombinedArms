name: Release Mod

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract version from globals.yaml
        id: extract_version
        run: |
          version=$(grep '^[[:space:]]*Version:' Globals.yaml | cut -d '"' -f2)
          echo "Extracted version: $version"
          echo "mod_version=$version" >> $GITHUB_OUTPUT

      - name: Set environment variables
        run: |
          echo "FOLDER_NAME=Combined Arms" >> $GITHUB_ENV
          echo "BASE_NAME=CombinedArms_$MOD_VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=$MOD_VERSION" >> $GITHUB_ENV
          echo "RELEASE_NAME=Combined Arms $MOD_VERSION" >> $GITHUB_ENV
        env:
          MOD_VERSION: ${{ steps.extract_version.outputs.mod_version }}

      - name: Create folder and copy files
        run: |
          mkdir "$FOLDER_NAME"
          cp -r * "$FOLDER_NAME" || true
          rm -rf "$FOLDER_NAME/.git" "$FOLDER_NAME/.github" 
          rm -rf "$FOLDER_NAME"/extract*.bat

      - name: Zip the folder
        run: |
          zip -r "${BASE_NAME}.zip" "$FOLDER_NAME"

      - name: Split the ZIP into 500MB chunks with numbered names
        id: split_zip
        run: |
          rm -rf chunks
          mkdir chunks
          zipname="${BASE_NAME}.zip"
          split -b 500m "$zipname" "chunks/split_"

          count=$(ls chunks/split_* | wc -l)
          if [ "$count" -eq 1 ]; then
            # Single chunk: keep the original archive name, no 001- prefix, no extractor needed.
            mv chunks/split_* "chunks/${BASE_NAME}.zip"
            echo "multi_chunk=false" >> $GITHUB_OUTPUT
          else
            i=1
            for f in chunks/split_*; do
              num=$(printf "%03d" $i)
              mv "$f" "chunks/${num}-${BASE_NAME}.zip"
              i=$((i + 1))
            done
            echo "multi_chunk=true" >> $GITHUB_OUTPUT
          fi
          rm "$zipname"

      - name: Create Git tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists locally, skipping tag creation."
          else
            git tag "$TAG_NAME"
          fi

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG_NAME$"; then
            echo "Tag $TAG_NAME already exists on remote, skipping push."
          else
            git push origin "$TAG_NAME"
          fi          

      - name: Upload chunked files to release (multi-chunk)
        if: steps.split_zip.outputs.multi_chunk == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: true
          files: |
            chunks/*
            extract*.bat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload single zip to release
        if: steps.split_zip.outputs.multi_chunk != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          draft: true
          files: chunks/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}