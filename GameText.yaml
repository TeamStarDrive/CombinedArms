 RUS: "Хотя этот металл недостаточно прочен, чтобы служить внешней броней, он может заменить внутренние переборки и помочь отремонтировать корабль, когда он не в бою, а также обладает способностями самовосстановления брони бою. У нее высокое энергопотребление, даже если ничего не ремонтировать."
