CA_Tech_AdvArmoredSolarcollector_Name:
 Id: 50358
 ENG: "Solar Armor"
 RUS: "Солнечная броня"
CA_Tech_AdvArmoredSolarcollector_Desc:
 Id: 50359
 ENG: "This armor improves upon Electro Armor in several ways. It generates more power flow, provides more rigidity, grants more power storage, better amplify installed shields, and it supplies a larger radius of power. It is still, however, less strong than conventional steel armor. It has some resistance to beam weapons, as the collectors need heat in order to provide power."
 RUS: "Эта броня улучшает электро броню несколькими способами. Создает больший приток мощности, обеспечивает большую прочность, дает больше энергии, лучше усиливает установленные щиты и обеспечивает больший радиус мощности. Однако она по-прежнему менее прочна, чем обычная стальная плита. Имеет некоторое сопротивление лучевому оружию, поскольку коллекторам требуется тепло для обеспечения энергией."
