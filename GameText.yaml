CA_Tech_VelocityStimulanceMk5_Name:
 Id: 50230
 ENG: "Velocity Package V"
 RUS: "Спец двигатели V"
CA_Tech_VelocityStimulanceMk1_Desc:
 Id: 50231
 ENG: "As our control over the galaxy grows, we must improve our hyperspace and subspace travel times. We are focusing on external thrusters and more integrated systems for fighter/corvettes."
 RUS: "По мере того как наш контроль над галактикой растет, мы обязаны ускорить наши корабли в варп-прыжке и при субсветовых скоростях. Ученые делают упор на внешние двигатели и более интегрированные системы для истребителей / корветов."
CA_RemnantGreenLaser:
 Id: 50232
 ENG: "Remnant Green Laser"
 RUS: "Зеленый лазер Предтечь"
CA_Tech_RemnantTech_Name:
 Id: 50233
 ENG: "Remnant Tech"
 RUS: "Технологии Предтечь"
CA_RemnantPlanetNuker:
 Id: 50234
 ENG: "Remnant Planet Nuker"
 RUS: "Планетарная ядерное оружие Предтечь"
CA_MagneticAcceleratorCannon:
 Id: 50238
 ENG: "Magnetic Accelerator Cannon"
 RUS: "Орудие магнитного ускорения"
CA_TheMagneticAcceleratorCannonIs:
 Id: 50239
 ENG: "The Magnetic Accelerator Cannon is an immensely powerful weapon, capable of destroying small vessels in one shot, whether they have shields or not. It also features high Armor Penetration ability."
 RUS: "Орудие магнитного ускорения- чрезвычайно мощное оружие, способное уничтожать небольшие суда одним выстрелом, независимо от того, есть у них щиты или нет. Также обладает высокой способностью к пробитию брони."
CA_RemnantMagneticAcceleratorCannon:
 Id: 50242
 ENG: "Remnant Magnetic Accelerator Cannon"
 RUS: "Орудие магнитного ускорения Предтечь"
CA_RemnantRegenArmor:
 Id: 50243
 ENG: "Remnant Regen Armor"
 RUS: "Регенерирующая броня Предтечь"
CA_RemnantMagneticAcceleratorCannonX:
 Id: 50244
 ENG: "Remnant Magnetic Accelerator Cannon 2x2"
 RUS: "Орудие магнитного ускорения Предтечь 2x2"
CA_RemnantCombatEngine:
 Id: 50245
 ENG: "Remnant Combat Engine"
 RUS: "Боевой двигатель Предтечь"
CA_RemnantPlasmaProjector:
 Id: 50246
 ENG: "Remnant Plasma Projector"
 RUS: "Плазменный проектор Предтечь"
CA_BlueLaserMk:
 Id: 50247
 ENG: "Blue Laser Mk1"
 RUS: "Синий лазер I"
CA_TheFirstGenerationOfRapid:
 Id: 50248
 ENG: "The first generation of Rapid Fire Lasers designed for fighters. This is mainly a first working prototype for this type of energy weapon. Its main con is a long delay between bursts, necessary for the weapon to cool."
 RUS: "Первое поколение скорострельных лазеров, предназначенных для истребителей. Это первый рабочий прототип малого энергетического оружия. Его главный минус - большая задержка между очередями, необходимая для охлаждения оружия."
CA_BlueLaserMk2:
 Id: 50249
 ENG: "Blue Laser Mk2"
 RUS: "Синий лазер II"
CA_ImprovedVersionOfMkThanks:
 Id: 50250
 ENG: "Improved Version of Mk1. Thanks to the larger size of heat sinks, it can maintain rapid fire for longer periods of time, increasing the number of projectiles fired. "
 RUS: "Следующая версия синего лазера. Благодаря большему размеру радиаторов, пушка может поддерживать быстрый огонь в течение более длительных периодов времени, увеличивая количество выпущенных снарядов."
CA_BlueLaserMk3:
 Id: 50251
 ENG: "Blue Laser Mk3"
 RUS: "Синий лазер III"
CA_AnAdvancedRapidFireLaser:
 Id: 50252
 ENG: "An advanced rapid fire Laser that can fit in a fighter hull. Thanks to the bigger advanced rail type magnetic barrel, projectiles can be fired from a larger distance, and each shot has increased energy storage for more devastation on impact"
 RUS: "Продвинутый скорострельный лазер, который может поместиться в корпус истребителя. Благодаря более лучшему магнитному стволу рельсового типа, снаряды можно запускать с большего расстояния, а каждый выстрел имеет увеличенный запас энергии для большего разрушительного воздействия при ударе."
CA_GreenHeavyLaserCannon:
 Id: 50253
 ENG: "Green Heavy Laser Cannon"
 RUS: "Зеленый лазер"
CA_GreenVersionOfTheStandard:
 Id: 50254
 ENG: "Green version of the standard heavy laser cannon. It has been modified to have higher damage per shot, but also lower fire rate. It is also slightly better versus Shields."
 RUS: "Версия лазерной пушки импульсного типа с большим уроном и низкой скорострельностью. Из-за меньшей скорости снаряда несколько меньше противодейсвует броне, но это компенсируется возросшим уроном."
CA_PurpleHeavyLaserCannon:
 Id: 50255
 ENG: "Purple Heavy Laser Cannon"
 RUS: "Пурпурный лазер"
CA_PurpleVersionOfTheStandard:
 Id: 50256
 ENG: "Purple version of the standard heavy laser cannon. It has been modified to have lower damage per shot, but faster fire rate. It has a very small chance to completely bypass shields."
 RUS: "Альтернативная версия лазерной пушки импульсного типа с уменьшеным уроном за выстрел, но с очень высокой скорострельностью. Обладет самыми быстрыми снарядами в серии и имеет небольшой шанс проникнуть сквозь щит, взамен лишен дополнительного урона по броне."
CA_Tech_MediumRangeMissiles_Name:
 Id: 50257
 ENG: "Terminal Missiles I"
 RUS: "Ракетный терминал I"
CA_Tech_MediumRangeMissiles_Desc:
 Id: 50258
 ENG: "Terminal Missiles use extra speed at the expense of guidance when they enter final phase, in order to overcome missiles defense systems. We can create a medium range missile which will take advantage of this technology."
 RUS: "Эти ракеты используют дополнительную скорость за счет наведения.Имеют финальную фазу, чтобы преодолеть системы противоракетной защиты. Мы можем создать ракету средней дальности, которая будет использовать эту технологию."
CA_Tech_LongRangeSupportMissile_Name:
 Id: 50259
 ENG: "MIRV I"
 RUS: "MIRV I"
CA_Tech_LongRangeSupportMissile_Desc:
 Id: 50260
 ENG: " Multiple Independent Reentry Vehicle. The term is taken from old planetary ballistic missiles. We can create a Long Range Missile (LRM) which will contain multiple missiles launched near the target in order to saturate the battlezone with smaller missiles and avoid Point Defense System."
 RUS: " Многочисленные независимые ракетные компоненты. Термин взят из старых планетарных баллистических ракет. Мы можем создать ракету большой дальности (LRM), которая будет содержать несколько ракет, запускаемых рядом с целью, чтобы заполнить зону боя меньшими ракетами и избежать системы точечной защиты."
CA_ThisIsABiggerVersion:
 Id: 50261
 ENG: "This is a bigger version of the small module. It is also more efficient and usually more cost effective than multiple smaller modules stacked to the same size. See the Small module description for armor details."
 RUS: "Это увеличенная версия маленького модуля. Он также более эффективен и обычно более рентабелен, чем несколько модулей меньшего размера, установленных вместо одного модуля большего размера. См. Описание маленького модуля для деталей."
CA_Tech_Defense_Name:
 Id: 50268
 ENG: "Defense"
 RUS: "Защита"
CA_Tech_Defense_Desc:
 Id: 50269
 ENG: "This research branch will focus on the means of defending our ships and colonies from enemy fire. We have several fields we can begin research in. "
 RUS: "Эта ветка исследований сосредоточена на средствах защиты наших кораблей и колоний от вражеского огня. У нас есть несколько областей, в которых мы можем начать исследования."
CA_Tech_Tacticalnuke_Name:
 Id: 50280
 ENG: "Tactical Nukes"
 RUS: "Тактическое оружие"
CA_Tech_Tacticalnuke_Desc:
 Id: 50281
 ENG: "A tactical nuclear weapon, or non-strategic nuclear weapon, is a nuclear weapon which is designed to be used on a battlefield in military situations, mostly with friendly forces in proximity. Adapted for space usage, nuclear effects are less profound than with atmospheric detonations, but still often cause EMP damage."
 RUS: "Тактическое ядерное оружие, или не стратегическое ядерное оружие - это ядерное оружие, которое предназначено для использования на поле боя, в основном с дружественными силами в непосредственной близости. Ядерные эффекты, адаптированные для использования в космосе, менее сильны, чем атмосферные взрывы, но все же часто вызывают повреждение ЭМИ."
CA_Atcsm3:
 Id: 50286
 ENG: "ATCSM"
 RUS: "КРБЛ"
CA_AntiCapitalShipMissilesMuch:
 Id: 50287
 ENG: "Anti Capital Ship missiles, much more powerful than regular missiles."
 RUS: "Корабельные ракеты борьбы с линкорами, намного более мощные, чем обычные ракеты."
CA_DualAtcsm2:
 Id: 50290
 ENG: "Dual ATCSM"
 RUS: "Двойные КРБЛ"
CA_DualAntiCapitalShipMissiles2:
 Id: 50291
 ENG: "Dual Anti Capital Ship missiles. We also improved the ATCM itself, introducing slightly increased range and damage"
 RUS: "Двойные КРБЛ. Мы также улучшили сами ракеты, добавив немного увеличенную дальность и урон."
CA_AmxRevolver2:
 Id: 50294
 ENG: "AMX50 Revolver"
 RUS: "AMX50 \"Револьвер\""
CA_AnExperimentalOscillatingMountedMissile2:
 Id: 50295
 ENG: "An experimental Oscillating mounted missile launcher. Very expensive, but can launch 6 improved versions of ATCSM at a time. "
 RUS: "Экспериментальная качающаяся установка для запуска ракет. Очень дорого, но может запускать 6 улучшенных версий КРБЛ одновременно."
CA_FighterAtcsm:
 Id: 50304
 ENG: "Fighter ATCSM"
 RUS: "КРЛБ истребителя"
CA_ThisIsAFighterVersion:
 Id: 50305
 ENG: "This is a Fighter version of the ATCSM. Smaller size, but decreased range and damage."
 RUS: "Это версия КРБЛ для истребителей. Меньший размер - значит меньшая дальность и урон."
CA_Tech_AssultRaiders_Name:
 Id: 50306
 ENG: "AssaultRaiders"
 RUS: "Отсек штурмовых рейдеров"
CA_IncreasingHangarBaySizeHas:
 Id: 50307
 ENG: "Increasing hangar bay size has improved greatly ship relaunch sequence in addition to be able to store slightly bigger hulls(up to 72 slots)."
 RUS: "Улучшенная планировка ангара значительно повысила последовательность перезапуска кораблей, а также добавила возможность хранить корпуса немного большего размера (до 72 слотов)."
CA_Tech_StarLancers_Name:
 Id: 50308
 ENG: "StarLancers"
 RUS: "Отсек звездных рейдеров"
CA_TheseHangarsAreAbleTo:
 Id: 50309
 ENG: "These hangars are able to store even bigger ships than any other previous hangars(up to 116 slots), biggest benefit from StarLancers is their ability to relaunch ships way faster after they get destroyed."
 RUS: "Эти ангары могут хранить большие корабли (до 116 слотов), их самое большое преимущество это - способность перезапускать корабли намного быстрее после их уничтожения."
CA_RepairBay:
 Id: 50310
 ENG: "Repair Bay"
 RUS: "Ремонтный отсек"
CA_MountedOnLargeShipsThis:
 Id: 50311
 ENG: "Mounted on large ships, this Repair Bay will significantly add to the the ship's repair capacity. It also contains a small power plant, making it useful as an auxiliary power conductor."
 RUS: "Этот ремонтный отсек большого размера, значительно увеличивает ремонтные возможности корабля. Он также содержит небольшую электростанцию, что делает его полезным в качестве вспомогательного силового источника."
CA_Tech_ElectronicArmors_Name:
 Id: 50320
 ENG: "Electro Armor"
 RUS: "Электро-броня"
CA_Tech_ElectronicArmors_Desc:
 Id: 50321
 ENG: "This is a combination of early stage Metal armor, with the addition of solar collectors. These collectors, though providing less power flow than simple and armored solar panels, do also store a small amount of power within. Drawbacks are higher cost, and lower rigidity. As a bonus, they have some resistance to beam weapons, since the collectors need heat in order to provide power."
 RUS: "Это комбинация металлической брони ранней стадии с добавлением солнечных коллекторов. Эти коллекторы, хотя и обеспечивают меньший приток энергии, чем простые и бронированные солнечные панели,а также накапливают небольшое количество энергии внутри. Недостатки - более высокая стоимость и меньшая прочность (даже ниже, чем у внутренних переборок). В качестве бонуса у них есть некоторая устойчивость к лучевому оружию, поскольку коллекторы нуждаются в тепле для обеспечения энергией."
CA_Tech_DepletedUraniumArmor_Name:
 Id: 50322
 ENG: "Reactive Armor"
 RUS: "Реактивная броня"
CA_Tech_DepletedUraniumArmor_Desc:
 Id: 50323
 ENG: "This is the first improvement over steel armor. Reactive armor reacts in a certain way with offensive ordnance. It is stronger than Steel Armor, but costs more. It performs a little better against kinetic weapons."
 RUS: "Это первое улучшение стальной броней. Реактивная броня определенным образом реагирует на наступательные боеприпасы. Она прочнее, чем стальная броня, но стоит дороже.Немного лучше работает против кинетического оружия."
CA_ReactiveArmorSmall:
 Id: 50324
 ENG: "Reactive Armor Small"
 RUS: "Малая реактивная броня"
CA_StrongerThanSteelAndHas:
 Id: 50325
 ENG: "Stronger than steel and has some resistance to Kinetics"
 RUS: "Прочнее стали и имеет некоторую устойчивость к кинетике"
CA_ReactiveArmorMedium:
 Id: 50326
 ENG: "Reactive Armor Medium"
 RUS: "Средняя реактивная броня"
CA_ReactiveArmorLarge:
 Id: 50327
 ENG: "Reactive Armor Large"
 RUS: "Большая реактивная броня"
CA_Tech_BionicArmor_Name:
 Id: 50328
 ENG: "Bionic Alloys"
 RUS: "Бионические сплавы"
CA_BionicArmorIsInstalledExternally:
 Id: 50330
 ENG: "Bionic armor is installed externally on ships for protection. It can regenrate itself, protect from EMP discharge, and provide turn thrust. It Consumes power and weighs a lot. It also nullifies the effect of Armor Piercing I"
 RUS: "Бионическая броня устанавливается снаружи на корабли для защиты. Он может восстанавливать себя, защищать от разряда ЭМИ и обеспечивать поворотную тягу. Он потребляет энергию и много весит. Он также сводит на нет эффект пробивания брони I."
CA_BionicArmorSmall:
 Id: 50331
 ENG: "Bionic Armor Small"
 RUS: "Малая бионическая пластина"
CA_BionicArmorMed:
 Id: 50332
 ENG: "Bionic Armor Med"
 RUS: "Средняя бионическая платина"
CA_BionicArmorLarge:
 Id: 50333
 ENG: "Bionic Armor Large"
