CA_Tech_RemnantAssembly_Name:
 Id: 18260
 ENG: "Remnant Assembly"
CA_Tech_RemnantAssembly_Desc:
 Id: 18261
 ENG: "By introducing a very complex way of assembling weapons in Remnant specifications we were able to increase out weapon damage potential."
CA_Tech_RemnantAssembly_Weapon_Damage_Bonus:
 Id: 18262
 ENG: "All weapon types damages increased by 10%"
CA_Tech_RemnantAssembly_Weapon_ExplosionRadius_Bonus:
 Id: 18263
 ENG: "All weapon explosion radius increased by 10%"
CA_Tech_RemnantMetallurgy_Name:
 Id: 18264
 ENG: "Remnant Metallurgy"
CA_Tech_RemnantMetallurgy_Desc:
 Id: 18265
 ENG: "By mixing Remnant compounds from their wreckages with currently known materials, resulted in increased durability."
CA_Tech_RemnantMetallurgy_Bonus:
 Id: 18266
 ENG: "Provides a 30% hit point bonus to all ship modules"
CA_Tech_RemnantShielding_Name:
 Id: 18267
 ENG: "Remnant Shielding"
CA_Tech_RemnantShielding_Desc:
 Id: 18268
 ENG: "By studying energy signatures and particles emitted by recovered Remnant shield generators we were able to replicate and introduce those advancements to our own shield generators"
CA_Tech_RemnantShielding_Bonus:
 Id: 18269
 ENG: "Provides a 30% shield power"
CA_Tech_SlipStreams_Name:
 Id: 18270
 ENG: "Subspace Tunneling"
CA_Tech_SlipStreams_Desc:
 Id: 18271
 ENG: "Using ancient navigation data, our scientists discovered a way to gain access to subspace tunneling between our subspace projectors"
CA_Tech_SlipStreams_Bonus:
 Id: 18272
 ENG: "Ships traveling within your own empire's borders gain 30% bonus to their FTL speeds."
CA_Tech_Terraforming_Name:
 Id: 18279
 ENG: "Terraforming I"
CA_Tech_Terraforming_Desc:
 Id: 18280
 ENG: "Terraforming planets is a slow process but it can produce excellent results. If researched, we would be able to construct Teraformers; Vast machines which can transform even the most deadly Volcano into a nice, harmless hill."
CA_Tech_Terraforming2_Name:
 Id: 18281
 ENG: "Terraforming II"
CA_Tech_Terraforming2_Desc:
 Id: 18282
 ENG: "Continuing the line of Terraforming research, we will be able to make Terraformers even more effective. Terraformers will be able to transform unhabitable sections of the planet into fully habitable lands, increasing population capacity."
CA_Tech_Terraforming3_Name:
 Id: 18283
 ENG: "Terraforming III"
CA_Tech_Terraforming3_Desc:
 Id: 18284
 ENG: "The most advanced technology avaialble for Terraformers. They will be able to transform any habitable planet to the planet environment type our population prefers. This is a true technological marvel!"
AeroponicFarm_Short:
 Id: 50000
 ENG: "+1.5 food per turn, 10 storage"
 RUS: "+1.5 еды за ход,10 места в складе."
 SPA: "+1.5 comida por turno"
CA_Tech_Force_Fields_I_Name:
 Id: 50001
 ENG: "Force Fields I"
CA_Tech_Force_Fields_I_Desc:
 Id: 50002
 ENG: "We can create Force Field Emitters, which have very large radius of protection around our ships." 
CA_Tech_ColonyShielding_Name:
 Id: 50003
 ENG: "Colony Shielding"
 RUS: "Колониальные щиты"
 SPA: "Escudos planetarios"
CA_Tech_ColonyShielding_Desc:
 Id: 50004
 ENG: "Surprisingly, shielding an entire planet is easier than shielding an entire ship because we needn't worry about mass, size, and power restrictions when building on terra firma. The result is a shield that provides some protection from bombardment."
 RUS: "Удивительно, но защитить целую планету проще, чем защитить весь корабль, потому что нам не нужно беспокоиться об ограничениях массы, размера и мощности при строительстве на твердой земле. В результате получается щит, обеспечивающий некоторую защиту от бомбардировки."
 SPA: "Sorprendentemente, es más fácil proteger con escudos un planeta entero que una nave, porque en tierra firme no hay que preocuparse por limitaciones de masa, tamaño y energía. El resultado es un escudo potente y enorme que resguarda contra bombardeos. "
CA_Module_LightForceField_Name:
 Id: 50005
 ENG: "Light Force Field"
CA_Module_LightForceField_Desc:
 Id: 50006
 ENG: "The Light Force Field generates a good coverage and regenerate very fast, when not in combat. It also has some plasma and kinetic resistance."
CA_Module_MRM1_Name:
 Id: 50007
 ENG: "MRM Mk1"
 RUS: "MRM I"
 SPA: "SLCM"
EnergyShield_Name:
 Id: 50008
 ENG: "Energy Shield" 
EnergyShield_Desc:
 Id: 50009
 ENG: "A medium sized shield with higher output, which can be installed on larger hulls. It recharges in combat and have larger covreage radius."
CA_GoldVein:
 Id: 50010
 ENG: "Gold Vein"
CA_GoldVeinDesc:
 Id: 50011
 ENG: "Easily extractable gold vein that was exposed in the aftermath of volcanic activity"
CA_GoldVeinDescShort:
 Id: 50012
 ENG: "Provides 2 production per colonist, +3 credits, total worth of 350 production" 
CA_DronePlatform:
 Id: 50013
 ENG: "Drone Platform"
 RUS: "Платформа дронов"
CA_SelfSustainingPlanetaryDefenseThis:
 Id: 50014
 ENG: "Self sustaining planetary defense. This platform automatically launches a swarm of drones to fight enemy ships near the planet. Requires Drone technology to operate."
 RUS: "Самоподдерживающаяся планетарная защита. Эта платформа автоматически запускает рой дронов для борьбы с вражескими кораблями вблизи планеты. Для работы требуется технология дронов."
CA_PlanetaryDefenseSystemAttacksFoes:
 Id: 50015
 ENG: "Planetary defense system. Attacks foes with a swarm of drones, +50 Storage"
 RUS: "Система планетарной защиты. Атакует врагов роем дронов, +50 места на складе"
CA_LrmMk:
 Id: 50016
 ENG: "LRM Mk1"
 RUS: "LRM I"
CA_LongRangeMissilesAreDesigned:
 Id: 50017
 ENG: "Long Range Missiles are designed to out-range any other weapon. This comes with the drawback of slower missile speeds and maneuverability, but it contains multiple warhead system designed to decrease chances of interception."
 RUS: "Ракеты большой дальности предназначены для того, чтобы превосходить по дальности любое другое оружие. Это имеет недостаток, заключающийся в более низкой скорости и маневренности ракет, но он содержит систему с несколькими боеголовками, предназначенную для уменьшения вероятности перехвата."
CA_LrmMk2:
 Id: 50018
 ENG: "LRM Mk2"
 RUS: "LRM II"
CA_TheMarkIiHasA:
 Id: 50019
 ENG: "The mark II has a decent range and damage improvement over the mark I."
 RUS: "Имеет приличную дальность и улучшение урона по сравнению с предыдущей версией."
CA_LrmMk3:
 Id: 50020
 ENG: "LRM Mk3"
 RUS: "LRM III"
CA_TheMarkIiiHasA:
 Id: 50021
 ENG: "The mark III has a substantial range and damage improvement over the mark II."
 RUS: "Дальность полета ракеты значительно выросла, а также повышен урон."
CA_GaussSniperCannon:
 Id: 50022
 ENG: "Gauss Sniper Cannon"
 RUS: "Снайперская пушка Гаусса"
CA_AHighSpeedGaussRifle:
 Id: 50023
 ENG: "A high speed Gauss rifle with great range and damage."
 RUS: "Скоростная винтовка Гаусса с большой дальностью действия и большим уроном."
CA_HeavyPhasedTurretMk:
 Id: 50024
 ENG: "Heavy Phased Turret Mk1"
 RUS: "Тяжелая фазовая турель I"
CA_TheHeavyPhasedTurretIs:
 Id: 50025
 ENG: "The Heavy Phased Turret is used mainly vs. Small Craft, as it is designed to override the target's shields. Mk1 projectiles have limited efficiency vs. Armor."
 RUS: "Тяжелая фазовая турель используется в основном против малых судов, так как предназначена для преодоления щитов цели. Снаряды имеют ограниченную эффективность против брони."
CA_SmallGreenLaserCannon:
 Id: 50026
 ENG: "Small Green Laser Cannon"
 RUS: "Малый зеленый лазер"
CA_ThisVariantFiresSlowerBut:
 Id: 50027
 ENG: "This variant fires slower but packs more punch."
 RUS: "Этот вариант стреляет медленнее, но обладает большим уроном."
CA_SmallPurpleLaserCannon:
 Id: 50028
 ENG: "Small Purple Laser Cannon"
 RUS: "Малый пурпурный лазер"
CA_ThisVariantFiresVeryFast:
 Id: 50029
 ENG: "This variant fires very fast and can be used as Point Defense vs. missiles."
 RUS: "Этот вариант стреляет очень быстро и может использоваться в качестве точечной защиты против ракет."
CA_LargeFabricator:
 Id: 50030
 ENG: "Large Fabricator"
 RUS: "Большой фабрикатор боеприпасов"
CA_ThisFacilityIsALarge:
 Id: 50031
 ENG: "This Facility is a large, dedicated fabricator module. It is very power hungry, but can supply a lot of Ordnance."
 RUS: "Этот объект представляет собой большой специализированный модуль. Он очень энергоемкий, но производит много боеприпасов."
CA_Tech_SustainedSupport_Name:
 Id: 50032
 ENG: "Sustained Support"
 RUS: "Устойчивая поддержка"
CA_Tech_SustainedSupport_Desc:
 Id: 50033
 ENG: "Self sufficiency is extremely important in long and drawn out combat situations. Our engineers came up with this solution, a large fabricator and storage bay"
 RUS: "Самодостаточность чрезвычайно важна в затяжных боевых ситуациях. Наши инженеры придумали это решение - большой производитель и отсек для хранения"
CA_Module_Beam_PD_Name:
 Id: 50040
 ENG: "Beam Point Defense"
CA_Module_Beam_PD_Desc:
 Id: 50041
 ENG: "Beam point defense system can intercept incomming missiles using short pulse beams. It has wide effecting coverage, but small range."
CA_HeavyAntimatterCannon:
 Id: 50042
 ENG: "Heavy Anti-Matter Cannon"
 RUS: "Антиматериальное орудие"
CA_FiresAFastBurstOf:
 Id: 50043
 ENG: "Fires a fast burst of supercharged Anti-Matter shells over great distances. Does extra damage to Shields and Armor and has a 60% chance to bypass Shields."
 RUS: "Стреляет быстрой очередью антиматериальных снарядов на большие расстояния. Наносит дополнительный урон щитам и броне,имеет 60% шанс обойти щиты."
CA_Tech_AntiMatterWeaponry_Name:
 Id: 50044
 ENG: "Anti-Matter Weapons I"
 RUS: "Оружие антиматерии I"
CA_Tech_AntiMatterWeaponry_Desc:
 Id: 50045
 ENG: "By further stabilizing matter / anti-matter reactions, we have managed to weaponize our research into powerful anti-matter weaponry."
 RUS: "Путем дальнейшей стабилизации реакций материя / антиматерия нам удалось превратить наши исследования в мощное оружие антиматерии."
CA_FighterAntimatterReactor:
 Id: 50046
 ENG: "Fighter Anti-Matter Reactor"
 RUS: "Малый антиматериальный реактор"
CA_ThisIsAFighterSpecific:
 Id: 50047
 ENG: "This is a fighter specific small version of the Anti-Matter Reactor. It has very good power output, but it explodes if destroyed."
 RUS: "Это малая версия антиматериального реактора, разработанная специально для малых корпусов. У него очень хорошая выходная мощность, но при разрушении он взрывается."
CA_HyperVelocityVulcanCannon:
 Id: 50066
 ENG: "Hyper Velocity Vulcan Cannon"
 RUS: "Гиперскоростной \"Вулкан\""
CA_HvVulcanCannonsFireAt:
 Id: 50067
 ENG: "HV Vulcan cannons fire at velocities so high that the strength of materials upon impact is very small compared to inertial stresses. Thus, even metals behave like fluids under hyper-velocity impact. Extreme hyper-velocity results in vaporization of the impactor and target. They are very effective versus armor."
 RUS: "Пушки HV Vulcan стреляют со столь высокой скоростью, что прочность материалов при ударе очень мала по сравнению с инерционными напряжениями. Таким образом, даже металлы при сверхскоростном ударе ведут себя как жидкости. Чрезвычайная сверхскорость приводит к испарению ударника и цели. Они очень эффективны против брони."
CA_ThisArmorCanWithstandA:
 Id: 50069
 ENG: "This armor can withstand a decent amount of damage. Where it shines however is with the nano repair bots that are released when the ship starts taking damage, healing every module on the ship. The effects of the equipped armor modules are cumulative and a ship equipped with regenerating armor is a force to be reckoned with."
 RUS: "Эта броня может выдержать приличный урон. Но где она себя проявляет-так это с нано-ремонтными роботами, которые выпускаются, когда корабль начинает получать повреждения, исцеляя каждый модуль на корабле. Эффекты модулей такой брони акумулятивны, и корабль, оснащенный регенерирующей броней, - это сила, с которой нужно считаться."
CA_Tech_AdvancedLRMPlatforms_Name:
 Id: 50076
 ENG: "MIRV III"
 RUS: "MIRV III"
CA_Tech_AdvancedLRMPlatforms_Desc:
 Id: 50077
 ENG: "Better thrusters, faster missile engines, better targeting sensors, and increased payloads allow us to develop new LRM platforms which can launch more missiles with more warheads."
 RUS: "Более совершенные ускорители, более быстрые ракетные двигатели, улучшенные датчики наведения и увеличенная полезная нагрузка позволяют нам разрабатывать новые платформы дальнобойных ракет, которые могут запускать их с большим количеством боеголовок."
CA_Tech_AdvancedMRMSystems_Name:
 Id: 50078
 ENG: "Terminal Missiles III"
 RUS: "Ракетный терминал III"
CA_Tech_AdvancedMRMSystems_Desc:
 Id: 50079
 ENG: "We can develop a better and bigger Terminal Missile System which will saturate any Point Defense with large salvos."
 RUS: "Мы можем разработать лучшую и более крупную ракетную систему \"Терминал\", которая насытит любую точку обороны большими залпами."
CA_Tech_ImprovedLRMPlatforms_Name:
 Id: 50080
 ENG: "MIRV II"
 RUS: "MIRV II"
CA_Tech_ImprovedLRMPlatforms_Desc:
 Id: 50081
 ENG: "We can develop a bigger and better MIRV system which will launch more missiles at the target."
 RUS: "Мы можем разработать более крупную и лучшую систему MIRV, которая будет запускать больше ракет по цели."
CA_ShadowStorm:
 Id: 50082
 ENG: "Shadow Storm"
 RUS: "\"Шторм теней\""
CA_ARapidFireShortRange:
 Id: 50083
 ENG: "A rapid fire, short range burst missile platform. Especially deadly against smaller fast moving ships, it functions most practically as an anti fighter/corvette weapon. It features a wide targeting angle, slight chance to penetrate enemy shields and features high explosion radius. It is less efficient vs. Armor."
CA_PlasmaProjector:
 Id: 50086
 ENG: "Plasma Projector"
 RUS: "Плазменный проектор"
CA_APlasmaProjectorUsesA:
 Id: 50087
 ENG: "A plasma projector uses a massive array of plasma generating nodes to project a storm of high-energy plasma shells towards a target."
 RUS: "Плазменный проектор использует массив узлов генерации плазмы, чтобы проецировать поток высокоэнергетических плазменных оболочек на цель."
CA_Tech_PlasmaWeaponsII_Name:
 Id: 50088
 ENG: "Plasma Weapons II"
CA_Tech_PlasmaWeaponsII_Desc:
 Id: 50089
 ENG: "We are now able to build heavier plasma weapons by using the previous ionized reactor Plasma and pushing it to new limits with higher pressure. The magnetized pressure system requires, however, more constant power and even extra reactor power to fire."
 RUS: "Теперь мы можем создавать более тяжелое плазменное оружие, используя предыдущий ионизированный реактор плазмы и доводя его до новых пределов с более высоким давлением. Однако для срабатывания намагниченной системы давления требуется более стабильная мощность и даже дополнительная мощность реактора."
CA_Tech_Upgrades_Name:
 Id: 50090
 ENG: "Upgrades"
 RUS: "Улучшения"
CA_Tech_Upgrades_Desc:
 Id: 50091
 ENG: "Various research options to upgrade ship and weapon components and more."
 RUS: "Различные варианты исследований для улучшения компонентов корабля, оружия и многого другого."
CA_Tech_Plasteel_Name:
 Id: 50092
 ENG: "Plasteel"
 RUS: "Пластстали"
CA_Tech_Plasteel_Desc:
 Id: 50093
 ENG: "Although steel armor is inexpensive, it is extremely heavy and reduces the maneuverability of our ships significantly. By focusing our research efforts into developing new construction materials, we have discovered a new alloy. It is slightly weaker than steel, but very easy to repair."
 RUS: "Хотя стальная броня стоит недорого, она чрезвычайно тяжелая и значительно снижает маневренность наших кораблей. Сосредоточив наши исследовательские усилия на разработке новых строительных материалов, мы открыли новый сплав. Он немного слабее стали, но очень легко ремонтируется."
CA_AntimatterProjector:
 Id: 50094
 ENG: "Anti-Matter Projector"
 RUS: "Анти-материальный проектор"
CA_AnAntimatterProjectorUsesA:
 Id: 50095
 ENG: "An anti-matter projector uses a massive array of anti-matter generating nodes to project a storm of highly unstable anti-matter shells towards a target. It has a 25% chance to bypass Shields."
 RUS: "Проектор антивещества использует массив узлов, генерирующих антивещество, чтобы проецировать на цель шторм очень нестабильных оболочек антивещества. Имеет 25% шанс обойти щиты."
CA_AntimatterTorpedo:
 Id: 50098
 ENG: "Anti-Matter Torpedo"
 RUS: "Антиматериальная торпеда"
CA_ASphereOfAntimatterContained:
 Id: 50099
 ENG: "A sphere of anti-matter contained in a magnetic field that releases upon impact, allowing the anti-matter to explode. Can be shot down. It has a 50% chance to bypass Shields."
 RUS: "Сфера антивещества, содержащаяся в магнитном поле, которое высвобождается при ударе, позволяя антивеществу взорваться. Может быть сбита. Имеет 50% шанс обойти щиты."
CA_PlasmaTorpedo:
 Id: 50100
 ENG: "Plasma Torpedo"
 RUS: "Плазменная торпеда"
CA_ASphereOfPlasmaContained:
 Id: 50101
 ENG: "A sphere of plasma contained in a magnetic field that releases upon impact, allowing the plasma sphere to explode. Can be shot down."
 RUS: "Сфера плазмы, содержащаяся в магнитном поле, которое высвобождается при ударе, позволяя плазменной сфере взорваться. Может быть сбита."
CA_Tech_HeavyAntiMatterWeaponry_Name:
 Id: 50102
 ENG: "Anti-Matter Weapons II"
 RUS: "Оружие антиматерии II"
CA_Tech_HeavyAntiMatterWeaponry_Desc:
 Id: 50103
 ENG: "Our scientists have made a breakthrough in their research towards matter / anti-matter reactions, granting us access to a new weapon."
 RUS: "Наши ученые совершили прорыв в своих исследованиях реакций материи и антивещества, предоставив нам доступ к новому оружию."
CA_EmpMineLauncher:
 Id: 50104
 ENG: "Emp Mine Launcher"
 RUS: "Пускатель ЭМИ мин"
CA_EmpMinesAttemptToStrike:
 Id: 50105
 ENG: "Emp mines attempt to strike vulnerable systems and sensors in an effort to temporarily stop ships from attacking. Vulnerable to PD weapons."
 RUS: "Мины ЭМИ пытаются поразить уязвимые системы и датчики, чтобы временно остановить атаки кораблей. Уязвим к ТЗ-оружию."
CA_ShieldBusterMineLauncher:
 Id: 50108
 ENG: "Shield Buster Mine Launcher"
 RUS: "Пускатель анти-щитовых мин"
CA_ShieldBusterMinesSpecializeIn:
 Id: 50109
 ENG: "Shield buster mines specialize in quickly depleting the shields of enemy ships. Vulnerable to PD weapons."
 RUS: "Мины-разрушители щитов специализируются на быстром разрушении щитов вражеских кораблей. Уязвим к ТЗ-оружию."
CA_AntiarmorMineLauncher:
 Id: 50110
 ENG: "Anti-Armor Mine Launcher"
 RUS: "Пускатель мин \"Анти-броня\""
CA_AntiarmorMinesAreArmedWith:
 Id: 50111
 ENG: "Anti-armor mines are armed with special high explosive charges to penetrate even the thickest hulls. Vulnerable to PD weapons."
 RUS: "Противобронные мины оснащены специальными фугасными зарядами, способными пробивать даже самые толстые корпуса. Уязвим к ТЗ-оружию."
CA_SmallMineLauncher:
 Id: 50112
 ENG: "Small Mine Launcher"
 RUS: "Малый минный пускатель"
CA_TheSmallMineLauncherCasts:
 Id: 50113
 ENG: "The small mine launcher casts out a single explosive mine. Lacks the operating range of the larger versions but can easily be mounted on smaller hulls. Vulnerable to PD weapons."
 RUS: "Маленькая минная установка выбрасывает одну фугасную мину. Может быть легко установлена на меньшие корпуса. Уязвим к ТЗ-оружию."
CA_HeavyPhasedTurretMk2:
 Id: 50114
 ENG: "Heavy Phased Turret Mk2"
 RUS: "Тяжелая фазовая турель II"
CA_TheHeavyPhasedTurretIs2:
 Id: 50115
 ENG: "The Heavy Phased Turret is used mainly vs. Small Craft, as it is designed to override the target's shields. Mk2 projectiles offer more damage and better efficiency vs. Armor."
 RUS: "Тяжелая фазовая турель используется в основном против малых судов, так как предназначена для преодоления щитов цели. Улучшенные снаряды предлагают больший урон и лучшую эффективность поражения брони."
CA_HeavyPhasedTurretMk3:
 Id: 50116
 ENG: "Heavy Phased Turret Mk3"
 RUS: "Тяжелая фазовая турель III"
CA_TheHeavyPhasedTurretIs3:
 Id: 50117
 ENG: "The Heavy Phased Turret is used mainly vs. Small Craft, as it is designed to override the target's shields. Mk3 projectiles offer more damage and better efficiency vs. Armor and also explode upon impact."
 RUS: "Тяжелая фазовая турель используется в основном против малых судов, так как предназначена для преодоления щитов цели. Снаряды наносят больший урон и лучше справляются с броней. А также взрываются при попадании."
CA_LightPhasedTurretMk:
 Id: 50118
 ENG: "Light Phased Turret Mk2"
 RUS: "Фазовая пушка II"
CA_TheLightPhasedTurretIs:
 Id: 50119
 ENG: "The Light Phased Turret is used mainly vs. Small Craft, as it is designed to override the target's shields. Mk2 projectiles offer more damage and better efficiency vs. Armor."
 RUS: "Легкая фазовая защитная турель используется в основном против малых судов, так как предназначена для преодоления щитов цели. Улучшенные снаряды предлагают больший урон и лучшую эффективность поражения брони."
CA_LightPhasedTurretMk2:
 Id: 50120
 ENG: "Light Phased Turret Mk3"
 RUS: "Фазовая пушка III"
CA_TheLightPhasedTurretIs2:
 Id: 50121
 ENG: "The Light Phased Turret is used mainly vs. Small Craft, as it is designed to override the target's shields. Mk3 projectiles offer more damage and better efficiency vs. Armor and also explode upon impact."
 RUS: "Легкая фазовая турель используется в основном против малых судов, так как предназначена для преодоления щитов цели. Новые боеприпасы обеспечивают больший урон и лучшую эффективность поражения брони.А также взрываются при попадании."
CA_LightPhasedTurretMk3:
 Id: 50122
 ENG: "Light Phased Turret Mk1"
 RUS: "Фазовая пушка I"
CA_TheLightPhasedTurretIs3:
 Id: 50123
 ENG: "The Light Phased Turret is used mainly vs. Small Craft, as it is designed to override the target's shields. MkI projectiles are not very good vs. Armor."
 RUS: "Легкая фазовая турель используется в основном против малых судов, поскольку она предназначена для преодоления щитов цели. Снаряды этой пушки не очень хороши против брони."
CA_MrmMk:
 Id: 50130
 ENG: "MRM Mk3"
 RUS: "MRM III"
CA_ThisMrmPlatformLaunchesA:
 Id: 50131
 ENG: "This MRM platform launches a salvo of 8 missiles at unsuspecting targets. This weapon can easily overwhelm even the most potent point defense systems with its Terminal Phase system and ability to sometimes penetrate shields."
 RUS: "Эта платформа MRM запускает залп из 8 ракет по ничего не подозревающим целям. Это оружие может легко сокрушить даже самые мощные системы точечной защиты с его системой конечной фазы."
CA_RailgunTurret:
 Id: 50132
 ENG: "Railgun Turret"
 RUS: "Тяжелый рельсотрон"
CA_TwoRailgunsMountedOnA:
 Id: 50133
 ENG: "Two railguns mounted on a swivel turret. A very efficient weapon system."
 RUS: "Два рельсотрона на поворотной платформе. Очень эффективная система вооружения."
CA_GaussSniperCannonAp:
 Id: 50134
 ENG: "Gauss Sniper Cannon AP"
 RUS: "Снайперская пушка Гаусса AP"
CA_AHighSpeedGaussRifle2:
 Id: 50135
 ENG: "A high speed Gauss rifle with great range and damage, armed with armor piercing rounds."
 RUS: "Скоростная винтовка Гаусса с большой дальностью и уроном, вооруженная бронебойными снарядами."
CA_GaussSniperCannonHeap:
 Id: 50136
 ENG: "Gauss Sniper Cannon HEAP"
 RUS: "Снайперская пушка Гаусса HEAP"
CA_AHighSpeedGaussRifle3:
 Id: 50137
 ENG: "A high speed Gauss rifle with great range and damage, armed with high explosive armor piercing rounds."
 RUS: "Скоростная винтовка Гаусса с большой дальностью и уроном, вооруженная фугасными бронебойными снарядами."
CA_Tech_MissileWeapons_Name:
 Id: 50138
 ENG: "Guided Weapons"
 RUS: "Управляемое оружие"
CA_Tech_MissileWeapons_Desc:
 Id: 50139
 ENG: "Research and discover a wide array of guided, self propelled weapon systems."
 RUS: "Исследуйте и откройте широкий спектр управляемых систем вооружения."
CA_Tech_Anti-fighterMissiles_Name:
 Id: 50140
 ENG: "Anti-Fighter Missiles I"
 RUS: "Ракеты анти истребитель I"
CA_Tech_Anti-fighterMissiles_Desc:
 Id: 50141
 ENG: "This set of technologies will improve our ability to effectively combat the many smaller ships on a battlefield. In addition to anti-fighter missiles which can be equiped on our own fighters, we can also manufacture Storm weapons for our larger vessels, swivel turrets that are excellent at targeting small enemy ships."
 RUS: "Этот набор технологий улучшит нашу способность эффективно сражаться с множеством небольших кораблей на поле боя. В дополнение к ракетам, которые могут быть установлены на наших собственных истребителях, мы также можем производить штормовое оружие для наших более крупных судов, поворотные турели, которые отлично подходят для поражения небольших кораблей противника."
CA_Tech_SniperSystems_Name:
 Id: 50142
 ENG: "Sniper Systems"
 RUS: "Снайпер системы"
CA_Tech_SniperSystems_Desc:
 Id: 50143
 ENG: "The Gauss Cannon is a type of projectile accelerator consisting of one or more coils used as electromagnets in the configuration of a linear motor that accelerate a ferromagnetic or conducting projectile to high velocity. We can create cannons which use electro magnet accelerators to fire very accurate and very high speed projectiles. Hence the name - \"Sniper\""
 RUS: "Пушка Гаусса - это тип ускорителя снарядов, состоящий из одной или нескольких катушек, используемых в качестве электромагнитов в конфигурации линейного двигателя, который ускоряет ферромагнитный или проводящий снаряд до высокой скорости. Мы можем создавать пушки, которые используют электромагнитные ускорители для стрельбы очень точными и очень скоростными снарядами. Отсюда и название - \"Снайпер\"."
CA_Tech_SniperSystemsAP_Name:
 Id: 50144
 ENG: "Sniper Systems AP"
 RUS: "Снайпер системы AP"
CA_Tech_SniperSystemsAP_Desc:
 Id: 50145
 ENG: "We can now modify our Gauss Cannon projectile to use armor penetrating components while maintaining almost the same accuracy and speed."
 RUS: "Теперь мы можем модифицировать наш снаряд пушки  \"Гаусса\" чтобы использовать компоненты, пробивающие броню, при сохранении почти той же точности и скорости."
CA_Tech_SniperSystemsHEAP_Name:
 Id: 50146
 ENG: "Sniper Systems HEAP"
 RUS: "Снайпер системы HEAP"
CA_Tech_SniperSystemsHEAP_Desc:
 Id: 50147
 ENG: "The addition of High Explosives to our sniper cannons could make them even more useful."
 RUS: "Добавление взрывчатки к нашим снайперским пушкам может сделать их еще более смертоносными."
CA_Tech_PhasedDefenseI_Name:
 Id: 50148
 ENG: "Phased Defense I"
 RUS: "Фазирование защиты I"
CA_Tech_PhasedDefenseI_Desc:
 Id: 50149
 ENG: "The Phased Defense Turret is a small turret which is used mainly as Anti-Fighter Defense. The projectiles contain electronics measures to try and time the shield frequencies of the target and override them. These can be very effective vs. small craft, which tend to rely on shields for protection. Unfortunately, they deal less damage vs. Armor."
 RUS: "Турель с поэтапной защитой - это небольшая турель, которая используется в основном для защиты от истребителей.  Снаряды содержат электронные средства измерения, чтобы попытаться измерить частоты щита цели и преодолеть их.  Они могут быть очень эффективными против небольших кораблей, которые, как правило, полагаются на щиты для защиты."
CA_Tech_PhasedDefenseII_Name:
 Id: 50150
 ENG: "Phased Defense II"
 RUS: "Фазирование защиты II"
CA_Tech_PhasedDefenseII_Desc:
 Id: 50151
 ENG: "Iprovements in electronics and balistics led to more effective Phased Defense Mk1 projectiles. These require redesign of the turrets, but they provide more chance to phased through armor, and also provide benefits in almost any aspect, when compared to the Mk1 Turrets."
 RUS: "Усовершенствования в электронике и баллистике привели к созданию более эффективных снарядов.  Это требует изменения конструкции турелей, но они дают больше шансов поэтапно пройти через броню, а также дают преимущества практически во всех аспектах по сравнению с турелями Mk1."
CA_Tech_PhasedDefenseIII_Name:
 Id: 50152
 ENG: "Phased Defense III"
 RUS: "Фазирование защиты III"
CA_Tech_PhasedDefenseIII_Desc:
 Id: 50153
 ENG: "Iprovements in electronics and balistics led to more effective Phased Defense Mk2 projectiles. These require redesign of the turrets, but they provide more chance to phased through armor, and also provide benefits in almost any aspect, when compared to the Mk2 Turrets, including explosion characteristics."
 RUS: "Улучшения в электронике и баллистике привели к появлению более эффективных снарядов.  Это требует изменения конструкции турелей, но они дают больше шансов для поэтапного прохождения брони, а также дают преимущества практически во всех аспектах по сравнению с турелями Mk2, включая характеристики взрыва."
CA_ManufacturingPlantModule:
 Id: 50154
 ENG: "Manufacturing Plant Module"
 RUS: "Производственный колонизатор"
CA_ThisModuleContainsASmall:
 Id: 50155
 ENG: "This module contains a small manufacturing plant, providing a +0.25 bonus to production per richness of the newly colonized planet. It also contains some colonists (less than the normal Colony Module) for starting a colony."
 RUS: "Этот модуль содержит небольшой завод, обеспечивающий бонус +0,25 к производству на богатство вновь колонизированной планеты. Колонизатор также содержит несколько колонистов и снаряжения(меньше, чем обычный модуль колонизации) для жизни колонии."
CA_FoodReplicatorModule:
 Id: 50156
 ENG: "Food Replicator Module"
 RUS: "Сельхоз колонизатор"
CA_ThisModuleContainsASmall2:
 Id: 50157
 ENG: "This module contains a small food replicator, providing a +0.5 bonus to food on the newly colonized planet. It also contains some colonists (less than the normal Colony Module) for starting a colony."
 RUS: "Этот модуль содержит небольшой пищевой репликатор, обеспечивающий бонус +0,5 к еде на новой колонизированной планете. Он также содержит несколько колонистов (меньше, чем обычный модуль колонизации) для освоения колонии."
CA_HeavyGravCannon:
 Id: 50158
 ENG: "Heavy Grav Cannon"
 RUS: "Тяжелая гравитонная пушка"
CA_ThisHeavyCannonFiresA:
 Id: 50159
 ENG: "This heavy cannon fires a lethal volley of Graviton particles, compressed in a high density tritanium coating. Upon impact, this coating ruptures, releasing an extremely violent tide of gravitational forces. Shields will lessen its destructive power, however."
 RUS: "Эта тяжелая пушка стреляет смертоносным залпом частиц Гравитона, сжатых в тритановое покрытие высокой плотности.  При ударе это покрытие разрывается, высвобождая чрезвычайно сильный поток гравитационных сил.  Однако щиты хорошо сдерживают эту разрушительную силу."
CA_ResearchModule:
 Id: 50164
 ENG: "Research Module"
 RUS: "Научный колонизатор"
CA_ThisModuleContainsASmall3:
 Id: 50165
 ENG: "This module contains a small laboratory, providing a +0.15 bonus to research on the newly colonized planet. It also contains colonists for starting a colony."
 RUS: "Этот модуль содержит небольшую лабораторию, обеспечивающую бонус +0,15 к исследованиям на недавно колонизированной планете.  Он также содержит колонистов и припасы для создания колонии."
CA_SmallLaboratory:
 Id: 50166
 ENG: "Small Laboratory"
 RUS: "Малая лаборатория"
CA_TheSmallLaboratoryAllowsYour:
 Id: 50167
 ENG: "The small laboratory allows your scientists to get started with research efforts, mainly on new colonies with harsh environments. It is usually deployed by a Colony Ship and its biggest advantage is that it can be built even on uninhabitable tiles. But costs are high when built out of scope of a Colony Ship."
 RUS: "Небольшая лаборатория позволяет нашим ученым приступить к исследовательской работе, в основном на новых колониях и в суровых условиях.  Обычно устанавливается с колониального корабля, и ее самым большим преимуществом является то, что она может быть построена даже на непригодной для жизни территонии.  Но стоимость постройки вне колониального корабля высока."
CA_ResearchPerTurnStorage:
 Id: 50168
 ENG: "+0.15 research per turn, +40 Storage"
 RUS: "+0.15 к исследованиям, +40 места на складе"
CA_ManufacturingPlant:
 Id: 50169
 ENG: "Manufacturing Plant"
 RUS: "Завод"
CA_TheManufacturingPlantMakesAll:
 Id: 50170
 ENG: "The manufacturing plant makes all kinds of useful items for early colony development and is usually deployed by a colony ship. Its biggest advantage is that it can be built even on uninhabitable tiles. But costs are high if built out of scope of a colony ship."
 RUS: "Завод производит всевозможные полезные предметы для раннего развития колонии и обычно размещается на корабле колонизации.  Его самым большим преимуществом является то, что его можно построить даже на непригодной для проживания клетке."
CA_ProductionPerRichnessStorage:
 Id: 50171
 ENG: "+0.25 Production per Richness, +30 Storage"
 RUS: "+0.25 продукции за богатство, +30 места в складе"
CA_FoodReplicator:
 Id: 50172
 ENG: "Food Replicator"
 RUS: "Пищевой репликатор"
CA_TheFoodReplicatorProvidesHealthy:
 Id: 50173
 ENG: "The food replicator provides healthy, replicated food for a colony. Replication amounts are rather low, but it can be enough for an early stage colony, and might be sufficient for small mining colonies as well. Its biggest advantage is that it can be built even on uninhabitable tiles. But costs are high if built out of scope of a colony ship."
 RUS: "Репликатор пищи обеспечивает здоровую, воспроизведенную пищу для колонии.  Количество репликации довольно низкое, но этого может быть достаточно для колонии на ранней стадии, а также может быть достаточно для небольших колоний горняков.  Его самым большим преимуществом является то, что его можно построить даже на непригодной для проживания клетке"
CA_FoodPerTurn:
 Id: 50174
 ENG: "+0.5 food per turn"
 RUS: "+0.5 еды за ход"
CA_MilitaryOutpostModule:
 Id: 50175
 ENG: "Military Outpost Module"
 RUS: "Военный колонизатор"
CA_ThisModuleWillDeployA:
 Id: 50176
 ENG: "This module will deploy a Military Outpost to defend your colony along with a modest number of colonists."
 RUS: "Этот модуль развернет военный форпост для защиты нашей колонии, вместе со скромным количеством колонистов и припасов."
CA_MissileSiloModule:
 Id: 50177
 ENG: "Missile Silo Module"
 RUS: "Оборонительный колонизатор"
CA_ThisModuleWillDeployA2:
 Id: 50178
 ENG: "This module will deploy a missile silo for long range colony defense along with a modest number colonists."
 RUS: "Этот модуль развернет ракетную шахту для защиты колонии на орбитальном расстоянии, вместе с небольшим количеством колонистов и припасов."
CA_Tech_AdvancedPlanetaryDefense_Name:
 Id: 50179
 ENG: "Planetary Defense III"
 RUS: "Планетарная оборона III"
CA_Tech_ImprovedPlanetaryDefense_Name:
 Id: 50180
 ENG: "Planetary Defense II"
 RUS: "Планетарная оборона II"
CA_PlanetarySniperCannonEmplacement:
 Id: 50181
 ENG: "Planetary Sniper Cannon Emplacement"
 RUS: "Установка планетарной снайперской пушки"
CA_GreatRangeAndPinpointAccuracy:
 Id: 50182
 ENG: "Great range and pinpoint accuracy make these planetary weapon emplacements stand out."
 RUS: "Большая дальность и высокая точность-особенность этого планетарного оружия."
CA_Tech_MissileDefense_Name:
 Id: 50184
 ENG: "Missile Defense I"
 RUS: "Ракетная защита I"
CA_Tech_AdvancedMissileDefense_Name:
 Id: 50185
 ENG: "Missile Defense II"
 RUS: "Ракетная защита II"
CA_Tech_AdvancedMissileDefense_Desc:
 Id: 50186
 ENG: "It is wise to improve our planetary defense abilities with weapons that can deter invaders. A series of giant SAM launchers should be a good start."
 RUS: "Целесообразней улучшить наши способности к планетарной защите с помощью оружия, которое может отпугнуть захватчиков.  Хорошим началом должна стать серия гигантских пусковых установок ЗРК."
CA_DragonsBreathShotgun:
 Id: 50187
 ENG: "Dragons Breath Shotgun"
 RUS: "Дробовик \"Дыхание Дракона\""
CA_TheDragonsBreathShotgunIs:
 Id: 50188
 ENG: "The Dragons Breath shotgun is a close combat weapon. The burning plasma rounds fired by this shotgun are designed to superheat the exposed areas it hits, melting away any defenses the ships might have."
 RUS: "Дробовик \"Дыхание дракона\" - оружие ближнего боя.  Горящие плазменные снаряды, выпущенные из этого дробовика, предназначены для перегрева пораженных участков, уничтожая любую защиту, которая может быть у кораблей."
CA_ExplosiveShellsShotgun:
 Id: 50189
 ENG: "Explosive Shells Shotgun"
 RUS: "Разрывной дробовик"
CA_TheEsShotgunIsA:
 Id: 50190
 ENG: "The E.S. shotgun is a close combat weapon. It is equipped with high explosive shells, dealing damage in a large area."
 RUS: "Оружие ближнего боя.Дробовик оснащен фугасными снарядами, наносящими урон по большой площади."
CA_EnergizerShotgun:
 Id: 50191
 ENG: "Energizer Shotgun"
 RUS: "ЭМИ дробовик"
CA_TheHveShotgunIsA:
 Id: 50192
 ENG: "The H.V.E shotgun is a close combat weapon. It is equipped with high velocity emp shells, capable of immobilizing enemy ships for short periods of time."
 RUS: "Дробовик электро-магнитного импульса, оружие ближнего боя. Он оснащен высокоскоростными эмп-снарядами, способными вызывать збои в электронике вражеских кораблей на короткие промежутки времени."
CA_RepeaterShotgun:
 Id: 50193
 ENG: "Repeater Shotgun"
 RUS: "Дробовик с повторотелем"
CA_TheRepeaterShotgunIsA:
 Id: 50194
 ENG: "The Repeater shotgun is a close combat weapon, and a close cousin to the Flechette shotgun. It fires non-stop until it either runs out of ammo or destroys its target. It also has Light Armor Penetration ability, though not so good vs. armor it cannot penatrate."
 RUS: "Дробовик с механизмом повторного выстрела - оружие ближнего боя и близкий родственник дробовику \"Флешетта\".  Он стреляет без остановки, пока не закончатся патроны или не уничтожиться цель.  У него также есть способность к пробитию легкой брони.."
CA_Tech_ShotgunEmpRounds_Desc:
 Id: 50195
 ENG: "Shotguns are close combat weapons. They are designed to do heavy damage spread over an area. Depending on the type of ammo used, they can do different types of damage. These weapons fire fast and are accurate."
 RUS: "Это вооружение восновном имеет большую площать поражения на не большой дистанциии из-за этого его именуют \"Дробовиками\" .В зависимости от типа используемых боеприпасов они могут наносить разный урон.  Это оружие стреляет быстро и точно."
CA_Tech_Shotguns_Name:
 Id: 50196
 ENG: "Shotguns"
 RUS: "Дробовики"
CA_Tech_ShotgunEmpRounds_Name:
 Id: 50197
 ENG: "Shotgun Emp Rounds"
 RUS: "ЭМИ дробовик"
CA_Tech_ShotgunRepeater_Name:
 Id: 50198
 ENG: "Shotgun Repeater"
 RUS: "Дробовик с повторителем"
CA_Tech_ShotgunExplosiveRounds_Name:
 Id: 50199
 ENG: "Shotgun Explosives"
 RUS: "Разрывной дробовик"
CA_Tech_ShotgunPlasmaRounds_Name:
 Id: 50200
 ENG: "Shotgun Plasma"
 RUS: "Плазменный дробовик"
CA_PlasmaCannon:
 Id: 50205
 ENG: "Plasma Cannon"
 RUS: "Плазменная пушка"
CA_ThisPlasmaCannonIsBest:
 Id: 50206
 ENG: "This plasma cannon is best mounted on frigates. It fires a stream of plasma shells towards unsuspecting targets."
