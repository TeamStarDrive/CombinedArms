 Id: 5406
 ENG: "Heavy and rapid suppressive fire from these auto cannons should deter any unwelcome vessels from landing on our planets."
 RUS: "Мощный и быстрый подавляющий огонь из этих автоматических пушек, должен удержать  любые шатлы от высадки на наши планеты."
CA_CloudPeakMissileEmplacement:
 Id: 5408
 ENG: "Cloud Peak Missile Emplacement"
 RUS: "Ракетная установка \"Облачный пик\""
CA_CloudPeakSurfaceToSpace:
 Id: 5409
 ENG: "Cloud Peak surface to space guided MIRV missiles have extreme range and are capable of providing defensive control over most of an entire star system."
 RUS: "Ракеты \"Облачный пик\" с наведением \"земля-космос\".Эти ракеты обладают большой дальностью и способны обеспечить оборонительный контроль над большей частью всей звездной системы."
CA_Tech_CeramicArmor_Name:
 Id: 6563
 ENG: "Ceramic Armor"
 RUS: "Керамическая броня"
CA_ThisArmorIsSlightlyStronger:
 Id: 6564
 ENG: "This Armor is slightly stronger than Reactive Armor, weighing less but costing more. It's Kinetics Resistance is improved and it has some Beam Resistance. It also nullifies the effect of Armor Piercing I."
 RUS: "Эта броня немного прочнее чем реактивная броня, она меньше весит, но стоит дороже. Ее кинетическое сопротивление улучшено, и есть некоторое сопротивление лучевому оружею. Аннулирует эффект \"Пробитие брони I\""
CA_Tech_CompositeAlloys_Name:
 Id: 6569
 ENG: "Composite Alloys"
 RUS: "Композитные сплавы"
CA_TwiceAsStrongAsSteel:
 Id: 6570
 ENG: "Twice as strong as Steel Armor, a little bit lighter, and 4 times the cost. This armor provides better Resistance vs. Kinetics and Beams, and it has some Resistance vs. Energy Projectiles. It also nullifies the effect of Armor Piercing I"
 RUS: "В два раза прочнее стальной брони, немного легче и в 4 раза дороже. Эта броня обеспечивает лучшее сопротивление кинетике и лучам, а также имеет некоторое сопротивление против энергетических снарядов. Аннулирует эффект \"Пробитие брони I\""
CA_CompositeAlloysSmall:
 Id: 6571
 ENG: "Composite Alloys Small"
 RUS: "Малая композитная броня"
CA_CompositeAlloysMedium:
 Id: 6572
 ENG: "Composite Alloys Medium"
 RUS: "Средняя композитная броня"
CA_CompositeAlloysLarge:
 Id: 6573
 ENG: "Composite Alloys Large"
 RUS: "Большая композитная броня"
CA_Tech_CrystalArmor_Name:
 Id: 6574
 ENG: "Crystal Armor"
 RUS: "Кристальная броня"
CA_ThisArmorIsVeryExpensive:
 Id: 6575
 ENG: "This armor is very expensive to process, yet is almost as strong as Composite Alloy Armor, while managing to weigh much less. It offers improvment in Kinetic, Beam and Energy Resistances, while have some Explosion Resistance as well. It also nullifies the effect of Armor Piercing II"
 RUS: "Эта броня очень дорогая в обработке, но почти такая же прочная, как и броня из композитного сплава, при этом весит намного меньше. Она предлагает улучшение кинетического, лучевого и энергетического сопротивления, а также имеет некоторое сопротивление взрывам. Аннулирует эффект \"Пробитие брони II\""
CA_CrystalArmorSmall:
 Id: 6576
 ENG: "Crystal Armor Small"
 RUS: "Малая кристалическая броня"
CA_CrystalArmorMedium:
 Id: 6577
 ENG: "Crystal Armor Medium"
 RUS: "Средняя кристалическая броня"
CA_CrystalArmorLarge:
 Id: 6578
 ENG: "Crystal Armor Large"
 RUS: "Большая кристалическая броня"
CA_NewGenerationOfCeramicArmor:
 Id: 6579
 ENG: "New generation of Ceramic Armor."
 RUS: "Керамическая броня нового поколения."
CA_CeramicArmorSmall:
 Id: 6580
 ENG: "Ceramic Armor Small"
 RUS: "Малая керамическая броня"
CA_CeramicArmorMedium:
 Id: 6581
 ENG: "Ceramic Armor Medium"
 RUS: "Средняя керамическая броня"
CA_CeramicArmorLarge:
 Id: 6582
 ENG: "Ceramic Armor Large"
 RUS: "Большая керамическая броня"
CA_Tech_FusionReactor_Name:
 Id: 8045
 ENG: "Fusion Reactor"
 RUS: "Термоядерный реактор"
CA_ASlightlyBetterVersionOf:
 Id: 8046
 ENG: "A slightly better version of the older Nuclear reactor. It will explode if destroyed, but it provides more power while also being a little sturdier."
 RUS: "Немного лучшая версия старого ядерного реактора,он вырабатывает больше энергии и немного прочнее.Но при уничтожении последует взрыв, сильнее чем взрыв атомного реактора."
CA_UpgradedXenoMines:
 Id: 8073
 ENG: "Upgraded Xeno mines"
 RUS: "Модернизированные ксено шахты"
CA_TheseMinesAreEquippedWith:
 Id: 8074
 ENG: "These mines are equipped with better technology for exploiting more of the planet's mineral deposits. Their byproducts can be sold in local markets, yielding small income."
 RUS: "Эти шахты оснащены более совершенными технологиями для разработки большего количества месторождений полезных ископаемых планеты. Их побочные продукты могут продаваться на местных рынках, принося небольшой доход."
CA_Tech_InvasiveMining_Name:
 Id: 8075
 ENG: "Invasive Mining"
 RUS: "Инвазивная добыча"
CA_Tech_InvasiveMining_Desc:
 Id: 8076
 ENG: "Developing efficient automation is a crucial step required to push a higher production output from our colonies, at a cost of environmental damage."
 RUS: "Разработка эффективной автоматизации - важный шаг, необходимый для увеличения объемов производства в наших колониях за счет ущерба окружающей среде."
CA_RoboticFactory:
 Id: 8077
 ENG: "Robotic Factory"
 RUS: "Робототехническая фабрика"
CA_ARoboticFactoryAGreat:
 Id: 8078
 ENG: "A Robotic Factory. A great technological marvel. These factories use robots for production and are fully automated. These factories exploit minerals without relation to the Planet's Mineral Richness, but this comes at a cost of putting major strain on the planet's environment."
 RUS: "Робототехническая фабрика. Великое технологическое чудо. Эти заводы используют роботов для производства и полностью автоматизированы. Эти фабрики эксплуатируют полезные ископаемые, не зависящие от минерального богатства планеты, но это происходит за счет серьезной нагрузки на окружающую среду планеты."
CA_SmallTorpedoTube:
 Id: 8207
 ENG: "Small Torpedo Tube"
 RUS: "Малый торпедный пускатель"
CA_SmallSensor:
 Id: 8241
 ENG: "Small Sensor"
 RUS: "Малый сенсор"
CA_InformationInWarIsMost:
 Id: 8242
 ENG: "Information in war is most crucial, with that mindset long range sensors were developed. Equiping a ship with a sensor module increases its detection range significantly."
 RUS: "Информация на войне имеет важнейшее значение, поэтому были разработаны датчики дальнего действия.  Оснащение корабля сенсорным модулем, значительно увеличивает дальность обнаружения вражеских кораблей."
CA_PlanetaryCustomsStation:
 Id: 10005
 ENG: "Planetary Customs Station"
 RUS: "Планетарный таможенный пост"
CA_ThePlanetaryCustomsStationMaintains:
 Id: 10006
 ENG: "The planetary customs station maintains a small fleet of vessels that board and inspect all ships moving throughout the system. This ensures that all customs and taxes are paid. It also adds some storage space."
 RUS: "Планетарный таможенный пост содержит небольшой флот судов, которые садятся на борт и проверяют все суда, движущиеся по системе.  Это гарантирует уплату всех таможенных пошлин и налогов. Также добавляет немного места для хранения ресурсов."
CA_GalacticStockExchange:
 Id: 10009
 ENG: "Galactic Stock Exchange"
 RUS: "Галактическая фондовая биржа"
CA_TheGalacticStockExchangeIs:
 Id: 10010
 ENG: "The Galactic Stock Exchange is the central place where stocks of galactic mega-corporations are traded. The proceeds can be taxed. There can be only one of these per empire."
 RUS: "Галактическая фондовая биржа - это центральное место, где идут торги акций галактических мегакорпораций.  Выручка может облагаться налогом. В каждой империи может быть только один из них."
CA_ParticleAccelerator:
 Id: 10019
 ENG: "Particle Accelerator"
 RUS: "Ускоритель частиц"
CA_PlanetaryStockExchange:
 Id: 10021
 ENG: "Planetary Stock Exchange"
 RUS: "Планетарная фондовая биржа"
CA_ThePlanetaryStockExchangeAllows:
 Id: 10022
 ENG: "The Planetary Stock exchange allows stocks of planetary companies to be traded. This improves commerce on the planet and thus tax revenue."
 RUS: "Планетарная фондовая биржа позволяет торговать акциями планетарных компаний.  Это улучшает торговлю на планете и, следовательно, налоговые поступления."
CA_SoilEnrichmentCenter:
 Id: 10027
 ENG: "Soil Enrichment Center"
 RUS: "Центр обогащения почвы"
CA_InAnAttemptToImprove:
 Id: 10028
 ENG: "In an attempt to improve agricultural output, the planet's soil is enriched to support plant growth. Though increasing small amount of fertility, the building is cheap to build and maintain."
 RUS: "В попытке улучшить сельскохозяйственное производство почва планеты обогащается, чтобы поддерживать рост растений, повышая плодородие."
CA_WeatherManipulationCenter:
 Id: 10033
 ENG: "Weather Manipulation Center"
 RUS: "Центр управления погодой"
CA_UsingAdvancedComputersAndA:
 Id: 10034
 ENG: "Using advanced computers and a network of specialized satellites, this buildings monitors the global weather and directs measures to manipulate it to improve plant growth. This increases the average fertility of the planet."
 RUS: "Используя современные компьютеры и сеть специализированных спутников, это здание отслеживает глобальную погоду и направляет меры по управлению ею для улучшения роста растений.  Это увеличивает среднюю плодородность планеты."
CA_Tech_SoilEnrichment_Name:
 Id: 10041
 ENG: "Soil Enrichment"
 RUS: "Обогащение почвы"
CA_Tech_SoilEnrichment_Desc:
 Id: 10042
 ENG: "Combining artificial and natural fertilizer, we can improve a planet's fertility to increase agricultural output."
 RUS: "Комбинируя искусственные и натуральные удобрения, мы можем улучшить плодородие планеты для увеличения сельскохозяйственного производства."
CA_Tech_WeatherManipulation_Name:
 Id: 10045
 ENG: "Weather Manipulation"
 RUS: "Манипуляции с погодой"
CA_Tech_WeatherManipulation_Desc:
 Id: 10046
 ENG: "By manipulating a planet's climate, we can decrease devastating weather effects while preserving the optimal conditions for plant growth. In effect, this increases a planet's fertility."
 RUS: "Управляя климатом планеты, мы можем уменьшить разрушительные погодные эффекты, сохраняя при этом оптимальные условия для роста растений.  Фактически это увеличивает плодородие планеты."
CA_Tech_ParticleAcceleration_Name:
 Id: 10059
 ENG: "Particle Accelerator"
 RUS: "Ускоритель частиц"
CA_Tech_ParticleAcceleration_Desc:
 Id: 10060
 ENG: "The last remaining questions about the origin of the universe can be answered by taking the smallest parts of it and smashing them together."
 RUS: "На последние оставшиеся вопросы о происхождении Вселенной можно ответить, взяв самые маленькие ее части и столкнкв их между собой"
CA_Tech_ImperialCustoms_Name:
 Id: 10063
 ENG: "Imperial Customs"
 RUS: "Имперская таможня"
CA_Tech_ImperialCustoms_Desc:
 Id: 10064
 ENG: "Trade between planets must be regulated to protect the local economies, avoid ecological contamination, and, most of all, to ensure that the state get its cut of all proceeds."
 RUS: "Торговлю между планетами необходимо регулировать, чтобы защитить местную экономику, избежать загрязнения окружающей среды и, самое главное, чтобы государство получало долю от всех доходов."
CA_Tech_PlanetaryStockTrade_Name:
 Id: 10065
 ENG: "Planetary Stock Trade"
 RUS: "Планетарные акции"
CA_Tech_PlanetaryStockTrade_Desc:
 Id: 10066
 ENG: "Any planetary government seeking to stimulate economic growth would be well-advised to create a place where companies can find investors. The increase in tax revenue is just a bonus."
 RUS: "Любому планетарному правительству, стремящемуся стимулировать экономический рост, было бы целесообразно создать место, где компании могут найти инвесторов.  Увеличение налоговых поступлений - это просто бонус."
CA_Tech_GalacticStockTrade_Name:
 Id: 10069
 ENG: "Galactic Stock Trade"
 RUS: "Галактическое акционерство"
CA_Tech_GalacticStockTrade_Desc:
 Id: 10070
 ENG: "The level of revenue exchange our galactic mega-corporations require is far beyond the scope of what one planet can accommodate. It would be wise to create a single place in our empire where these corporations can meet with investors. It would be equally wise to tax them for it."
 RUS: "Уровень обмена доходов, который требуется нашим галактическим мегакорпорациям, выходит далеко за рамки того, что может вместить одна планета.  Было бы разумно создать в нашей империи единое место, где эти корпорации могли бы встречаться с инвесторами.  Было бы также разумно обложить их налогом."
CA_MediumCargoHold2:
 Id: 10333
 ENG: "Medium Cargo Hold"
 RUS: "Средний грузовой отсек"
CA_AdvancesInShipDesignAnd:
 Id: 10334
 ENG: "Advances in ship design and material science allow for much larger cargo holds to be constructed. This one holds 6 units of food, production or frozen colonists."
 RUS: "Достижения в области проектирования судов и материаловедения позволяют строить гораздо более крупные грузовые трюмы. В нем 6 единиц еды, продукции или замороженных колонистов."
CA_ContainerDeck:
 Id: 10337
 ENG: "Container Deck"
 RUS: "Контейнерная палуба"
CA_RatherThanRedesigningTheCargo:
 Id: 10338
 ENG: "Rather than redesigning the cargo hold, this new approach aims to redesign the cargo. By placing it in standardized, self-sufficient containers, we can maximize the amount of cargo carried."
 RUS: "Этот новый подход направлен не на изменение конструкции грузового отсека, а на изменение конструкции груза. Размещая его в стандартных самодостаточных контейнерах, мы можем максимально увеличить количество перевозимого груза."
CA_Tech_ImperialUni_Name:
 Id: 10344
 ENG: "Imperial University"
 RUS: "Имперский университет"
CA_Tech_ImperialUni_Desc:
 Id: 10345
 ENG: "Bringing together the best and brightest of our Empire will give huge benefits to research and engineering. In one place, our scientists and engineers can cooperate without the barrier of distance. Only one Imperial University can be built per empire."
 RUS: "Объединение лучших и самых ярких представителей нашей Империи принесет огромную пользу исследованиям и разработкам. В одном месте наши ученые и инженеры могут сотрудничать без ограничений. В каждой империи можно построить только один Имперский университет."
CA_SolarArray:
 Id: 12005
 ENG: "Solar Array"
 RUS: "Солнечный массив"
CA_SolarPanelsHarvestEnergyFrom:
 Id: 12006
 ENG: "Solar Panels harvest energy from stars to supplement a ships main power core."
 RUS: "Солнечные панели собирают энергию звезд, чтобы дополнить основной источник питания корабля."
CA_MostAdvancedPlanetaryShieldingTechnology:
 Id: 17415
 ENG: "Most advanced planetary shielding technology, preventing even heaviest planetary bombardment for a significant amount of time."
 RUS: "Мы можем укрепить территорию на колонизированных планетах, что затруднит наземное вторжение и орбитальные бомбардировки"
CA_DefensiveBuildingPlanetaryShieldsInjuries:
 Id: 17416
 ENG: "Defensive Building; +750 Planetary Shields, 2 injuries to each invading troop"
 RUS: "Оборонительное здание; +750 планетарных щитов, 2 ранения каждому вторгающемуся отряду"
CA_ExtremeRangeMissileDefense:
 Id: 17421
 ENG: "Extreme Range Missile Defense"
 RUS: "Противоракетная оборона большой дальности"
CA_FiresAutoCannonShellsInto:
 Id: 17422
 ENG: "Fires auto cannon shells into orbit"
 RUS: "Стрельба из автоматических пушек на орбиту"
CA_FiresLongRangeVeryRigid:
 Id: 17425
 ENG: "Fires long range, very rigid torpedoes."
 RUS: "Стреляет дальнобойными, очень жесткими торпедами."
CA_Tech_FusionReactor_Desc:
 Id: 17450
 ENG: "In a fusion reactor, the principle is that neutrons generated from Deuterium-Tritium fusion reactions will be absorbed into a blanket containing lithium, which surrounds the core. The lithium is then transformed into tritium (which is used to fuel the reactor) and helium. "
 RUS: "В термоядерном реакторе принцип состоит в том, что нейтроны, генерируемые реакциями синтеза дейтерия и трития, будут поглощаться бланкетом, содержащим литий, который окружает активную зону.  Затем литий превращается в тритий (который используется в качестве топлива для реактора) и гелий."
CA_Tech_Advanced_Powercells_Name:
 Id: 17689
 ENG: "Advanced Power Cells"
 RUS: "Продвинутые энерго-ячейки"
CA_Tech_Advanced_Powercells_Desc:
 Id: 17690
 ENG: "Advancements into new types battery technology allow us to manufacture higher capacity Power Cells. They are somewhat unstable and explode when destroyed."
 RUS: "Достижения в области технологий батарей нового типа, позволяют нам производить элементы питания большей емкости."
CA_SmallAdvancedPowerCell:
 Id: 17691
 ENG: "Small Advanced Power Cell"
 RUS: "Малая прод. энерго-ячейка"
CA_ThisSmallPowerCellCan:
 Id: 17692
 ENG: "This Small Power Cell can store 50% more power than the basic one and has better, lighter armor than the Small Power Cell."
 RUS: "Эта энерго-ячейка хранит на 50% больше энергии,чем базовая.Имеет легкое бронирование."
CA_MediumAdvancedPowerCell:
 Id: 17693
 ENG: "Medium Advanced Power Cell"
 RUS: "Средняя прод. энерго-ячейка"
CA_ThisMediumPowerCellCan:
 Id: 17694
 ENG: "This Medium Power Cell can store 50% more power than the basic one and has better, lighter armor than the Medium Power Cell."
 RUS: "Эта энерго-ячейка хранит на 50% больше энергии,чем базовая средняя ячейка.Имеет легкое бронирование."
CA_SystemDefenseTorpedo:
 Id: 17712
 ENG: "System Defense Torpedo"
 RUS: "Торпедная оборонная система"
CA_ThisPlanetaryDefenseEmplacementFires:
 Id: 17713
 ENG: "This planetary defense emplacement fires guided torpedoes over very long range. The torpedoes are huge and armored, thus physically resistant to point defense. A big colony with these buildings can be devastating to incoming enemy capital ships."
 RUS: "Эта планетарная оборонительная установка стреляет управляемыми торпедами на очень большие расстояния.  Торпеды большие и бронированные, поэтому физически устойчивы к точечной защите.  Большая колония с этими зданиями может быть разрушительной для приближающихся крупных кораблей противника."
CA_PirateHiddenTreasure:
 Id: 17736
 ENG: "Pirate Hidden Treasure"
 RUS: "Пиратское сокровище"
CA_FromOrbitItAppearsAs:
 Id: 17737
 ENG: "From Orbit, it appears as nothing out of the ordinary. However, your fleet commander insists these are the right coordinates, and ground troops should be sent to investigate."
 RUS: "С орбиты в этом нет ничего необычного. Однако командующий вашим флотом настаивает на том, что это правильные координаты, и следует отправить наземные войска для расследования."
CA_Tech_HighDensityHousing_Desc:
 Id: 17777
 ENG: "Special zones on the planet, specifically designed to house a large amount of the population while maintaining ordinary living standards. Our population will find them more than acceptable to live in."
 RUS: "Особые зоны на планете, специально предназначенные для проживания большого количества населения при нормальном уровне жизни. Наше население сочтет их более чем приемлемыми для проживания."
CA_Tech_MegaCities_Name:
 Id: 17778
 ENG: "Mega Cities"
 RUS: "Мегаполисы"
CA_Tech_MegaCities_Desc:
 Id: 17779
 ENG: "Mega Cities are designed to house as much population as is comfortably possible, featuring automated technology to maintain optimal living conditions. It features buildings that rise high into the sky, and bridges interconnecting them. Due to the structure's massive size as well as the resources devoted to construction, large amounts of material must be removed from the surrounding soil, reducing fertility on the planet by a small amount."
 RUS: "Мега-города спроектированы для размещения максимально возможного количества населения и оснащены автоматизированными технологиями для поддержания оптимальных условий жизни. В нем есть здания, которые поднимаются высоко в небо, и соединяющие их мосты. Из-за огромных размеров сооружения, а также ресурсов, затрачиваемых на строительство, необходимо удалить большое количество материала из окружающей почвы, что незначительно снизит плодородие на планете."
CA_ThisStructureWasSpecificallyDesigned:
 Id: 17780
 ENG: "This structure was specifically designed to house a large amount of the population while maintaining ordinary living standards. These zones can house 500 Million citizens."
 RUS: "Эта структура была специально разработана для размещения большого количества населения при сохранении нормального уровня жизни. Эти зоны могут вместить 500 миллионов жителей."
CA_MegaCity:
 Id: 17782
 ENG: "Mega City"
 RUS: "Мега Город"
CA_AMegaCityIsA:
 Id: 17783
 ENG: "A Mega City is a zone with high rise skyscrapers, dedicated to housing 1 Billion population in decent living conditions. Due to the loss of vast expanses of arable land, fertility is slightly reduced."
 RUS: "Мега-город - это зона с высотными небоскребами, предназначенная для проживания 1 миллиарда населения в достойных условиях. Из-за потери огромных просторов пашни немного снижается плодородие."
