 RUS: "Органическая броня потребляет энергию и создает небольшое количество боеприпасов для корабля, а также добавляет некоторые способности к ремонту корабля и самовосстановлению модуля. Она также способствует защите от ЭМИ и в некоторой степени устойчива к энергетическим снарядам и лучам. Аннулирует эффект \"Пробитие брони I\""
