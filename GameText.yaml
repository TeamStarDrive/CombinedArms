CA_ThisArmorIsTheCulmination:
 Id: 50365
 ENG: "This Armor is the culmination of the best solar armor technology we can create thus far. It is stronger, better amplifies shields, and generates better power flow. Since The armor also generates energy, it tends to yield a small explosion when destroyed."
 RUS: "Эта броня - кульминация лучшей технологии солнечной пластины, которую мы можем создать на данный момент. Она прочнее, лучше усиливает щиты и обеспечивает лучший забор солнечной энергии. Поскольку броня генерирует энергию, при разрушении она имеет тенденцию делать небольшой взрыв."
