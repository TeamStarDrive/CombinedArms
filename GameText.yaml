 RUS: "Продвинутая зенитная авто-пушка - более крупное и мощное скорострельное орудие, способное поражать истребители. Охватывает все направления (360 градусов)."
CA_AssaultCannonType:
 Id: 50408
 ENG: "Assault Cannon Type81"
 RUS: "Штурмовая пушка тип 81"
CA_TheGreatestAssaultCannonEver:
 Id: 50409
 ENG: "The greatest assault cannon ever designed. It now features a dual barrel, and fires two projectiles that have a substantial chance of penetrating enemy shields. A dedicated mounting rail allows this weapon to be installed on the inside of a ship. The compounds used in its ammunition will cause an explosion upon impact."
 RUS: "Величайшая штурмовая пушка из когда-либо созданных. Теперь она имеет двойной ствол и стреляет двумя снарядами, которые имеют существенный шанс пробить вражеские щиты. Специальная монтажная рейка позволяет установить это оружие внутри корабля. Составы, используемые в ее боеприпасах, при ударе вызовут взрыв."
CA_AssaultCannonType3:
 Id: 50412
 ENG: "Assault Cannon Type74"
 RUS: "Штурмовая пушка тип 74"
CA_AVeryLargeMassDriver:
 Id: 50413
 ENG: "A very large mass driver, aided by an integrated miniature warpdrive to propel a projectile. A dedicated mounting rail allows this weapon to be installed on the inside of a ship. It is effective against armor, but less effective against shields. In addition, the compounds used in its ammunition will cause an explosion upon impact."
 RUS: "Тип 74 это-двигатель очень большой массы, которому помогает встроенный миниатюрный варп-двигатель для приведения в движение снаряда. Специальная монтажная рейка позволяет установить это оружие внутри корабля. Она эффективена против брони, но менее эффективена против щитов. Кроме того, соединения, используемые в ее боеприпасах, при ударе вызовут взрыв."
CA_OverloadFusionReactor:
 Id: 50426
 ENG: "Overload Fusion Reactor"
 RUS: "Перегруженный термоядер.реактор"
CA_TheOverloadFusionReactorProduces:
 Id: 50427
 ENG: "The overload Fusion reactor produces more power by augmenting its fusion capabilities with other advanced technologies. As a result, its mass and cost are higher, and it is very fragile."
 RUS: "Термоядерный реактор с перегрузкой вырабатывает больше энергии,путем внедрения новых термоядерных технологий. В результате его масса больше, стоимость производства дороже и он очень хрупкий, а значит взрывоопасен."
CA_OverloadAntiMatterReactor:
 Id: 50428
 ENG: "Overload Anti Matter Reactor"
 RUS: "Перегруженный антиматер.реактор"
CA_TheOverloadAntimatterReactorWill:
 Id: 50429
 ENG: "The Overload Anti-Matter Reactor will provide 150% more power than a normal one. However, their inherent instability makes them fragile, and they have a small power supply range."
 RUS: "Этот реактор обеспечивает больше мощности, чем обычный. Однако присущая ему нестабильность делает его опасным при повреждении. Имеет большой диапазон питания."
CA_LinkedQuantumFusionSet:
 Id: 50430
 ENG: "Linked Quantum Fusion Set"
 RUS: "Сопряженный квантовый реактор"
CA_AProtectiveChamberContaningThe:
 Id: 50431
 ENG: "A protective chamber contaning the linked power output of 6 Quantum Fusion Reactors. The chamber is also equipped with a small auxiliary shield and damage control team, allowing it to contribute to ship repairs."
 RUS: "Защитная камера, содержащая связанную мощность 6 реакторов квантового синтеза. Камера также оборудована небольшим вспомогательным щитом и группой контроля повреждений, что позволяет ей вносить свой вклад в ремонт корабля."
CA_LinkedAntimatterSet:
 Id: 50432
 ENG: "Linked Anti-Matter Set"
 RUS: "Сопряженный антиматер.реактор"
CA_ARepurposedHangarContainingAntimatter:
 Id: 50433
 ENG: "A repurposed hangar containing 6 anti-matter reactors. The hangar comes equipped with a small auxiliary shield and a damage control team that can aid in ship repairs. Beware however, a powerful explosive blast will occur if the hangar is destroyed."
 RUS: "Переоборудованный ангар с 6 реакторами на антиматерии. Ангар оснащен небольшим вспомогательным щитом и командой по устранению повреждений, которая может помочь в ремонте корабля. Однако будьте осторожны, если защитный капусуль будет разрушен, произойдет мощный взрыв."
CA_ColdFusionReactor:
 Id: 50436
 ENG: "Cold Fusion Reactor"
 RUS: "Реактор холодного синтеза"
CA_AColdFusionReactorVery:
 Id: 50437
 ENG: "A Cold Fusion Reactor. Very stable, and won't collapse violently. To achieve this, we had to lower its power output, giving it the same energy production as our previous Fusion Reactors. The addition of an enclosed armor shell allows for a safer power output radius."
 RUS: "Этот реактор очень стабильный и не взрывается с большим ущербом. Чтобы достичь этого, нам пришлось снизить выходную мощность, она соотвествует предыдущему термоядерному реактору."
CA_ArmoredColdFusionReactor:
 Id: 50438
 ENG: "Large Fusion Reactor"
CA_BySacrificingASmallAmount:
 Id: 50439
 ENG: "Larger and more efficient Cold Fusion Reactor"
