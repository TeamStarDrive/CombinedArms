 RUS: "Нано шахта"
CA_AdvancedNanobotsWillAutomaticallySpread:
 Id: 50454
 ENG: "Advanced Nanobots will automatically spread out underground, bringing minerals to the surface. This has slight effect in the planet's environment, so caution is  advised before building it."
 RUS: "Продвинутые наноботы автоматически распространяются под землей, вынося минералы на поверхность. Это имеет небольшое влияние на окружающую среду планеты, поэтому рекомендуется соблюдать осторожность перед строительством."
CA_FertilityOnBuildProductionPer:
 Id: 50455
