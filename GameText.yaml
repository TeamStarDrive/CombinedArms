CA_ArmoredSolarpanelsProvidesSomePower:
 Id: 50353
 ENG: "Armored Solarpanels. Provides some power flow to space ships, at a lower rigidity and slightly higher price. This armor also has an interesting ability to slightly amplify installed shields in ships and streamline travel at warp. Since The armor also generates energy, it tends to yield a small explosion when destroyed."
 RUS: "некоторый поток энергии для космических кораблей с меньшей жесткостью и немного более высокой ценой. У этой брони также есть интересная способность немного усиливать установленные на кораблях щиты и упрощать перемещение в варпе. Поскольку броня также генерирует энергию, при разрушении она имеет тенденцию вызывать небольшой взрыв."
