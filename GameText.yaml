 ENG: "Turn Thrust -  Battleship "
 RUS: "Усилитель поворота III "
CA_TurnThrustersAreSmallThrusters3:
 Id: 50480
 ENG: "Turn Thrusters are small thrusters installed on the side of a ship. They can significantly increase a ship's turn rate."
 RUS: "Усилители поворота - это небольшие устройства, установленные на борту корабля. Они могут значительно увеличить скорость поворота корабля."
CA_TurnThrustTitan:
 Id: 50481
 ENG: "Turn Thrust - Titan"
 RUS: "Усилитель поворота IV"
CA_TurnThrustersAreSmallThrusters4:
 Id: 50482
 ENG: "Turn Thrusters are small thrusters installed on the side of a ship. They can significantly increase a ship's turn rate."
 RUS: "Усилители поворота - это небольшие устройства, установленные на борту корабля. Они могут значительно увеличить скорость поворота корабля."
CA_Xgcforanswer:
 Id: 50483
 ENG: "XGC-ForAnswer"
 RUS: "XGC \"ForAnswer\""
CA_TheMmExpGatlingCannon:
 Id: 50484
 ENG: "The 406mm Exp Gatling Cannon 'ForAnswer(XGC-63)' takes the term 'quantity over quality' to a whole new level, and will quickly turn any ship foolish enough to enter within its range into unrecyclable junk! It also eats through ammunition like it's going out of fashion. This gun is best used vs. big ships, as it's recoil is massive."
 RUS: "406-мм пушка Гатлинга \"ForAnswer (XGC-63)\" выводит термин \"количество важнее качества\" на совершенно новый уровень. Быстро превратит любой корабль, в непригодный для переработки мусор! Она пожерает боеприпасы, как будто они выходят из моды.Лучше всего использовать против больших кораблей."
CA_FighterGenerator:
 Id: 50499
 ENG: "Fighter Generator"
 RUS: "Реактор истребителя"
CA_ThisIsAnAdvancedFusion:
 Id: 50500
 ENG: "This is an advanced fusion powered fighter generator, combined with some of the new cold fusion tech. It is easier to be cooled in a fighter or corvette frames, therefore it is not available for larger hull types. It is still highly volatile upon destruction."
 RUS: "Это усовершенствованный реактор для истребителей, работающий на термоядерном синтезе, в сочетании с некоторыми новыми технологиями холодного синтеза. Его легче охладить в рамах истребителя или корвета, поэтому он недоступен для корпусов большего размера.По-прежнему очень нестабилен при повреждениях."
CA_FighterAsgTurret:
 Id: 50503
 ENG: "Fighter ASG Turret"
 RUS: "ASG установка"
CA_FighterHasgTurret:
 Id: 50505
 ENG: "Fighter HASG Turret"
 RUS: "HASG установка"
CA_FighterQfPdr:
 Id: 50507
 ENG: "Fighter QF 17-pdr"
 RUS: "QF 17"
CA_TheFighterQuickfiringPounderIs:
 Id: 50508
 ENG: "The Fighter Quick-Firing 17-pounder is a 76.2 mm anti-ship cannon that provides our fighters with useful anti ship capabilities."
 RUS: " QF 17 - это 76,2-мм противокорабельная пушка, которая обеспечивает нашим истребителям полезные возможности."
CA_FighterTorpedo:
 Id: 50521
 ENG: "Fighter Torpedo"
 RUS: "Торпеда истребителя"
CA_ATorpedoClassWeaponMounted:
 Id: 50522
 ENG: "A Torpedo class weapon mounted on fighters. Due to its smaller size, it has comparatively lower damage and range than capital ship torpedoes, but its usefulness is still apparent."
 RUS: "Оружие класса \"Торпеда\", установленное на истребителях. Из-за своего меньшего размера оно имеет сравнительно меньший урон и дальность действия, чем торпеды крупных кораблей, но его полезность все же очевидна."
CA_Tech_LightTorpedo_Name:
 Id: 50525
 ENG: "Light Torpedoes"
 RUS: "Легкие торпеды"
CA_Tech_LargeOrdnanceLocker_Name:
 Id: 50527
 ENG: "Ammunition Capacity I"
 RUS: "Боезапас I"
CA_Tech_LargeOrdnanceLocker_Desc:
 Id: 50528
 ENG: "As our ships grow larger, so too do their munition requirements. We can invest research into more efficient, larger storage modules for our ammunition, allowing for more sustainable firepower."
 RUS: "По мере того, как наши корабли становятся крупнее, растут и их потребности в боеприпасах.  Мы можем инвестировать исследования в более эффективные  модули для хранения наших боеприпасов, позволяющие использовать лучшую устойчивую огневую мощь."
CA_HighCapacityAmmunitionStorage:
 Id: 50529
 ENG: "High Capacity Ammunition Storage"
 RUS: "Массивный склад боеприпасов"
CA_ThisFacilityStoresAmmunitionMore:
 Id: 50530
 ENG: "This facility stores ammunition more efficiently than smaller ammunition storages."
 RUS: "Этот склад вмещает боеприпасы более рационально, чем хранилища меньшего типа."
CA_OrdnanceAssembly:
 Id: 50533
 ENG: "Ordnance Assembly"
 RUS: "Завод боеприпасов"
CA_ThisFacilityIsADedicated:
 Id: 50534
 ENG: "This facility is a dedicated ordnance manufacturing module. Our larger ships will surely benefit from it during drawn out battles."
 RUS: "Этот объект является специализированным мини-заводом, со всем необходимым для производства большого количества боеприпасов.  Наши крупные корабли наверняка выиграют от этого во время затяжных сражений."
CA_Tech_NanoStorage_Name:
 Id: 50535
 ENG: "Nano Storage"
 RUS: "Нано хранилище"
CA_Tech_NanoStorage_Desc:
 Id: 50536
 ENG: "With the invention of nanobots, we now have a way to improve all of our storage techniques. These little robots will sort, transport, and assemble any kind of weapon or ammunition required. They will also allow us to construct an efficient Nano Storage structure on our colonies, able to store and sort massive amounts of food and production."
 RUS: "С изобретением наноботов у нас теперь есть способ улучшить все наши методы хранения.  Эти маленькие роботы сортируют, транспортируют и собирают любое необходимое оружие или боеприпасы.  Они также позволят нам построить эффективную структуру нанохранилища в наших колониях, способную хранить и сортировать огромное количество продуктов питания и продукции."
CA_AdvancedColonyModule:
 Id: 50537
 ENG: "Advanced Colony Module"
 RUS: "Улучшенный колонизатор"
CA_ThisColonyUpgradeModuleWill:
 Id: 50538
 ENG: "This Colony upgrade module will provide a newly founded colony an additional 20 food and production. Very important in the early stages of any colony. It can also load more colonists than the standard Colony Module."
 RUS: "Этот модуль колонизации обеспечит основанную колонию дополнительными припасами( 20 еды и продукции).  Очень важных на ранних стадиях развития любой колонии.  Он также может загрузить больше колонистов, чем стандартный модуль колонизации."
CA_AutomatedAmmunitionStorage:
 Id: 50539
 ENG: "Automated Ammunition Storage"
 RUS: "Автономный склад боеприпасов"
CA_ThisAlmostFullyAutomatedAmmunition:
 Id: 50540
 ENG: "This Almost fully automated ammunition storage facility is designed for our capital class ships."
 RUS: "Это полностью автономный склад с большим пространством хранения, для наших кораблей большого класса."
CA_MilitaryBase:
 Id: 50543
 ENG: "Military Base"
 RUS: "Военная база"
CA_Tech_SystemDefenceTorpedo_Name:
 Id: 50545
 ENG: "Missile Defense III"
 RUS: "Ракетная защита III"
CA_Tech_SystemDefenceTorpedo_Desc:
 Id: 50546
 ENG: "It would be wise to improve our planetary defenses with weapons that can deter invaders. A series of giant SAM launchers could be a good start."
 RUS: "Было бы разумно улучшить нашу планетарную оборону с помощью оружия, которое может сдерживать захватчиков.  Хорошим началом могла бы стать серия гигантских пусковых установок ЗРК."
CA_Tech_PlanetFortification_Name:
 Id: 50547
 ENG: "Planet Fortification"
 RUS: "Планетарная фортификация"
CA_Tech_PlanetFortification_Desc:
 Id: 50548
 ENG: "A fortified area on the planet with trenches, defense emplacements, and planetary shielding generators."
 RUS: "Укрепленный район на планете с окопами, оборонительными сооружениями и планетарными генераторами защиты."
CA_Tech_FarmingColonyDevelopmentII_Name:
 Id: 50565
 ENG: "Xeno Farming III"
 RUS: "Ксено фермы III"
CA_Tech_FarmingColonyDevelopmentII_Desc:
 Id: 50566
 ENG: "We can perfect our farming methods on alien planets in such a way that we will significantly improve our planetary environments, making our colonies flourish. Another step towards truly planet-wide terraforming."
 RUS: "Мы можем усовершенствовать наши методы ведения сельского хозяйства на чужих планетах таким образом, чтобы значительно улучшить окружающую среду на планете и обеспечить процветание наших колоний.  Еще один шаг к поистине общепланетному терраформированию."
CA_AdvancedXenoFarm:
 Id: 50567
 ENG: "Advanced Xeno Farm"
 RUS: "Продвинутая ксено ферма"
CA_AdvancedXenoFarmsExpandUpon:
 Id: 50568
 ENG: "Advanced Xeno Farms expand upon the Upgraded Xeno Farm technology, enabling the construction of massive farms that produce more food, some without sentient intervention."
 RUS: "Продвинутые ксено фермы расширяют технологию ксенофермерства , позволяя строить огромные фермы, которые производят больше еды, без разумного вмешательства."
CA_Tech_AdvancedBionicArmor_Name:
 Id: 50569
 ENG: "Advanced Bionic Armor"
 RUS: "Продвинутый биосплав"
CA_AdvancedBionicArmorSmall:
 Id: 50571
 ENG: "Advanced Bionic Armor Small"
 RUS: "Малый биосплав"
CA_VeryStrongResistantToEnergy:
 Id: 50572
 ENG: "Very strong, resistant to Energy Projectiles and Beam. Creates ordnance, turn thrust, has EMP protection, self regenerates, and repairs the ship. It also nullifies the effect of Armor Piercing II"
 RUS: "Очень прочная, устойчива к энергетическим снарядам и лучам.  Создает боеприпасы,усиливает поворотную тягу, имеет защиту ЭМИ, самовосстанавливается и ремонтирует корабль. Аннулирует эффект \"Пробитие брони II\"."
CA_AdvancedBionicArmorMed:
 Id: 50573
 ENG: "Advanced Bionic Armor Med"
 RUS: "Средний биосплав"
CA_AdvancedBionicArmorLarge:
 Id: 50575
 ENG: "Advanced Bionic Armor Large"
 RUS: "Большой биосплав"
CA_ThisTorpedoTubeLaunchesSlowmoving:
 Id: 50577
 ENG: "This torpedo tube launches slow-moving but devastating torpedoes, packed to the hilt with explosives. They require substantial ordnance to fire and can be intercepted by point defense weapons."
 RUS: "Этот торпедный аппарат запускает медленно движущиеся, но разрушительные торпеды, до отказа набитые взрывчаткой.  Они требуют значительного количества боеприпасов для стрельбы и могут быть перехвачены средствами точечной защиты."
CA_Tech_HSA-Mirage_Name:
 Id: 50578
 ENG: "Mirage Armor"
 RUS: "Броня \"Мираж\""
CA_Tech_HSA-Mirage_Desc:
 Id: 50579
 ENG: "Crystal Shield Amplification Armor. Provides more Shield Amplification. The Crystals in this armor are processed and designed to \"Streamline\" hyper space travel, boosting Warp speed. It also stores abit more power. Cost is high. Energy Cannon vulnerability is minimized."
 RUS: "Кристалическая усиленная щитовая броня.  Обеспечивает большее усиление щита.  Кристаллы в этой броне обработаны и предназначены для оптимизации гиперкосмических путешествий, дополнительно увеличивает скорость варп-прыжка.  Она также сохраняет немного больше энергии.  Стоимость высока.  Уязвимость к энергетическому вооружению сведена к минимуму."
CA_Tech_ActiveArmor_Name:
 Id: 50580
 ENG: "Hyper Active Armor"
 RUS: "Гиперактивная броня"
CA_Tech_ActiveArmor_Desc:
 Id: 50581
 ENG: "Hyper Active Armor is a thorough blend of all our knowledge in Solid State Armor Technology. The mass is slightly higher than the already very light Crystal armor, but it fares well against most known damage."
 RUS: "Гиперактивная броня- это тщательное сочетание всех наших знаний в области технологии твердотельной брони.  Масса немного выше, чем у и без того очень легкой кристаллической брони, но она хорошо справляется с большинством известных повреждений."
CA_MirageArmorSmall:
 Id: 50582
 ENG: "Mirage Armor Small"
 RUS: "Малая броня \"Мираж\""
CA_StreamlinedForHyperSpacePowerful:
 Id: 50583
 ENG: "Streamlined for hyper space, powerful shield Amplification module, and the toughest underlying armor in this series of technology. It also nullifies the effect of Armor Piercing II"
 RUS: "Оптимизированный для гиперпространства, мощный модуль усиления щита и самая прочная базовая броня в этой серии технологий. Аннулирует эффект \"Пробитие брони II\""
CA_MirageArmorMedium:
 Id: 50584
 ENG: "Mirage Armor Medium"
 RUS: "Средняя броня \"Мираж\""
CA_MirageArmorLarge:
 Id: 50585
 ENG: "Mirage Armor Large"
 RUS: "Большая броня \"Мираж\""
CA_HyperactiveArmorSmall:
 Id: 50586
 ENG: "Hyper-Active Armor Small"
 RUS: "Малая гиперактивная броня"
CA_ABlendOfAllSolid:
 Id: 50587
 ENG: "A blend of all Solid Armor plates. It reacts with most attack types and reduces their damage. It offers improvments in Resistance over all armor of lower tiers. It also nullifies the effect of Armor Piercing II"
 RUS: "Смесь всех твердотельных бронепластин.  Она реагирует на большинство типов атак и снижает их урон.Улучшенная версия всех плит ниже уровня по сопротивлению.Также аннулирует эффект \"Пробитие брони II\"."
CA_HyperactiveArmorMedium:
 Id: 50588
 ENG: "Hyper-Active Armor Medium"
 RUS: "Средняя гиперактивная броня"
CA_HyperactiveArmorLarge:
 Id: 50589
 ENG: "Hyper-Active Armor Large"
 RUS: "Большая гиперактивная броня"
CA_FighterTorpedoIi:
 Id: 50590
 ENG: "Fighter Torpedo II"
 RUS: "Торпеда истребителя II"
CA_AnImprovedVersionOfThe:
 Id: 50591
 ENG: "An improved version of the previous Fighter Torpedo. Slightly more damage, and faster."
 RUS: "Улучшенная версия предыдущей истребительной торпеды.  Чуть больше урона и быстрее полет."
CA_PhasedEnergyTurretMk:
 Id: 50594
 ENG: "Phased Energy Turret Mk1"
 RUS: "Фазовая лазерная пушка"
CA_ThisDeadlyTurretHasA:
 Id: 50595
 ENG: "This deadly turret has a medium to long range, and can fire rapid high energy projectiles which will bypass shields half of the times. It will also deal increased damage to armor."
 RUS: "Эта смертоносная пушка имеет большую дальность поражения и систему касетной дозарядки, стреляет скоростными высокоэнергетическими снарядами, которые не только хорошо справляются с броней, но также имеют высокий шанс пробить щиты."
CA_Tech_EnergyPD2x2_Name:
 Id: 50596
 ENG: "Energy PD"
 RUS: "Энерго ТЗ"
CA_Tech_EnergyPD2x2_Desc:
 Id: 50597
 ENG: "Representatives within The Energy Research branch believe they can now use current energy military knowledge to construct fast-tracking Energy Point Defense weapons, useful for intercepting incoming anti-ship enemy missiles."
 RUS: "Ученые отделения Энергетических исследований считают, что теперь они могут использовать текущие военные знания в области энергетики для создания высокоскоростного энергетического оружия точечной защиты, полезного для перехвата приближающихся противокорабельных ракет противника."
CA_Tech_EnergyPD3x3_Name:
 Id: 50598
 ENG: " Advanced Energy PD"
 RUS: "Энерго ТЗ II"
CA_Tech_EnergyPD3x3_Desc:
 Id: 50599
 ENG: "We can now create Point Defense \"Laser\" projectiles that will pack more punch against incoming missiles, while retaining the same projectile speed."
 RUS: "Теперь мы можем создавать «Лазерные» снаряды точечной защиты, которые будут наносить больший урон входящим ракетам, сохраняя при этом ту же скорость снарядов."
CA_OrbitalKineticCannonMk:
 Id: 50600
 ENG: "Orbital Kinetic Cannon Mk2"
 RUS: "Орбит.киннетическая пушка II"
CA_AnImprovedVersionOfOur:
 Id: 50601
 ENG: "An improved version of our kinetic platform cannons, now featuring even higher range, faster projectiles, and more damage."
 RUS: "Улучшенная версия наших орудий на кинетической платформе, теперь с еще большей дальностью, более быстрыми снарядами и большим уроном."
CA_OrbitalKineticCannonMk2:
 Id: 50602
 ENG: "Orbital Kinetic Cannon Mk3"
 RUS: "Орбит.киннетическая пушка III"
CA_OurMostAdvancedOrbitalPlatform:
 Id: 50603
 ENG: "Our most advanced orbital platform weapon yet. With the extreme range, fast projectile speed, and long reload times, some have come to calling them orbital sniper cannons."
 RUS: "Наше самое современное оружие на орбитальной платформе.  Из-за большой дальности, высокой скорости снарядов и длительного времени перезарядки некоторые стали называть их орбитальными снайперскими пушками."
CA_OrbitalKineticCannonMk3:
 Id: 50604
 ENG: "Orbital Kinetic Cannon Mk1"
 RUS: "Орбит.киннетическая пушка I"
CA_AHighPerformanceTwinKinetic:
 Id: 50605
 ENG: "A high performance twin Kinetic Cannon, specially designed for small and heavy platforms in high orbit around a planet. It features a high range, and the 360 degree swivel allows for the maximum field of fire."
 RUS: "Высокопроизводительная двойная кинетическая пушка, специально разработанная для малых и тяжелых платформ на высокой орбите вокруг планеты.  Она отличается большой дальностью, а поворот на 360 градусов обеспечивает максимальное поле огня."
CA_AutomaticFactory:
 Id: 50606
 ENG: "Automatic Factory"
 RUS: "Автоматическая фабрика"
CA_TheAutomatedFactoryIsA:
 Id: 50607
 ENG: "The Automated Factory is a marvel of engineering, working almost completely without sentient intervention, and remaining environmentally friendly."
 RUS: "Автоматизированная фабрика - это чудо инженерной мысли, работающая почти полностью без разумного вмешательства и сохраняющая экологичность."
CA_GalacticNetworkUplink:
 Id: 50608
 ENG: "Galactic Network Uplink"
 RUS: "Галактическая сеть \"GalNet\""
CA_TheGalnetIsAComputer:
 Id: 50609
 ENG: "The GalNet is a computer network spanning your entire empire, using specialized satellites and passing ships to carry information across the vast gulfs between the stars. Not only does it give access to staggering amounts of silly animal pictures, it also improves research and commerce on any planet connected to it."
 RUS: "GalNet - это компьютерная сеть, охватывающая всю вашу империю, использующая специализированные спутники и проходящие корабли для передачи информации через огромные пропасти между звездами.  Он не только дает доступ к ошеломляющему количеству глупых изображений животных, но и улучшает исследования и торговлю на любой связанной с сетью планете."
CA_GeoSurveySatelliteUplink:
 Id: 50610
 ENG: "Geo Survey Satellite Uplink"
 RUS: "Спутниковый канал гео-разведки"
CA_TheGeoSurveySatelliteNetwork:
 Id: 50611
 ENG: "The Geo Survey Satellite Network measures changes in the density of the planet's crust, allowing for the easy detection of all major ore veins. It is mostly suited and cost effective for planets with high richness."
 RUS: "Спутниковая сеть гео-разведки измеряет изменения плотности земной коры, что позволяет легко обнаруживать все основные рудные жилы. Экономически выгодена для планет с высоким содержанием минерального богатства."
CA_HiveCity:
 Id: 50612
 ENG: "Hive City"
 RUS: "Город-улей"
CA_ThisIncrediblyMassiveHighlyAdvanced:
 Id: 50613
 ENG: "This incredibly massive, highly advanced structure will provide room for 2 Billion population. Due to the extreme amount of land and resources required for construction, planetary fertility will be moderately reduced."
 RUS: "Это невероятно массивное, высокоразвитое сооружение обеспечит место для 2 миллиардов жителей.  Из-за чрезмерного количества земли и ресурсов, необходимых для строительства, плодородие планеты будет умеренно снижено"
CA_LivestockCloningCenter:
 Id: 50614
 ENG: "Livestock Cloning Center"
 RUS: "Центр клонирования домашнего скота"
CA_InsteadOfTheCommonBreeding:
 Id: 50615
 ENG: "Instead of the common breeding programs of the past, this building clones meat from various races of xeno livestock, taking advantage of the best genetic attributes. It produces less food than Xeno Farms, but maintenance is very low. Thanks to healthier meat, more ethical lifestyles, and more land available for crops, population growth slightly increases."
 RUS: "Вместо общепринятых программ разведения животных, это здание клонирует мясо различных рас ксенофонда, используя лучшие генетические свойства. Производит меньше еды, чем ксено фермы, но требует очень низкого обслуживания.  Благодаря более здоровому мясу, более этичному образу жизни и большему количеству земель, пригодных для выращивания сельскохозяйственных культур, рост населения несколько увеличивается."
CA_LuxuryResort:
 Id: 50616
 ENG: "Luxury Resort"
 RUS: "Роскошный курорт"
CA_ALuxuriousResortForThe:
 Id: 50617
 ENG: "A luxurious resort for the very-well-off. Provides a significant boost to planetary commerce without maintenance costs."
 RUS: "Роскошный курорт для очень обеспеченных особей.  Дает значительный рост мировой торговли без затрат на техническое обслуживание."
CA_AParticleAcceleratorAsThe:
 Id: 50618
 ENG: "A particle accelerator, as the name implies, accelerates particles to nearly the speed of light, smashing them together at relativistic speeds to find new information about the makeup of the universe. Rumors of the potential for an irreversible black hole consumption event caused by this device are likely greatly exaggerated."
 RUS: "Ускоритель частиц, как следует из названия, ускоряет частицы почти до скорости света, сталкивая их вместе с релятивистскими скоростями, чтобы получить новую информацию о структуре Вселенной.  Слухи о возможности необратимого события поглощения черной дыры, вызванного этим устройством, вероятно, сильно преувеличены."
CA_PlanetarySupercomputer:
 Id: 50619
 ENG: "Planetary Supercomputer"
 RUS: "Планетарный суперкомпьютер"
CA_WhileAdvancesInMiniaturizationHave:
 Id: 50620
 ENG: "While advances in miniaturization have made computers smaller, they may inversely allow computers to be scaled up almost indefinitely. Set into the planetary crust, this gigantic computer can crunch almost unimaginable amounts of data, helping scientists immensely."
 RUS: "Несмотря на то, что достижения в области миниатюризации сделали компьютеры меньше, они, наоборот, могут позволить масштабировать компьютеры почти бесконечно.  Установленный в земной коре, этот гигантский компьютер может обрабатывать почти невообразимые объемы данных, безмерно помогая ученым."
CA_PlantGeneticManipulationCenter:
 Id: 50621
 ENG: "Plant Genetic Manipulation Center"
 RUS: "Центр генетики растений"
CA_ThisBuildingAdaptsLocalAnd:
 Id: 50622
 ENG: "This building adapts local and foreign flora to grow better within a planet's individual climates, promoting greater yields. Thus, larger areas of the planet can sustain agriculture, in effect improving the fertility level."
 RUS: "Это здание приспосабливает местную и инородную флору к лучшему росту в индивидуальном климате планеты, способствуя повышению урожайности.  Таким образом, более обширные районы планеты могут поддерживать сельское хозяйство, фактически повышая уровень плодородия"
CA_SystemResearchNetworkUplink:
 Id: 50623
 ENG: "System Research Network Uplink"
 RUS: "Сетевой канал исследований"
CA_TheSystemResearchNetworkLinks:
 Id: 50624
 ENG: "The System Research Network links all research labs, universities and test centers in a system together, allowing scientists to communicate and cooperate easily, limited only by the speed of light."
 RUS: "Сеть системных исследований объединяет все исследовательские лаборатории, университеты и испытательные центры в систему, позволяя ученым легко общаться и сотрудничать, ограничиваясь только скоростью света."
CA_ZeroGravityProductionPlant:
 Id: 50625
 ENG: "Zero Gravity Production Plant"
 RUS: "Завод по производству в невесомости"
CA_CertainAdvancedAlloysCannotBe:
 Id: 50626
 ENG: "Certain advanced alloys cannot be produced under conditions of gravity. Orbital production plants allow fabrication in zero gravity, increasing productivity."
 RUS: "Некоторые современные сплавы нельзя производить в условиях силы тяжести.  Орбитальные производственные установки позволяют производить изделия в условиях невесомости, повышая производительность."
CA_Tech_LifestockCloning_Name:
 Id: 50627
 ENG: "Livestock Cloning"
 RUS: "Клонир. домашнего скота"
CA_Tech_LifestockCloning_Desc:
 Id: 50628
 ENG: "Rather than raising whole animals for meat, this facility will grant us the ability to efficiently clone edible meat to exact specifications, eliminating the need for slaughterhouses and freeing up vast tracks of land. This will improve the food supply of the colony and promote a growing population."
 RUS: "Вместо того, чтобы выращивать целых животных для мяса, это предприятие предоставит нам возможность эффективно клонировать съедобное мясо в точном соответствии со спецификациями, устраняя необходимость в бойнях и освобождая обширные участки земли.  Это улучшит снабжение колонии продуктами питания и будет способствовать росту населения."
CA_Tech_HiveCities_Name:
 Id: 50629
 ENG: "Hive Cities"
 RUS: "Города-улья"
CA_Tech_HiveCities_Desc:
 Id: 50630
 ENG: "Specifically designed to house as many people as possible, Hive Cities rise high above the planet's surface, providing housing for 2 billion people. Each home is fitted with advanced holographic emitters and spacial distortion fields, allowing people to comfortably live in an incredibly small area, with as much freedom as they could possibly desire."
 RUS: "Города-улья, специально спроектированные для размещения как можно большего числа людей.Они возвышаются над поверхностью планеты, обеспечивая жильем 4 миллиардов человек.  Каждый дом оснащен продвинутыми голографическими излучателями и полями пространственного искажения, что позволяет людям комфортно жить на невероятно маленькой территории с максимальной свободой, которую они могут пожелать."
CA_Tech_PlantGeneticManipulation_Name:
 Id: 50631
 ENG: "Xeno-Plant Manipulation"
 RUS: "Изменение Флоры"
CA_Tech_PlantGeneticManipulation_Desc:
 Id: 50632
 ENG: "By manipulating local and alien plants, we can adapt them to the environment to grow better and yield more. In effect, this increases a planet's fertility."
 RUS: "Управляя местными и чужеродными растениями, мы можем адаптировать их к окружающей среде, чтобы они росли лучше и приносили больше урожая.  Фактически это увеличивает плодородие планеты."
CA_Tech_GeoSurvey_Name:
 Id: 50633
 ENG: "Geo Survey"
 RUS: "Съемка рельефа планеты"
CA_Tech_GeoSurvey_Desc:
 Id: 50634
 ENG: "We can create a network of satellites that will help discover new ore veins, whereas with conventional detection methods they would ordinarily be overlooked."
 RUS: "Мы можем создать сеть спутников, которые помогут обнаружить новые рудные жилы, тогда как при использовании обычных методов обнаружения они обычно не заметны."
CA_Tech_ZeroGravityProduction_Name:
 Id: 50635
 ENG: "Zero Gravity Production"
 RUS: "Работа в невесомости"
CA_Tech_ZeroGravityProduction_Desc:
 Id: 50636
 ENG: "Certain advanced alloys can only be produced in zero gravity. We can now build facilities that exploit microgravity for production."
 RUS: "Некоторые современные сплавы можно производить только в условиях невесомости.  Теперь мы можем строить объекты, которые используют микрогравитацию для производства."
CA_Tech_AutomaticProduction_Name:
 Id: 50639
 ENG: "Automatic Production"
 RUS: "Авто производство"
CA_Tech_AutomaticProduction_Desc:
 Id: 50640
 ENG: "Using advancements in computing and industrial robot design, we can create a factory that produces goods almost completely without intervention."
 RUS: "Используя достижения в области вычислительной техники и проектирования промышленных роботов, мы можем создать фабрику, которая производит товары почти полностью без вмешательства."
CA_Tech_SystemNetworks_Name:
 Id: 50641
 ENG: "System Networks"
 RUS: "Системные сети"
CA_Tech_SystemNetworks_Desc:
 Id: 50642
 ENG: "While linking computers together seems fairly simple on a planet, it is quite a bit more difficult between planets."
 RUS: "Хотя на одной планете соединить компьютеры вместе кажется довольно простым делом, между планетами сделать это намного сложнее."
CA_Tech_PlanetaryComputing_Name:
 Id: 50643
 ENG: "Planetary Computing"
 RUS: "Планетарные вычисления"
CA_Tech_PlanetaryComputing_Desc:
 Id: 50644
 ENG: "Using new discoveries in chip design, we can create a supercomputer capable of crunching incredible amounts of data."
 RUS: "Используя новые открытия в дизайне микросхем, мы можем создать суперкомпьютер, способный обрабатывать невероятные объемы данных."
CA_Tech_GalacticNetworks_Name:
 Id: 50645
 ENG: "Galactic Networks"
 RUS: "Галактические сети"
CA_Tech_GalacticNetworks_Desc:
 Id: 50646
 ENG: "If connecting planets of a system together was difficult, transferring data between systems will be even harder. With this technology, we can now finally open high data transfer in the GalNet. "
 RUS: "Соеденить планеты одной системы было сложно, то передача данных между системами будет еще сложнее.  Благодаря этой технологии мы, наконец, можем открыть в GalNet передачу данных с высокой скоростью. "
CA_Tech_Resorts_Name:
 Id: 50647
 ENG: "Luxury Resorts"
 RUS: "Роскошные курорты"
CA_Tech_Resorts_Desc:
 Id: 50648
 ENG: "The more planets we explore, the more areas we find that lend themselves well to tourism. Building a resort allows the very wealthy to spend their money in one of these beautiful havens."
 RUS: "Чем больше планет мы исследуем, тем больше районов, подходящих для туризма мы находим. Строительство курорта позволяет очень богатым тратить свои деньги в одном из этих красивых уголков."
CA_TaxEfficiencyStorage:
 Id: 50649
 ENG: "+30% Tax Efficiency, +20 storage"
 RUS: "+30% эффективность налогов, +20 места на складе"
CA_ResearchPerAssignedColonistFlat:
 Id: 50651
 ENG: "+0.1 research per assigned colonist, +0.25 Flat Research, +20% Tax"
 RUS: "+0.1 исследований за задействованного колониста, +0.25 к ислледованиям, +20% к налогам"
CA_FertilityOnBuildPlanetPopulation:
 Id: 50652
 ENG: " (-0.5) Fertility on build, +2 planet population, +100 storage, +2 Infrastructure"
 RUS: " (-0.5) плодородия за постройку, +2 к населению пленты, +100 места на складе, +2 к инфраструктуре"
CA_ProductionPerRichnessInfrastructureStorage:
 Id: 50653
 ENG: "+3 Production per Richness, +1 Infrastructure, +50 Storage, aids in ship repair"
 RUS: "+3 продукции за богатство, +100 места на складе, помощь в судоремонте, +1 к инфраструктуре"
CA_FoodPerAssignedColonistPopulation:
 Id: 50654
 ENG: "+0.25 food per assigned colonist, +0.05 population per turn"
 RUS: "+0.25 еды за задействованного колониста, +0.05 населения за ход"
CA_FlatResearchResearchAndCredits:
 Id: 50655
 ENG: "+0.75 flat Research, +0.2 research and credits per colonist"
 RUS: "+0.75 к исследованиям, +0.2 к науке и кредам за колониста."
CA_ProductionPerRichness:
 Id: 50656
 ENG: "+2 production per richness, plis 30,000 sensor range"
CA_FertilityOnBuild:
 Id: 50657
 ENG: " (+0.3) fertility on build"
 RUS: " (+0.3) плодородия за постройку"
CA_FertilityOnBuild2:
 Id: 50658
 ENG: " (+0.2) fertility on build"
 RUS: "(+0.1) плодородия за постройку"
CA_FertilityOnBuild3:
 Id: 50659
 ENG: " (+0.5) fertility on build"
 RUS: " (+0.5) плодородия за постройку"
CA_ProductionPerAssignedColonistStorage:
 Id: 50660
 ENG: "+0.25 production per assigned colonist, +20 storage, aids in ship repair"
 RUS: "+0.25 к продукции за задействованного колониста, +20 места на складе, помощь в судоремонте."
CA_TurnThrustVernier:
 Id: 50661
 ENG: "Turn Thrust - Vernier"
 RUS: "Ускоритель поворота\"Вернир\""
CA_ABasicModuleThatAllows:
 Id: 50662
 ENG: "A basic module that allows for the control of a small craft's direction."
 RUS: "Базовый модуль, который позволяет команде управлять вращением небольшого корабля."
CA_HavingDevelopedNuclearthermalEnginesWe:
 Id: 50663
 ENG: "Having developed nuclear-thermal engines, we can now adapt the smallest version to provide attitude control for our small craft. This increases their maneuverability."
 RUS: "Разработав термоядерные двигатели,теперь мы можем адаптировать самую маленькую версию для обеспечения ориентации нашего небольшого корабля. Увеличивает маневренность корабля."
CA_TurnThrustNuclearThermal:
 Id: 50664
 ENG: "Turn Thrust - Nuclear Thermal"
 RUS: "Термоядерный ускоритель поворота"
CA_HavingDevelopedPlasmaTorchEngines:
 Id: 50665
 ENG: "Having developed Plasma Torch engines, we can now adapt the smallest version to provide attitude control for our small crafts. This increases their maneuverability."
 RUS: "Разработав двигатели типа плазменных нагнетателей, теперь мы можем адаптировать самую маленькую версию \"Плазменного факела\" для обеспечения контроля и ориентации наших небольших кораблей. Увеличивает маневренность корабля."
CA_TurnThrustPlasmaTorch:
 Id: 50666
 ENG: "Turn Thrust - Plasma Torch"
 RUS: "Ускоритель поворота\"ПФ\""
CA_HavingDevelopedAntimatterEnginesWe:
 Id: 50667
 ENG: "Having developed Antimatter engines, we can now adapt the smallest version to provide attitude control for our small crafts. This increases their maneuverability."
 RUS: "Разработав двигатели на антиматерии, мы теперь можем адаптировать самую маленькую версию для обеспечения контроля и ориентации наших небольших кораблей. Увеличивает маневренность корабля."
CA_TurnThrustAntimatter:
 Id: 50668
 ENG: "Turn Thrust - Antimatter"
 RUS: "Антиматер.ускоритель поворота "
CA_ThisPowerPlantWorksOn2:
 Id: 50672
 ENG: "This power plant works on the principle of matter-antimatter annihilation. Its power output is similar to the Overload Fusion Reactor, but at less cost, and more rigidity. A containment breach will lead to a violent explosion."
 RUS: "Эта электростанция работает по принципу аннигиляции вещества и антивещества.  Ее выходная мощность не на много больше чем в термоядерного реактора с перегрузкой,но антиматериальный реактор не может хранить энергию, зато меньше стоит производство и он более прочный.  Нарушение условий содержания приведет к сильному взрыву."
CA_MassiveAntimatterReactor:
 Id: 50673
 ENG: "Massive Antimatter Reactor"
 RUS: "Массивный антиматер. реактор"
CA_MediumAntimatterReactor:
 Id: 50674
 ENG: "Medium Antimatter Reactor"
 RUS: "Антиматериальный реактор"
CA_Tech_AdvancedSanitation_Name:
 Id: 50687
 ENG: "Advanced Sanitation"
 RUS: "Расширенная санитария"
CA_APlanetarySanitationCenterCan:
 Id: 50688
 ENG: "A planetary Sanitation Center can reduce fatalities from natural diseases, improving lifespans for the colony and also increase maximum population in the colony."
 RUS: "Планетарный центр санитарии может снизить количество смертей от естественных болезней, улучшить продолжительность жизни колонистов, а также увеличить максимальное количество населения в колонии."
CA_PopulationMillionPopulationPerTurn:
 Id: 50689
 ENG: "+0.5 population, +10 Million population per turn"
 RUS: "+0.5 к макс.популяции, +10 миллионов населения за ход"
CA_Tech_AdvancedEducation_Name:
 Id: 50690
 ENG: "Advanced Education"
 RUS: "Высшее образование"
CA_Tech_AdvancedEducation_Desc:
 Id: 50691
 ENG: "Educating future scientists and engineers is the key to our empire's survival. We can research and build Planetary Education Centers to promote and provide ground works for this population."
 RUS: "Обучение будущих ученых и инженеров - ключ к выживанию нашей империи. Мы можем исследовать и строить Центры планетарного образования, чтобы продвигать и проводить фундаментальные работы для нашего населения."
CA_ProductionAndResearchPerAssigned:
 Id: 50692
 ENG: "+0.15 production and +0.15 research per assigned colonist"
 RUS: "+0.15 к продукции и +0.15 исследований за задествованного колониста."
CA_Tech_AdvancedTransportation_Name:
 Id: 50693
 ENG: "Advanced Transportation"
 RUS: "Продвинутая перевозка"
CA_Tech_AdvancedTransportation_Desc:
 Id: 50694
 ENG: "Advanced Transportaion converts military transportation technologies and methods for civilian usage, which would increase overall efficiency in the colony."
 RUS: "Продвинутая транспортировка преобразовывает военные транспортные технологии и методы, для использования в гражданских целях, что повысит общую эффективность колонии."
CA_ProductionPerColonistInfrastructure:
 Id: 50695
 ENG: "+0.3 production per colonist, +2 Infrastructure"
 RUS: "+0.3 к продукции за колониста, +2 к инфраструктуре"
CA_LargeOrdnanceStorage:
 Id: 50696
 ENG: "Large Ordnance Storage"
 RUS: "Большой склад боеприпасов"
CA_AScaledupVersionOfThe:
 Id: 50697
 ENG: "A scaled-up version of the Medium Ordnance Storage, this module holds more ammunition and is more cost effective."
 RUS: "Увеличенная версия склада боеприпасов, этот модуль вмещает больше боеприпасов и является более экономичным."
CA_LargeCargoHold:
 Id: 50698
 ENG: "Large Cargo Hold"
 RUS: "Большой грузовой отсек"
CA_AdvancesInShipDesignAnd2:
 Id: 50699
 ENG: "Advances in ship design and material science allow for much larger cargo holds to be constructed. This one holds 20 units of food, production or frozen colonists."
 RUS: "Достижения в области проектирования судов и материаловедения позволяют строить гораздо более крупные грузовые трюмы. В нем 20 единиц еды, продукции или замороженных колонистов."
CA_ResearchPerAssignedColonistProduction:
 Id: 50700
 ENG: "+0.4 research per assigned colonist, +0.1 production per assigned colonist"
 RUS: "+0.4 к исследованиям и +0.1 продукции за задействованного колониста"
CA_SteelHmgDefense:
 Id: 50709
 ENG: "Steel HMG Defense"
 RUS: "Стальной ККП"
CA_AHeavyMachineGunTurret:
 Id: 50710
 ENG: "A Heavy Machine Gun turret mounted on a Steel Armor plate for added durability. An effective weapon against fighters and missiles. It has 75% strength Deflection of the non weapon Armor plate"
 RUS: "Турель крупнокалиберного пулемета вмонтирована в стальную броню, эффективное оружие против ракет и истребителей. Броня имеет 75% прочности и 75% отражения брони."
CA_KineticTurret:
 Id: 50711
 ENG: "Kinetic Turret"
 RUS: "Кинетическая пушка"
CA_ThisGeneralpurposeCannonTurretFires:
 Id: 50712
 ENG: "This general-purpose cannon turret fires kinetic projectiles at high velocity that deal significant damage upon impact. Ideal against armored targets."
 RUS: "Эта универсальная пушка стреляет кинетическими снарядами с высокой скоростью, которые наносят значительный урон при ударе. Идеально против бронированных целей."
CA_ClassIMagshield:
 Id: 50713
 ENG: "Magnetic Shield"
CA_WhilstOnlyCapableOfWithstanding:
 Id: 50714
 ENG: "First attampt at energy shielding, the Magnetic Shield is a crude device. Able to withstand only a few hits, it does feature recharge during combat."
 RUS: "Несмотря на то, что магнитные поля способны выдержать лишь несколько ударов, они способны охватывать большую площадь и быстро восстанавливаются. Это делает их идеальными для затяжных стычек с небольшими кораблями."
CA_MediumOverdriveEngine:
 Id: 50715
 ENG: "Medium Overdrive Engine"
 RUS: "Перегруженный средний двигатель"
CA_ThisFrigateEngineHasBeen:
 Id: 50716
 ENG: "This frigate engine has been pushed to the limit, delivering more thrust but consuming a lot of power."
 RUS: "Этот двигатель фрегата был доведен до предела возможностей, он обеспечивает большую тягу, но потребляет много энергии"
CA_TwinSmallEngine:
 Id: 50719
 ENG: "Twin Small Engine"
 RUS: "Двойной малый двигатель"
CA_CouplingMultipleEnginesAllowsCore:
 Id: 50720
 ENG: "Coupling multiple engines allows core components to be shared, reducing weight and power usage without a loss to maximum thrust. This does make it easier to disable, however."
 RUS: "Соединение двух двигателей позволяет использовать общие компоненты, снижая вес и потребляемую мощность, а также слегка увеличивая максимальную тягу.Выгоднее установить этот двигатель чем два малых двигателя."
CA_MicroWarpCore:
 Id: 50721
 ENG: "Micro Warp Core"
 RUS: "Микро-варп ядро"
CA_ThisExternalEngineChannelsEnergy:
 Id: 50722
 ENG: "This external engine channels energy directly from the central warp core and is able to boost a ships speed a significant amount, at both warp and sublight speeds. Unfortunately, safety standards require that this engine design cannot be used for maneuvering; this is to avoid the unfortunate possibility of the ship tearing itself to pieces."
 RUS: "Этот внешний двигатель направляет энергию непосредственно из центрального варп-ядра и может значительно увеличить скорость корабля как на варп, так и на субсветовых скоростях. К сожалению, стандарты безопасности требуют, чтобы двигатель этой конструкции нельзя было использовать для маневрирования; это делается для того, чтобы избежать досадной возможности разорвать корабль на части."
CA_StaticBarrier:
 Id: 50723
 ENG: "Basic Deflector Shield"
CA_PlacedOnTheOutsideOf:
 Id: 50724
 ENG: "The Basic Deflector Shield has low strength, but high deflection rate, able to deflect low powered projectiles and it has some resistance to beam weapons. Unfortunately, it has low coverage and slow recharge rate."
CA_JumpDrive:
 Id: 50725
 ENG: "Jump Drive"
 RUS: "Варп-привод"
CA_PuttingRecentInnovationsInWarp:
 Id: 50726
 ENG: "Putting recent innovations in warp theory to work, this drive is capable of traversing systems in mere seconds. While its speed puts conventional drives to shame, it is incredibly power hungry and must be recharged in-between jumps. The structural integrity of this module is very unstable. It is advised to protect it with armor."
 RUS: "Используя последние инновации в теории деформации, этот привод способен перемещать корабль по системам за считанные секунды. Он потребяет невероятно большое количество энергии и требует зарядки между варп-прыжками. Конструктивная целостность этого модуля очень нестабильна, рекомендуется защитить его броней."
CA_SmallInertialDamper:
 Id: 50729
 ENG: "Small Inertial Damper"
 RUS: "Малый гаситель инерции"
CA_Module_Medium_Force_Field_Desc:
 Id: 50732
 ENG: "This is a better armored and more powerful Force Field. Its power draw is exceptionally high."
CA_Tech_Force_Fields_II_Name:
 Id: 50733
 ENG: "Force Fields II"
CA_Gunboat:
 Id: 50734
 ENG: "Gunboat"
 RUS: "Канонерский корабль"
CA_AdvancedStorageAndFoodPreservation:
 Id: 50737
 ENG: "Advanced storage and food preservation techniques allow for massive storage upgrades on our colonies. An extra 500 food and production can be stored in this hi-tech structure's warehouses."
 RUS: "Усовершенствованные методы хранения и консервирования продуктов питания позволяют значительно улучшить хранилища в наших колониях. На складах этого высокотехнологичного сооружения можно хранить еще 500 продуктов питания и продукции."
CA_ResearchPerAssignedColonist:
 Id: 50738
 ENG: "+0.2 research per assigned colonist"
 RUS: "+0.2 исследований за задействованного колиниста"
CA_ResearchPerTurnProductionPer:
 Id: 50739
 ENG: "+0.75 research per turn, +0.2 production per assigned colonist"
 RUS: "+0.75 исследований за ход, +0.2 продукции за задействованного колиниста"
CA_FoodPerAssignedColonistStorage:
 Id: 50740
 ENG: "+0.75 food per assigned colonist, +50 storage"
 RUS: "+0.75 еды за задействованного колиниста, +50 места на складе"
CA_FoodPerAssignedColonistFlat:
 Id: 50741
 ENG: "+1 food per assigned colonist, +2 Flat Food, +75 storage"
 RUS: "+1 еды за задействованного колиниста, +2 еды, +75 места на складе"
CA_ProductionPerAssignedColonistCredits:
 Id: 50742
 ENG: " +1 production per assigned colonist,+0.1 Credits per Colonist, +50 storage, +2 Infrastructure"
 RUS: "+1 продукции за задействованного колиниста,+0.1 кредитов за колониста, +50 места на складе, +2 к инфраструктуре"
CA_Tech_MissileArmorv2_Name:
 Id: 50743
 ENG: "Missile Armor II"
 RUS: "броня ракет II"
CA_Tech_MissileArmorv2_Desc:
 Id: 50744
 ENG: "We have perfected a new technology to further increase the survivability of our missile-based weaponry by protecting them with advanced armor plating."
 RUS: "Мы усовершенствовали новую технологию для дальнейшего повышения живучести нашего ракетного вооружения, защищая его с помощью усовершенствованной брони."
CA_Tech_ECMv2_Name:
 Id: 50745
 ENG: "Advanced ECM"
 RUS: "Продвинутые ЭСП"
CA_Tech_ECMv2_Desc:
 Id: 50746
 ENG: "Advanced Electronic Counter Measures can further confuse enemy point defense sensors into missing their targets."
 RUS: "Усовершенствованные электронные средства противодействия могут еще больше сбить с толку датчики точечной обороны противника и заставить их пропустить свои цели."
CA_EnergyPointDefenseTurret:
 Id: 50747
 ENG: "Energy Point Defense Turret"
 RUS: "Энергоустановка ТЗ"
CA_ASingleBarreledEnergyPoint:
 Id: 50748
 ENG: "A Single barreled, energy point defense turret. Created in mind of the constantly growing danger of guided weapons. It has rather low damage, but is accurate and fast firing."
 RUS: "Одноствольная турель точечной энергетической защиты. Создана с учетом постоянно растущей опасности управляемого оружия. У нее довольно низкий урон, но при этом ведется точная и быстрая стрельба."
CA_AdvancedEnergyPointDefense:
 Id: 50749
 ENG: "Advanced Energy Point Defense"
 RUS: "Тяжелая энергоустновка ТЗ"
CA_AnImprovementOfTheBasic:
 Id: 50750
 ENG: "An improvement of the basic energy point defense turret. While bigger, it has two barrels, improved rate of fire, and more damage."
 RUS: "Улучшение базовой установки энергетической защиты. Она больше, у нее два ствола, улучшенная скорострельность, увеличенная дальность и больший урон."
CA_FiresHighSpeedShellsInto:
 Id: 50751
 ENG: "Fires high speed shells into orbit"
 RUS: "Запускает на орбиту высокоскоростные снаряды"
CA_ThisMilitaryFacilityProvidesA:
 Id: 50752
 ENG: "This military facility provides a barracks, armory, mess, firing range, and other facilities needed to train and equip infantry for ground combat. It is more advanced than the military outpost."
 RUS: "На этом военном объекте есть казармы, арсенал, столовая, полигон и другие объекты, необходимые для обучения и оснащения пехоты для наземного боя. Он более продвинутый, чем военный аванпост."
CA_Tech_VelocityStimulanceMk2_Desc:
 Id: 50753
 ENG: "As our control over the galaxy grows, we must improve our hyperspace and subspace travel times. We are focusing on external thrusters, more integrated systems for frigates, and Nuclear Thermal thrusters for improved turn rates."
 RUS: "По мере того как наш контроль над галактикой растет, мы обязаны ускорить наши корабли в варп-прыжке и при субсветовых скоростях. Ученые делают упор на внешние двигатели, более интегрированные системы для фрегатов и ядерные тепловые двигатели для повышения скорости поворота корабля."
CA_Tech_VelocityStimulanceMk3_Desc:
 Id: 50754
 ENG: "As our control over the galaxy grows, we must improve our hyperspace and subspace travel times. We are focusing on external thrusters and more integrated systems for cruisers, new cruiser turn thrusters for improved turn rates, and a new jump drive design."
 RUS: "По мере того как наш контроль над галактикой растет, мы обязаны ускорить наши корабли в варп-прыжке и при субсветовых скоростях. Ученые делают упор на внешние двигатели и более интегрированные системы для кресеров. Новые устройства для повышения скорости поворота и новую конструкцию варп привода."
CA_Tech_VelocityStimulanceMk4_Desc:
 Id: 50755
 ENG: "As our control over the galaxy grows, we must improve our hyperspace and subspace travel times. We are focusing on external thrusters and more integrated systems for battleships, more advanced jump drives, and a plasma torch thruster."
 RUS: "По мере того как наш контроль над галактикой растет, мы обязаны ускорить наши корабли в варп-прыжке и при субсветовых скоростях. Ученые делают упор на внешние двигатели и более интегрированные системы для линкоров,совершенные варп-ускорители и поворотные устройства с \"Плазменным факелом\"."
CA_Tech_VelocityStimulanceMk5_Desc:
 Id: 50756
 ENG: "As our control over the galaxy grows, we must improve our hyperspace and subspace travel times. We are focusing on external thrusters and more integrated systems for titans, advanced jump theory, and antimatter thrusters."
 RUS: "По мере того как наш контроль над галактикой растет, мы обязаны ускорить наши корабли в варп-прыжке и при субсветовых скоростях. Ученые делают упор на внешние двигатели и более интегрированные системы для титанов, продвинутую теорию варп-прыжков и двигатели на антивеществе."
CA_AntishipGatlingAsgTurretsWill:
 Id: 50757
 ENG: "Anti-ship Gatling (ASG) turrets will increase fighter effectiveness in the battlefield. It is essentially a vulcan cannon mounted on a turret for better field of fire."
 RUS: "Противокорабельные турели \"Гатлинга\" (ПКТГ) повысят эффективность любого истребителя на поле боя. По сути, это вулкан-пушка, установленная на башне для лучшего радиуса боя."
CA_TheseHeavyAntifighterGatlingTurrets:
 Id: 50758
 ENG: "These Heavy Anti-Fighter Gatling turrets use larger ammunition for higher damage. All of this on a better turret with wider field of fire. The projectiles also use the phased defense turret benefits, which can make it very effective vs. Small Craft"
 RUS: "Эти противоистребительные пушки \"Гатлинга\" используют много боеприпасов для высокого урона. И все это на совершенной башне с более широким полем огня. Снаряды используют преимущества поэтапного пробития брони, что делает их очень эффективными против малых судов."
CA_Tech_NanoMining_Desc:
 Id: 50759
 ENG: "Using our knowledge in Nano Machinery, we can create Nano Mining Bots. These tiny machines will save a lot of time and effort ordinarily wasted by transporting and drilling in conventional mining operations."
 RUS: "Используя наши знания в области нано-машин, мы можем создавать ботов для нано-добычи. Эти крошечные машины сэкономят много времени и усилий, которые обычно тратятся на транспортировку и бурение при обычных горных работах."
CA_ProvidesPowerFlowAndPower:
 Id: 50760
 ENG: "Provides power flow and power radius. Not as strong as steel armor, and much more expensive. It also has an improved Shield Amplification and Warp streamlining technologies. Since The armor also generates energy, it tends to yield a small explosion when destroyed."
 RUS: "Обеспечивает поток мощности и радиус мощности. Не такая прочная, как стальная броня, и намного дороже. Он также имеет улучшенное усиление щита и технологии оптимизации деформации. Поскольку броня также генерирует энергию, при разрушении она имеет тенденцию вызывать небольшой взрыв."
CA_Tech_CeramicArmor_Desc:
 Id: 50761
 ENG: "Ceramic Armor can withstand a little more punishment than Reactive Armor, but the true benefit is the decrease in mass. Ceramic Armor is very effective vs. Beams and Energy projectiles, and somewhat effective vs. Energy Projectiles. It is also more expensive than Reactive Armor."
 RUS: "Керамическая броня может выдержать немного большее урона, чем реактивная броня, но истинное преимущество - уменьшение массы. Керамическая броня очень эффективна против лучей и энергетических снарядов. Стоит дороже, чем реактивная броня."
CA_Tech_CompositeAlloys_Desc:
 Id: 50762
 ENG: "Breakthroughs in Chemistry allow for the design and construction of armors twice as strong as steel, with improvements all arcoss the board."
 RUS: "Прорыв в химии позволил проектировать и создавать броню, вдвое более прочную, чем сталь."
CA_Tech_CrystalArmor_Desc:
 Id: 50763
 ENG: "Purple Crystals are almost as tough as Composite Alloys Armor. We can create armor from these purple crystals, but processing it will be highly expensive. The result would be a very strong armor, with reduced mass, and adding explosion resistance."
 RUS: "Фиолетовые кристаллы почти так же прочны, как броня из композитных сплавов. Мы можем создать броню из этих фиолетовых кристаллов, но их обработка будет очень дорогостоящей. В результате получилась бы очень прочная броня с уменьшенной массой и повышенной устойчивостью к взрыву."
CA_Tech_ColdFusion_Desc:
 Id: 50765
 ENG: "Cold fusion is a type of nuclear reaction that would occur at, or near room temperature. This is in contrast with \"hot\" fusion, which takes place naturally within stars, and under immense pressure."
 RUS: "Холодный синтез - это тип ядерной реакции, которая может происходить при комнатной температуре или около нее. Это противоположность с \"горячим\" синтезом, который происходит естественным образом внутри звезд и под огромным давлением."
CA_Tech_ShieldArmor_Desc:
 Id: 50766
 ENG: "Breakthroughs in shield amplification lead us to much better amplification in these armors, at the cost of some power draw. We managed to negate some of the previous vulnerability to energy projectiles, but it still remains an issue."
 RUS: "Достижения в области усиления щитов привели нас к гораздо лучшему усилению этой брони, за счет некоторого потребления энергии. Нам удалось исключить предыдущую уязвимость к энергетическим снарядам, но это все еще остается проблемой."
CA_Tech_XSGA5Fairy_Desc:
 Id: 50767
 ENG: "Using knowledge gained from previous Solar Armor, we can reach energy production higher than 50% of Nuclear Reactors within a new armor. The code name given for this project is \"Fairy\". These also have increased shield amplification."
 RUS: "Используя знания, полученные из предыдущей солнечной брони, мы можем достичь выработки энергии более чем на 50% ядерных реакторов в новой броне. Кодовое название этого проекта - \"Фея\". Проект также имеет увеличенное усиление щита."
CA_Tech_AssultRaiders_Desc:
 Id: 50768
 ENG: "We can construct even bigger hangars to launch faster and bigger corvette size crafts."
 RUS: "Мы можем построить ангары еще большего размера, чтобы запускать более быстрые и большие корабли размером с корвет."
CA_ThisDedicatedBomberModuleLaunches:
 Id: 50769
 ENG: "This dedicated bomber module launches a barrage of unguided, low accuracy space bombs. The bombs cause EMP damage, and are slightly more effective versus shields, but less effective versus armor."
 RUS: "Этот специальный модуль бомбардировщика запускает шквал неуправляемых космических бомб низкой точности. Бомбы наносят урон ЭМИ и более эффективны против щитов, но менее эффективны против брони."
CA_ThisModuleLaunchesABarrage:
 Id: 50770
 ENG: "This module launches a barrage of unguided, low accuracy space bombs. The hot plasma is highly effective versus armor."
 RUS: "Этот модуль запускает шквал неуправляемых космических бомб низкой точности. Горячая плазма очень эффективна против брони."
CA_Tech_LinkedAnti-Matter_Name:
 Id: 50771
 ENG: "Linked Anti-Matter"
 RUS: "Сопряженная антиматерия"
CA_Tech_LinkedAnti-Matter_Desc:
 Id: 50772
 ENG: "By repurposing the open space of a hangar bay, we should be able to safely chain together multiple anti-matter reactors, increasing the efficiency of their overall energy output. The hangar might not be very protective, but it's the best our engineers could come up with."
 RUS: "Перепрофилируя открытое пространство ангарного отсека, мы должны иметь возможность безопасно соединить вместе несколько реакторов антивещества, увеличивая эффективность их общей выработки энергии. Ангар может быть не очень защищенным, но это лучшее, что могли придумать наши инженеры."
CA_Tech_StarLancers_Desc:
 Id: 50773
 ENG: "We can construct and maintain very large bays for frigate support."
 RUS: "Мы можем построить и содержать очень большие отсеки для поддержки фрегатов."
CA_Tech_ArmoredColdFusion_Desc:
 Id: 50775
 ENG: "We are able to develop our Cold Fusion Tech into larger, more efficient Reactors. We are also able to upgrade our dedicated power cell's storage due to this advancement."
CA_Tech_Force_Fields_II_Desc:
 Id: 50778
 ENG: "We can create larger and more efficient Force Field Emitters."
CA_Tech_OrdnanceAssemble_Name:
 Id: 50785
 ENG: "Ordnance Facilities"
 RUS: "Оборудование боеприпасов."
CA_Tech_OrdnanceAssemble_Desc:
 Id: 50786
 ENG: "We can design dedicated workshops for ordnance fabrication on capital ships."
 RUS: "Мы можем спроектировать специальные мастерские для изготовления боеприпасов на крупных кораблях."
CA_Tech_ATCSM_Name:
 Id: 50787
 ENG: "Anti Capital Missiles I"
 RUS: "Ракеты анти линкор I"
CA_Tech_ATCSM_Desc:
 Id: 50788
 ENG: "We can create missile systems specifically dedicated to destroying enemy capital ships, armed with a warhead capable of efficiently damage armor."
 RUS: "Мы можем создать ракетные системы, специально предназначенные для уничтожения вражеских крупных кораблей, вооруженные боеголовкой, способной эффективно повреждать броню."
CA_Tech_DualATCSM_Name:
 Id: 50789
 ENG: "Anti Capital Missiles II"
 RUS: "Ракеты анти линкор II"
CA_Tech_DualATCSM_Desc:
 Id: 50790
 ENG: "We can improve our Anti Capital Ship Missiles by making more powerful warheads at destroying armor."
 RUS: "Мы можем улучшить наши противолтнкорные ракеты, сделав более мощные боеголовки, разрушающие броню."
CA_Tech_GatlingDefense_I_Name:
 Id: 50796
 ENG: "Gatling Defense I"
 RUS: "Оборона \"Гатлинга\" I"
CA_Tech_GatlingDefense_I_Desc:
 Id: 50797
 ENG: "Improving ship Anti-Missile defense systems may limit the loss of life for our ships and crews. We can look into upgrading the previous Phalanx point defense cannons with better radar and more firepower."
 RUS: "Улучшение корабельных систем противоракетной защиты может ограничить гибель наших кораблей и экипажей.  Мы можем рассмотреть возможность модернизации предыдущих пушек точечной защиты \"Фаланга\" с улучшенным радаром и большей огневой мощью."
CA_Tech_GatlingDefense_II_Name:
 Id: 50798
 ENG: "Gatling Defense II"
 RUS: "Оборона \"Гатлинга\" II"
CA_Tech_GatlingDefense_II_Desc:
 Id: 50799
 ENG: "With reliable space-based gatling technology finally complete, we should strive for more firepower against the increasing threat of missiles in the battlefield. A larger defense platform will allow us to accomplish this."
 RUS: "Когда надежная космическая технология \"Гатлинга\" наконец-то завершена, мы должны стремиться к большей огневой мощи против растущей угрозы ракет на поле боя.  Более крупная платформа защиты позволит нам добиться этого."
CA_Tech_AutoTurrets_I_Desc:
 Id: 50800
 ENG: "AutoTurrets are large, mass driver guns with wide firing angles. They are designed to overwhelm enemy ships with many fast projectiles. Progression in this field involves the design of larger, more powerful turrets."
 RUS: "Авто-турели - большие орудия с широким углом стрельбы.  Они предназначены для поражения вражеских кораблей множеством быстрых снарядов.  Прогресс в этой области предполагает разработку более крупных и мощных турелей."
CA_Tech_AutoTurrets_I_Name:
 Id: 50801
 ENG: "Auto Turrets I"
 RUS: "Авто-турели I"
CA_Tech_AutoTurrets_II_Name:
 Id: 50802
 ENG: "Auto Turrets II"
 RUS: "Авто-турели II"
CA_Tech_AutoTurrets_III_Name:
 Id: 50803
 ENG: "Auto Turrets III"
 RUS: "Авто-турели III"
CA_Tech_DefenseGuns_I_Name:
 Id: 50804
 ENG: "Defense Guns I"
 RUS: "Защитные пушки I"
CA_Tech_DefenseGuns_I_Desc:
 Id: 50805
 ENG: "We can adapt our old air defense weapons for usage in space. These flak turrets will now be capable of targeting fighters, in addition to missiles. Future versions of this weapon will require our engineers to create a larger firing platform."
 RUS: "Мы можем адаптировать наше старое оружие противовоздушной обороны для использования в космосе.  Эти зенитные турели теперь могут поражать не только ракеты, но и истребители.  Будущие версии этого оружия потребуют от наших инженеров создания более крупной огневой платформы."
CA_Tech_DefenseGuns_II_Name:
 Id: 50806
 ENG: "Defense Guns II"
 RUS: "Защитные пушки II"
CA_Tech_DefenseGuns_II_Desc:
 Id: 50807
 ENG: "Now that we have a working practice of installing the smaller Flak AA Cannons, our scientists have been able to devise a larger, more powerful platform, perfect for missile and fighter defense on our larger ships."
 RUS: "Теперь, когда у нас есть рабочая практика по установке зенитных орудий меньшего размера, наши ученые смогли разработать более крупную и мощную платформу, идеально подходящую для защиты от ракет и истребителей на наших более крупных кораблях."
CA_Tech_ShapememoryAlloys_Desc:
 Id: 50808
 ENG: "Advancements in material science now allow us to construct a Shape Memory Metal. This metal will repair itself and other parts of the ship, given enough time. This material also possesses a unique explosive resistance, making it a useful interior bulkhead as well."
 RUS: "Достижения в области материаловедения теперь позволяют нам создавать металл с памятью формы.  Этот металл отремонтирует сам себя и другие части корабля, если будет достаточно времени. Материал также обладает уникальной взрывостойкостью, что делает его полезной внутренней переборкой."
CA_Tech_BionicArmor_Desc:
 Id: 50809
 ENG: "Bionic alloys can be used to construct a truly unique armor. Slightly stronger than Steel, it can repair the ship, self regenerate, and provide small turn trust through miniature gyroscopic effects in the Bionic Network. It is more expensive than ShapeMemory Alloys, and consumes some power."
 RUS: "Бионические сплавы можно использовать для создания поистине уникальной брони. Сплав чуть более прочный, чем сталь, он может ремонтировать корабль, самовосстанавливаться и обеспечивать небольшое усокрение поворота с помощью миниатюрных гироскопических эффектов в бионической сети.  Он дороже, чем сплавы с памятью формы, и потребляет некоторое количество энергии."
CA_Tech_OrganicArmor_Desc:
 Id: 50810
 ENG: "We can create an interesting artificial, very hard, but light, organic material. It draws power to maintain functionality, but possesses many special attributes. It is somewhat resistant to energy weapons and beams, thanks to its natural ability to reshape itself. This ability means it can produce ordnance as well. It also has some energy and EMP resistance."
 RUS: "Мы можем создать интересный искусственный, очень твердый, но легкий, органический материал.  Он потребляет энергию для поддержания функциональности, но обладает многими особыми атрибутами. Материал в некоторой степени устойчив к энергетическому оружию и лучам благодаря своей естественной способности изменять себя.  Эта способность означает, что он также может производить боеприпасы. Обладает некоторой энергией и сопротивлением ЭМИ."
CA_CombinedOrganicAndBioArmor:
 Id: 50811
 ENG: "Combined Organic and Bio Armor. Although less strong than Organic Armor, it has many useful characteristics. It repairs and creates ordnance for the ship, provides turn thrust, self regenerates, and grants EMP protection. The drawback is that it consumes a lot of power. It also nullifies the effect of Armor Piercing II"
 RUS: "Комбинированная органическая и биологическая броня.  Хотя метериал менее прочный, чем органическая броня, но имеет много полезных характеристик.  Ремонтирует корабль и создает боеприпасы, обеспечивает поворотную тягу, самовосстановление и защиту от ЭМИ. Потребляет много энергии. Аннулирует эффект \"Пробитие брони II\""
CA_Tech_AdvancedBionicArmor_Desc:
 Id: 50812
 ENG: "This is the most advanced Material we can create in this series of technology. It has all of the Organic Bioplate characteristics, along with some improvements. We have finally turned one of its weaknesses into a strength. Not only is it now much stronger, but its hunger for power is so great, that it has become very resistant to destructive energy beams or projctiles. The cost is very high."
 RUS: "Это самый продвинутый Материал, который мы можем создать в этой серии технологий.  Он имеет все характеристики органических биопластин, а также некоторые улучшения.  Мы наконец превратили одну из его слабостей в силу.  Теперь он не только стал намного прочнее, но и его сопротивляемость настолько велика, что теперь он очень устойчивый к разрушительным энергетическим лучам или снарядам.  Стоимость очень высока."
CA_Tech_AmmunitionDump_Desc:
 Id: 50813
 ENG: "With advancements in AI sorting networks and improved infrastructure, we are able to further perfect the efficiency of our ordnance carrying ship modules. They now support greater ammunition per container than we had ever thought possible, and are mostly automated."
 RUS: "Благодаря достижениям в области сортировочных сетей ИИ и улучшенной инфраструктуре мы можем еще больше повысить эффективность наших корабельных модулей, несущих боеприпасы.  Теперь они поддерживают большее количество боеприпасов на контейнер, чем мы когда-либо могли представить, и в основном автоматизированы."
CA_Tech_HugeAmmunitionDump_Desc:
 Id: 50814
 ENG: "After completely eliminating all manual intervention and maintenance, our ammunition management centers have become completely self contained. By incorporating ammunition drones and robots, the AI seems to utilize advanced logistics needed for the constant flow of ammunition in these very large ship modules. We no longer understand exactly how the AI functions, but it is extremely efficient."
 RUS: "После полного исключения ручного вмешательства и обслуживания, наши центры управления боеприпасами стали полностью автономными.  Включая дронов и роботов с боеприпасами, ИИ, похоже, использует продвинутую логистику, необходимую для постоянного потока боеприпасов в эти очень большие корабельные модули.  Мы больше не понимаем, как именно работает ИИ, но он чрезвычайно эффективен."
CA_Tech_AmmunitionDump_Name:
 Id: 50815
 ENG: "Ammunition Capacity II"
 RUS: "Боезапас II"
CA_Tech_HugeAmmunitionDump_Name:
 Id: 50816
 ENG: "Ammunition Capacity III"
 RUS: "Боезапас III"
CA_Tech_AssaultCannons_Name:
 Id: 50817
 ENG: "Assault Cannons"
 RUS: "Штурмовые орудия"
CA_Tech_AssaultCannons_Desc:
 Id: 50818
 ENG: "In order to further advance our subspace artillery weapons, we have resorted to the use of new technologies. After extensive testing, our new weapons now feature a miniature warp bubble which has been tied into the driver system, and exotic forms of ultra dense explosive compounds have been synthesized for use as ammunition."
 RUS: "Для дальнейшего совершенствования нашего подпространственного артиллерийского оружия мы прибегли к использованию новых технологий.  После обширных испытаний наше новое оружие теперь имеет миниатюрный варп-пузырь, который был привязан к системе заряжания, и были синтезированы экзотические формы сверхплотных взрывчатых веществ для использования в качестве боеприпасов."
CA_Tech_LinkedQuantumFusion_Name:
 Id: 50819
 ENG: "Linked Quantum"
 RUS: "Сопряженный квантум"
CA_Tech_LinkedQuantumFusion_Desc:
 Id: 50820
 ENG: "By linking the output of our quantum fusion reactors, we can ensure their protection within a small space, and amplify their power output through intuned modulation. They will be protected by their encasing and the addition of a local shielding generator."
 RUS: "Связывая выходы наших квантовых термоядерных реакторов, мы можем обеспечить их защиту в небольшом пространстве и усилить их выходную мощность за счет настроенной модуляции.  Они будут защищены кожухом и добавлением местного экранирующего генератора."
CA_Tech_ExtremeFusion_Name:
 Id: 50821
 ENG: "Extreme Fusion"
 RUS: "Экстрим синтез"
CA_Tech_ExtremeFusion_Desc:
 Id: 50822
 ENG: "If we are willing to take the risk, we can construct a higher power flow Fusion Reactor, but at increased mass and cost."
 RUS: "Если мы готовы пойти на риск, мы сможем построить термоядерный реактор с большей мощностью, но с увеличенной массой и стоимостью."
CA_Tech_ExtremeAntiMatter_Name:
 Id: 50823
 ENG: "Extreme Anti-Matter"
 RUS: "Экстрим антиматерия"
CA_Tech_ExtremeAntiMatter_Desc:
 Id: 50824
 ENG: "We are now able to control an advanced magnetic field that can contain multiple, smaller size Anti-Matter reactions. If we are willing to take the risk, we can construct a higher power flow Anti-Matter Reactor that will utilize this newer, more advanced magnetic field. If destroyed, the resulting explosion will be devastating."
 RUS: "Теперь мы можем управлять развитым магнитным полем, которое может содержать множество реакций антиматерии меньшего размера.  Если мы готовы пойти на риск, мы сможем построить реактор антиматерии с более мощным притоком энергии, который будет использовать это новое, более совершенное магнитное поле.  В случае уничтожения возникший в результате взрыв будет разрушительным."
CA_Tech_XACs_Name:
 Id: 50826
 ENG: "Hyper Acceleration"
 RUS: "Гипер ускорение"
CA_Tech_XACs_Desc:
 Id: 50827
 ENG: "Hyper Acceleration can use advanced, massive magnetic coils to accelerate solid projectiles to relativistic speeds, once thought impossible for such amounts of mass."
 RUS: "Гиперускоретель может использовать передовые массивные магнитные катушки для ускорения твердых снарядов до релятивистских скоростей, которые когда-то считались невозможными для таких масс."
CA_Tech_Multi-BarrelDrivers_Name:
 Id: 50828
 ENG: "Multi Barrel Drivers"
 RUS: "Много ствольные орудия"
CA_Tech_Multi-BarrelDrivers_Desc:
 Id: 50829
 ENG: "We can create heavy, multi barreled cannons, assuming you care more for mass drivers than energy."
 RUS: "Мы можем создавать тяжелые многоствольные пушки, если вы больше заботитесь об уроне массовых ускорителей, чем об сохранении энергии."
CA_Tech_ColdFusion_Name:
 Id: 50831
 ENG: "Cold Fusion"
 RUS: "Холодный синтез"
CA_PulseCapacitorSmall:
 Id: 50832
 ENG: "Pulse Capacitor - Small"
 RUS: "Малый ЭМИ накопитель"
CA_ThisIsASmallerVersion:
 Id: 50833
 ENG: "This is a smaller version of the capacitor, meant for ships with limited space. It is less efficient, however."
 RUS: "Это уменьшенная версия конденсатора, предназначенная для кораблей с ограниченным пространством."
CA_Tech_QuantumFusion_Name:
 Id: 50834
 ENG: "Quantum Fusion"
 RUS: "Квантовый синтез"
CA_Tech_QuantumFusion_Desc:
 Id: 50835
 ENG: "Quantum mechanics concerns the physical phenomena of the smallest scales known. Taking advantage of many tiny changes in quantum energy, this reactor is able to generate power. The variations in energy produced by these reactors is very predictable, making them quite stable. Because of this, they can be built on scales larger than any other reactors thus far."
 RUS: "Квантовая механика касается физических явлений мельчайших известных нам масштабов. Воспользовавшись множеством крошечных изменений квантовой энергии, этот реактор может вырабатывать энергию.  Синтез энергии, производимой этими реакторами, очень предсказуемый, что делает их довольно стабильными.  Благодаря этому они могут быть построены в масштабах больше, чем любые другие реакторы до сих пор."
CA_FighterQuantumFusionReactor:
 Id: 50836
 ENG: "Fighter Quantum Fusion Reactor"
 RUS: "Малый квантовый реактор"
CA_ThisIsAFighterVersion2:
 Id: 50837
 ENG: "This is a Fighter version of the Quantum Fusion Reactor. It produces less energy than an Anti-Matter Fighter reactor, costs more, and weighs more. Its major strength, however, is that its explosive force is much weaker in comparison to its Anti-matter equivalent."
 RUS: "Это версия реактора квантового синтеза для истребителей и малых кораблей. Он производит меньше энергии, чем малый реактор на антиматерии, стоит больше и больше весит.  Однако его главная сила в том, что его взрывная волна намного слабее по сравнению с взрывом антиматериального реактора."
CA_QuantumFusionReactorMedium:
 Id: 50838
 ENG: "Quantum Fusion Reactor Medium"
 RUS: "Квантовый реактор"
CA_ThisIsTheMediumVersion:
 Id: 50839
 ENG: "This is the medium version of the Quantum Fusion Reactor. It produces less energy than Anti-Matter medium reactors, costs more, and weighs more. Its major strength, however, is that its explosive force is much weaker in comparison to its Anti-matter equivalent."
 RUS: "Это средняя версия квантового термоядерного реактора. Он производит меньше энергии, чем средние реакторы на основе антиматерии, стоит больше и больше весит.  Однако его главная особенность в том, что его взрывная сила при разрушении намного слабее, по сравнению с эквивалентом на антивеществе."
CA_QuantumFusionReactor:
 Id: 50840
 ENG: "Quantum Fusion Reactor"
 RUS: "Большой квантовый реактор"
CA_ThisQuantumFusionReactorProduces:
 Id: 50841
 ENG: "This Quantum Fusion Reactor produces less energy than Anti-Matter Fighter reactor, costs more, and weighs more. Its major strength, however, is that its explosive force is much weaker in comparison to its Anti-matter equivalent."
 RUS: "Этот реактор квантового синтеза вырабатывает меньше энергии, чем реактор на антиматерии, стоит больше и больше весит.  Однако его главная особенность в том, что его взрывная сила намного слабее по сравнению с его эквивалентом на антивеществе."
CA_QuantumFusionReactorMassive:
 Id: 50842
 ENG: "Quantum Fusion Reactor Massive"
 RUS: "Массивный квантовый реактор"
CA_ThisQuantumFusionReactorIs:
 Id: 50843
 ENG: "This Quantum Fusion Reactor is the biggest single reactor we can build thus far. Its weight and cost is very high. Its major strength, however, is that its explosive force is much weaker in comparison to Anti-matter technology."
 RUS: "Этот реактор квантового синтеза - самый большой реактор, который мы можем построить на данный момент.  Его вес и стоимость очень высоки.  Однако его главная особенность в том, что его взрывная сила намного слабее по сравнению с технологией антивещества."
CA_Tech_MassiveAnti-Matter_Name:
 Id: 50844
 ENG: "Massive Anti-Matter"
 RUS: "Массивная антиматерия"
CA_Tech_MassiveAnti-Matter_Desc:
 Id: 50845
 ENG: "We can now construct an incredibly powerful, very large Anti-Matter Reactor. The amount of Anti-Matter stored within is extremely volatile, and should the reactor be destroyed, a powerful explosion will no doubt take place."
 RUS: "Теперь мы можем построить невероятно мощный и очень большой реактор антиматерии.  Количество хранящегося в нем антиматерии чрезвычайно изменчиво, и если реактор будет разрушен, несомненно, произойдет мощный взрыв."
CA_Tech_ArmoredColdFusion_Name:
 Id: 50846
 ENG: "Extreme Cold Fusion"
 RUS: "Холодный синтез в оболочке"
CA_Tech_DarkMatter_Name:
 Id: 50851
 ENG: "Dark Matter"
 RUS: "Темная материя"
CA_Tech_DarkMatter_Desc:
 Id: 50852
 ENG: "Although still a mystery to even our greatest minds, this invisible material can be coalesced into small areas. To accomplish this, gigantic, advanced gravitational machines pull ordinary matter apart over vast distances, making way for the dark matter to seep into a proverbial bucket of gravitational potential. By then surrounding and compressing it, usable energy is continuously emitted, making for an incredibly reliable source of power."
 RUS: "Хотя этот невидимый материал все еще остается загадкой даже для наших величайших умов, его можно объединить в небольшие области.  Для этого гигантские современные гравитационные машины разрывают обычную материю на огромные расстояния, давая возможность темной материи просачиваться в пресловутый сосуд с гравитационным потенциалом.  Окружая и сжимая его, мы постоянно излучаем полезную энергию, создавая невероятно надежный источник энергии."
CA_DarkMatterReactor:
 Id: 50853
 ENG: "Dark Matter Reactor"
 RUS: "Реактор на темной материи"
CA_ThisReactorWillProvideHigh:
 Id: 50854
 ENG: "This reactor will provide high and stable energy for our ships. Other sizes of Dark Matter reactor are not produced, due the the standardized way the dark matter is collected."
 RUS: "Этот реактор обеспечит наши корабли высокой и стабильной энергией.  Альтернативные размеры реактора не производятся из-за стандартизованного способа сбора темной материи."
CA_HeavyNuclearBombBay:
 Id: 50855
 ENG: "Heavy Nuclear Bomb Bay"
 RUS: "Отсек тяжелых ядерных бомб"
CA_ThisBombBayCanUtilize:
 Id: 50856
 ENG: "This bomb bay can utilize very powerful Tactical or Strategic Nuclear payloads to bombard enemy colonies. It has a high destructive potential. The target planet will suffer a temporary reduction to its Fertility level. Constant bombing might permanently reduce fertility and even change the planet's climate forever."
 RUS: "Этот бомбовый отсек может использовать очень мощные тактические или стратегические ядерные боеприпасы для бомбардировки вражеских колоний.  Обладает высоким разрушительным потенциалом.  Плодородие целевой планеты временно снижаеться.  Постоянные бомбардировки могут навсегда снизить рождаемость и даже изменить климат планеты."
CA_BioterminatorBombBay:
 Id: 50857
 ENG: "BioTerminator Bomb Bay"
 RUS: "Отсек бомб \"БиоТерминатор\""
CA_OrganicMoleculesEvenThoseFrom:
 Id: 50858
 ENG: "Organic molecules, even those from different worlds, all share many commonalities. By aggressively attacking those common roots, we have created a bomb that will very rapidly and thoroughly kill anything it comes in contact with. A few of these bombs will unquestionably destroy an entire civilian population in short order. The target planet will suffer a temporary reduction to its Fertility level. Constant bombing might permanently reduce fertility and even change the planet's climate forever."
 RUS: "Органические молекулы, даже из разных миров, имеют много общего.  Агрессивно атакуя эти общие корни, мы создали бомбу, которая очень быстро и полностью убивает все, с чем соприкасается.  Несколько таких бомб несомненно уничтожат все гражданское население в короткие сроки.  Плодородие целевой планеты временно снизится .  Постоянные бомбардировки могут навсегда снизить рождаемость и даже изменить климат планеты."
CA_AntimatterBombBay:
 Id: 50859
 ENG: "Anti-Matter Bomb Bay"
 RUS: "Отсек антиматериальных бомб"
CA_ThisHighlyDestructiveBombTurns:
 Id: 50860
 ENG: "This highly destructive bomb turns everything caught in its explosion radius into gamma rays. Very efficient for clearing out enemy colonies. The target planet will suffer a temporary reduction to its Fertility level. Constant bombing might permanently reduce fertility and even change the planet's climate forever."
 RUS: "Эта очень разрушительная бомба превращает все, что попадает в радиус ее взрыва, в гамма-лучи.  Очень эффективена для зачистки вражеских колоний.  Плодородие целевой планеты временно снизится.  Постоянные бомбардировки могут навсегда снизить рождаемость и даже изменить климат планеты."
CA_Tech_TritaniumArmor_Name:
 Id: 50861
 ENG: "Tritanium Armor"
 RUS: "Тритановая броня"
CA_Tech_TritaniumArmor_Desc:
 Id: 50862
 ENG: "Tritanium Armor is three times stronger than Steel Armor. Though the existence of this material was already previously known, its mass was not yet practical for ships. With our knowledge in Hyper-Active Armor, we can now design low mass Tritanium armor. The cost is very high."
 RUS: "Тритановая броня в три раза прочнее, чем стальная.  Хотя о существовании этого материала уже было известно ранее, его масса еще не была практичной для кораблей.  Благодаря нашим знаниям в области гиперактивной брони мы теперь можем создавать маломассивную тритановую броню.  Стоимость очень высока."
CA_TheUltimateArmorTheStrongest:
 Id: 50863
 ENG: "The ultimate armor. The strongest material known for its mass/strength ratio. It also nullifies the effect of Armor Piercing III"
 RUS: "Ультимативная броня.  Самый прочный материал, известный своим соотношением масса / прочность. Аннулирует эффект\"Пробитие брони III\""
CA_TritaniumArmorSmall:
 Id: 50864
 ENG: "Tritanium Armor Small"
 RUS: "Малая тритановая плита"
CA_TritaniumArmorMedium:
 Id: 50865
 ENG: "Tritanium Armor Medium"
 RUS: "Средняя тритановая плита"
CA_TritaniumArmorLarge:
 Id: 50866
 ENG: "Tritanium Armor Large"
 RUS: "Большая тритановая плита"
CA_MassDriverShort:
 Id: 50867
 ENG: "Mass Driver - Short"
 RUS: "Короткий масс-драйвер"
CA_ThisVersionOfTheMass:
 Id: 50868
 ENG: "This version of the Mass Driver has a shorter barrel, made to fit into smaller ships. Its projectiles have shorter range and less explosion radius."
 RUS: "Эта версия массового драйвера имеет более короткий ствол, предназначенный для небольших кораблей. Из-за укороченного ствола имет меньшую дальность выстрела и его снаряды имеют меньший радиус взрыва."
CA_MassDriverDual:
 Id: 50869
 ENG: "Mass Driver - Dual"
 RUS: "Двойной масс-драйвер"
CA_EnhancedWithAttributesOfSubspace:
 Id: 50870
 ENG: "Enhanced with attributes of subspace physics, these mass drivers are able to achieve incredible range and power compared to a magnetic mass driver. The dual barrel on this weapon "
 RUS: "Этот масс-драйвер способен выпускать невероятно мощные снаряды с большим радиусом поражения, по сравнению с электоромагнитными ускорителями массы. Имеет двойной ствол."
CA_Tech_LinkedDarkMatter_Name:
 Id: 50875
 ENG: "Linked Dark Matter"
 RUS: "Сопряженная \"ТМ\""
CA_Tech_LinkedDarkMatter_Desc:
 Id: 50876
 ENG: "Until now, the idea of linking our dark matter reactors to harness more energy has been an impossible one. However, with recent revelations in dark matter theory, we have successfully devised a way to interconnect the spacial inhibitors containing our dark matter, greatly increasing their power efficiency."
 RUS: "До сих пор идея соединить наши реакторы темной материи, чтобы использовать больше энергии, была невозможной.  Однако с недавними открытиями в теории темной материи мы успешно изобрели способ взаимосвязи пространственных ингибиторов, содержащих нашу темную материю, что значительно повысило их энергоэффективность."
CA_LinkedDarkMatterSet:
 Id: 50877
 ENG: "Linked Dark Matter Set"
 RUS: "Сопряженный 'ТМ' реактор"
CA_AStateOfTheArt:
 Id: 50878
 ENG: "A state of the art series of 9 Dark Matter Reactors successfully bound together in an advanced protective lab. This facility features a powerful local shielding generator and several small robots that aid in ship repairs."
 RUS: "Современная серия из 9 реакторов темной материи, успешно объединенных в передовую защитную лабораторию.  На этом объекте есть мощный локальный генератор экранирования и несколько небольших роботов, помогающих в ремонте корабля."
CA_Tech_DarkEnergy_Name:
 Id: 50879
 ENG: "Dark Energy"
 RUS: "Темная энергия"
CA_Tech_DarkEnergy_Desc:
 Id: 50880
 ENG: "Utilizing an incredibly complex series of warp fields, we can create a localized, massive void of energy, naturally filled in with constant amounts of dark energy. We can then harness this dark energy by collapsing the warp fields, yielding a substantial burst of power. A Dark Energy reactor repeats this process in quick succession, never allowing the dark energy to grow out of hand."
 RUS: "Используя невероятно сложную серию полей варпа, мы можем создать локализованную массивную энергетическую пустоту, естественным образом заполненную постоянным количеством темной энергии.  Затем можно обуздать эту темную энергию, разрушив поля варпа, что приведет к значительному выбросу энергии.  Реактор темной энергии повторяет этот процесс в быстрой последовательности, никогда не позволяя темной энергии выйти из-под контроля."
CA_DarkEnergyReactor:
 Id: 50881
 ENG: "Dark Energy Reactor"
 RUS: "Реактор на темной энергии"
CA_ThisDarkEnergyReactorProduces:
 Id: 50882
 ENG: "This Dark Energy Reactor produces vast amounts of energy. We can only construct a large version. Since the process of harnessing dark energy involves the constant inhibition of its expansion, compromising this system will lead to a catastrophic explosion. Energy and Beam weapons will not damage this reactor, however, owing to the energetic voids within."
 RUS: "Этот реактор темной энергии производит огромное количество мощности.  Мы можем построить только большую версию.  Поскольку процесс обуздания темной энергии включает постоянное подавление ее расширения, компрометация этой системы приведет к катастрофическому взрыву.  Однако энергетическое и лучевое оружие не повредит этот реактор из-за энергетических пустот внутри."
CA_Tech_MissilePD_I_Name:
 Id: 50883
 ENG: "Missile PD I"
 RUS: "Ракетная ТЗ I"
CA_Tech_MissilePD_I_Desc:
 Id: 50884
 ENG: "We can adapt our atmospheric missile point defense systems for space usage. It might prove useful for countering enemy missiles at a longer range than mass driver point defense systems."
 RUS: "Мы можем адаптировать наши системы атмосферной противоракетной обороны для использования в космосе.  Это может оказаться полезным для противодействия вражеским ракетам на большей дальности."
CA_MissilePointDefenseLight:
 Id: 50885
 ENG: "Missile Point Defense - Light"
 RUS: "Легкая ракетная ТЗ"
CA_ThisSmallTurretCanLaunch:
 Id: 50886
 ENG: "This small turret can launch very fast and agile missiles in a 360 degree field of fire, meant to counter enemy missiles at medium range. The missiles are primed to explode near the targeted enemy missiles, and though their damage is small, the explosive radius is very large. This turret uses a lot of ordnance."
 RUS: "Эта небольшая турель может запускать очень быстрые и маневренные ракеты в секторе 360 градусов. Она предназначена для борьбы с ракетами противника на средней дальности.  Ракеты взрываються рядом с намеченными ракетами противника, и хотя их урон мал, но радиус взрыва очень велик.  Эта турель использует много боеприпасов."
CA_Tech_MissilePD_II_Name:
 Id: 50887
 ENG: "Missile PD II"
 RUS: "Ракетная ТЗ II"
CA_Tech_MissilePD_II_Desc:
 Id: 50888
 ENG: "As enemy missiles become more sophisticated, we can compensate by upgrading our Missile Point Defense systems to launch better counter missiles."
 RUS: "По мере того, как вражеские ракеты становятся все более совершенными, мы можем компенсировать это, модернизируя наши системы противоракетной обороны."
CA_MissilePointDefenseHeavy:
 Id: 50889
 ENG: "Missile Point Defense - Heavy"
 RUS: "Тяжелая ракетная ТЗ"
CA_ThisLargerMissilePointDefense:
 Id: 50890
 ENG: "This larger Missile Point Defense turret launches heavier, but still very fast missiles to counter enemy missile attacks at long range."
 RUS: "Эта более крупная башня противоракетной обороны запускает более тяжелые, но все же очень быстрые ракеты, чтобы противостоять ракетным атакам противника на больших дистанциях."
CA_MassDriverLong:
 Id: 50891
 ENG: "Mass Driver - Long"
 RUS: "Длинный масс-драйвер"
CA_ThisVersionOfTheMass2:
 Id: 50892
 ENG: "This version of the Mass Driver has a longer barrel, useful for ships with more space. Its projectiles have longer range and a larger explosive radius."
 RUS: "Эта версия массового ускорителя имеет более длинный ствол, что полезно для кораблей с большим корпусом.  Его снаряды имеют больший радиус действия и радиус взрыва при попадании."
CA_Tech_SubspaceArtillery_II_Name:
 Id: 50893
 ENG: "Subspace Artillery II"
 RUS: "Космическая артиллерия II"
CA_Tech_SubspaceArtillery_II_Desc:
 Id: 50894
 ENG: "Using conventional physics, extremely large cannons proved too unwieldy for applications in space. However, advancements in subspace field theory have allowed for the creation of a second set of larger, extremely powerful cannons, along with a tactical one for our more cramped vessels. These weapons will shred through enemy armor, and offer a small to decent chance of penetrating shields."
 RUS: "Используя традиционную физику, чрезвычайно большие пушки оказались слишком громоздкими для применения в космосе.  Однако достижения в теории поля подпространства позволили создать второй набор более крупных и чрезвычайно мощных пушек, для наших кораблей. Это оружие пробивает броню врага и дает небольшой или приличный шанс пробить щиты."
CA_DualMassDriverHeavy:
 Id: 50895
 ENG: "Dual Mass Driver - Heavy"
 RUS: "Двойной тяжелый масс-драйвер"
CA_ByIncreasingTheThicknessAnd:
 Id: 50896
 ENG: "By increasing the thickness and length of the dual mass driver barrels, this weapon is able to achieve a higher range and damage potential when compared to its smaller counterpart. However, the increased length may make it difficult to fit on our smaller vessels."
 RUS: "За счет увеличения толщины и длины стволов двухствольного массового драйвера это оружие может достигать большей дальности и потенциального поражения по сравнению с его меньшим аналогом.  Однако увеличенная длина может затруднить установку на наши небольшие суда."
CA_MassiveCannonHeavy:
 Id: 50897
 ENG: "Massive Cannon - Heavy"
 RUS: "Массивное орудие"
CA_EvenMoreMonstrousThanThe:
 Id: 50898
 ENG: "Even more monstrous than the massive cannon, only battleships and titans can mount this weapon. It has an even higher chance to penetrate enemy shields, and deals an absurd amount of damage from an incredibly high range."
 RUS: "Еще более чудовищное орудие, чем тяжелая пушка, только линкоры и титаны могут нести это оружие. Пушка имеет еще более высокий шанс проникнуть сквозь щиты противника, обладает просто абсурдным количеством ущерба и невероятно большую дальность."
CA_Tech_DisintegratorArray_II_Name:
 Id: 50899
 ENG: "Disintegrator Array II"
 RUS: "Продвинутая Дезинтеграция"
CA_Tech_DisintegratorArray_II_Desc:
 Id: 50900
 ENG: "We can now research and construct a larger disintegrator array."
 RUS: "Теперь мы можем исследовать и построить более крупный массив дезинтеграторов."
CA_DisintegratorArraySmall:
 Id: 50901
 ENG: "Disintegrator Array - Small"
 RUS: "Малый дезинтегратор"
CA_ThisIsASmallerArray:
 Id: 50902
 ENG: "This is a smaller array for our smaller ships. It does less damage, but requires less power to operate."
 RUS: "Это уменьшеный вариант для наших кораблей. Он наносит меньше повреждений, но требует меньше энергии для работы."
CA_DisintegratorArrayLarge:
 Id: 50903
 ENG: "Disintegrator Array - Large"
 RUS: "Большой дезинтегратор"
CA_EnemyCommandersWillQuakeIn:
 Id: 50904
 ENG: "Enemy commanders will quake in fear at the sight of our new large Disintegrator arrays. These hulking weapons can only be fitted on Battleships or Titans, however."
 RUS: "Командиры противника будут дрожать от страха при виде наших новых больших массивов дезинтеграторов.  Однако это громоздкое оружие можно установить только на линкоры или титаны."
CA_Tech_Deflectors_I_Name:
 Id: 50905
 ENG: "Deflectors I"
CA_Tech_Deflectors_I_Desc:
 Id: 50906
 ENG: "Expending our knowledge of basic deflector technology, we can create specialized low yield deflection emitters which have increased deflection rate."
CA_Tech_Deflectors_II_Name:
 Id: 50907
 ENG: "Deflectors II"
CA_Tech_Deflectors_II_Desc:
 Id: 50908
 ENG: "Increase in hull sizes will require better deflector technology. We can great larger Deflectors and advanced small crafts Deflectors."
CA_Module_Class_I_Deflector_Name:
 Id: 50909
 ENG: "Class I Deflector"
CA_Module_Class_I_Deflector_Desc:
 Id: 50910
 ENG: "The Class I deflector has a low coverage radius, but better deflection than the Basic Deflector Shield, along with beam resistence."
CA_Module_Class_II_Deflector_Name:
 Id: 50911
 ENG: "Class II Deflector"
CA_Module_Class_II_Deflector_Desc:
 Id: 50912
 ENG: "A larger deflector with more coverage and better deflection."
CA_Tech_Battle_Shielding_I_Name:
 Id: 50913
 ENG: "Battle Shielding I"
 RUS: "Боевые щиты I"
CA_Tech_Battle_Shielding_I_Desc:
 Id: 50914
 ENG: "We believe it would be possible to improve our energy shields by making them a little stronger, and adding the ability to recharge during combat."
 RUS: "Мы считаем, что можно улучшить наши энергетические щиты, сделав их немного сильнее и добавив возможность перезарядки во время боя."
CA_Tech_Battle_Shielding_II_Name:
 Id: 50915
 ENG: "Battle Shielding II"
 RUS: "Боевые щиты II"
CA_Tech_Battle_Shielding_II_Desc:
 Id: 50916
 ENG: "We can create bigger and better Battle Shields."
 RUS: "Мы можем создавать большие и лучшие боевые щиты."
CA_Module_Class_I_BattleShield_Name:
 Id: 50917
 ENG: "Class I Battle Shield"
 RUS: "Боевой щит I класса"
CA_Module_Class_I_BattleShield_Desc:
 Id: 50918
 ENG: "This shield has better power output and combat recharge range. It also has slight projectile deflection."
CA_Module_Class_II_BattleShield_Name:
 Id: 50919
 ENG: "Class II Battle Shield"
 RUS: "Боевой щит II класса"
CA_Module_Class_II_BattleShield_Desc:
 Id: 50920
 ENG: "This shield is bigger and heavier, but can produce stonger and larger shield, with some Shield Deflection."
CA_Tech_SmallStations_Desc:
 Id: 50921
 ENG: "In order to defend our colonies from the growing danger of enemy fleets, we have recently devised blueprints to construct our first orbital station, a new type of structure that is larger than our small and heavy platforms."
 RUS: "Чтобы защитить наши колонии от растущей опасности вражеского флота, мы недавно разработали чертежи для строительства нашей первой орбитальной станции, нового типа конструкции, которая больше, чем наши малые и тяжелые платформы.  Кроме того, создание системы противоракетной обороны большой дальности считалось необходимым для наших станций, и это оружие должно было оказаться эффективным против любых атак противника на сравнительно дальних дистанциях."
CA_LightOrbitalMissileLauncher:
 Id: 50922
 ENG: "Light Orbital Missile Launcher"
 RUS: "Легкий орбитальный пускатель"
CA_ThisFixedmountMissileLauncherFires:
 Id: 50923
 ENG: "This fixed-mount missile launcher fires salvos of long range missiles which are effective against a wide range of targets. It is only practical for stations, but can also be installed on our heavy platforms."
 RUS: "Эта стационарная ракетная установка производит залп из ракет большой дальности, которые эффективны по широкому кругу целей.Она практична только для станций, но также может быть установлена на наших тяжелых платформах."
CA_ThisIsABomberDedicated:
 Id: 50928
 ENG: "This is a bomber dedicated Anti-Matter bomb bay. The bombs will inflict heavy, pure damage to slower moving enemy capital ships."
 RUS: "Этот отсек предназначенный для антиматериальных бомб.Его можно установить на наши бомбардировщики. Бомбы нанесут тяжелый чистый урон медленно движущимся крупным кораблям противника."
CA_MeltBombBays2:
 Id: 50931
 ENG: "Melt Bomb Bays"
 RUS: "Отсеки для бомб плавления"
CA_MeltBombsDealHighDamage:
 Id: 50932
 ENG: "Melt bombs deal high damage, are effective against shields, and cause some EMP damage. They are slightly more accurate and robust in comparison to other fighter bombs, but they are also slower."
 RUS: "Бомбы плавления наносят большой урон, эффективны против щитов и вызывают некоторый урон ЭМИ.  Они более точны и надежны по сравнению с другими бомбами истребителей, но они также медленнее."
CA_ShieldbombBay:
 Id: 50935
 ENG: "Shield-Bomb Bay"
 RUS: "Отсек щитовых бомб"
CA_ShieldBombsAreSpecificallyDesigned:
 Id: 50936
 ENG: "Shield Bombs are specifically designed to counter enemies who only use shields to defend their ships. These bombs have a 75% chance to bypass shields and damage ship components, while delivering a small amount of EMP damage. They are not very effective against armor, however."
 RUS: "Щитовые бомбы специально разработаны для борьбы с врагами, которые используют щиты как единственную защиту своих кораблей.  Эти бомбы имеют 75% шанс обойти щиты и повредить компоненты корабля, нанося при этом небольшой урон ЭМИ.  Однако они не очень эффективны против брони."
CA_IonBombBay:
 Id: 50937
 ENG: "Ion Bomb Bay"
 RUS: "Отсек ионных бомб"
CA_AntimatterBombBay2:
 Id: 50942
 ENG: "Anti-Matter Bomb Bay"
 RUS: "Отсек антиматериальных бомб"
CA_PlasmaBombBay:
 Id: 50947
 ENG: "Plasma Bomb Bay"
 RUS: "Отсек плазменных бомб"
CA_BlueLaserMk4:
 Id: 50956
 ENG: "Blue Laser Mk4"
 RUS: "Синий лазер IV"
CA_TheseAreTrulyHighFire:
 Id: 50957
 ENG: "These are truly high fire rate laser weapons. They also do more damage and require more power to maintain."
 RUS: "Это действительно высокотехнологичное лазерное оружие. Наносит много урона и требует большой мощности."
CA_MaximumGoodsStorage4:
 Id: 50958
 ENG: "+600 maximum goods storage, +1 infrastructure"
CA_AdvancedPulseCapacitor:
 Id: 50959
 ENG: "Advanced Pulse Capacitor"
 RUS: "Средний прод.ЭМИ накопитель"
CA_ThisIsAnImprovementOver:
 Id: 50960
 ENG: "This is an improvement over the basic electromagnetic capacitor. Any ship equipped with pulse capacitors will be substantially more difficult to disable with electromagnetic pulse weaponry. They also aid the ship to recover faster from EMP overloads"
 RUS: "Это усовершенствованный электромагнитный конденсатор.  Любой корабль, оснащенный импульсными конденсаторами, будет значительно труднее вывести из строя с помощью электромагнитного импульсного оружия.  Они также помогают кораблю быстрее восстанавливаться после перегрузок ЭМИ."
CA_AdvancedPulseCapacitorSmall:
 Id: 50961
 ENG: "Advanced Pulse Capacitor - Small"
 RUS: "Малый прод.ЭМИ накопитель"
CA_ThisIsAnImprovementOver2:
 Id: 50962
 ENG: "This is an improvement over the small basic pulse capacitor, meant for ships with tight space. It is less efficient than the bigger version."
 RUS: "Это улучшение малого импульсного конденсатора, предназначенного для судов с ограниченным пространством.  Он менее эффективен, чем большая версия."
CA_Tech_AdvPulseCapacitors_Name:
 Id: 50963
 ENG: "Advanced Capacitors"
 RUS: "Продвинутые конденсаторы"
CA_Tech_AdvPulseCapacitors_Desc:
 Id: 50964
 ENG: "Protecting our ships from EMP damage is becoming a necessity. We can design advanced, more efficient versions of our basic pulse capacitors."
 RUS: "Защита наших кораблей от повреждений ЭМИ становится необходимостью.  Мы можем разработать усовершенствованные, более эффективные версии наших основных импульсных конденсаторов."
CA_AutoturretType4:
 Id: 50973
 ENG: "AutoTurret Type68"
 RUS: "Авто-турель тип 68"
CA_ThisBarreledTurretFiresHigh:
 Id: 50974
 ENG: "This 3 barreled turret fires high explosive rounds and an upgrade to the type 62 Auto Turret"
 RUS: "Эта трехствольная турель стреляет осколочно-фугасными снарядами и является улучшенной версией автоматической турели типа 62."
CA_Tech_Drones_Name:
 Id: 50975
 ENG: "Drone AI Command"
 RUS: "Дрон Управления ИИ"
CA_Tech_Drones_Desc:
 Id: 50976
 ENG: "Rather than depending on a living being, we can easily design an AI program to take control of a smaller drone fighter. This comes with multiple advantages, such as the elimination of life support systems, as well as greater capacity for acceleration and turning speed. These drones can be launched from a special tube able to be installed on larger ship hulls."
 RUS: "Вместо того, чтобы зависеть от живого существа, мы можем легко разработать программу искусственного интеллекта, чтобы взять под контроль небольшой дрон-истребитель.  Это дает множество преимуществ, таких как отказ от систем жизнеобеспечения, а также большая способность к ускорению и скорости поворота.  Эти дроны могут запускаться из специальной трубы, которую можно установить на корпуса более крупных кораблей."
CA_BasicDroneCommandModule:
 Id: 50977
 ENG: "Basic Drone Command Module"
 RUS: "Базовий командный модуль"
CA_ThisIsOurFirstDrone:
 Id: 50978
 ENG: "This is our first Drone AI command module. It contains the hardware and software of an independent drone, as well as basic power generation and storage."
 RUS: "Это наш первый командный модуль для дрона с автономным управлением.  Он содержит аппаратное и программное обеспечение, систему ведения огня, не большие сенсоры, а также основной источник выработки и накопления энергии."
CA_ImprovedDroneCommandModule:
 Id: 50979
 ENG: "Improved Drone Command Module"
 RUS: "Улучшеный командный модуль"
CA_AfterImprovingOurKnowledgeIn:
 Id: 50980
 ENG: "After improving our knowledge in power generation techniques, we are now able to construct an improved command module that can generate and store twice the amount of earlier modules."
 RUS: "После получения новых знаний о методах выработки электроэнергии, мы улучшили командный модуль и теперь он генерирует и хранит в два раза больше энергии. Так же были улучшены сенсоры и увеличена прочность модуля."
CA_ShieldedDroneCommandModule:
 Id: 50981
 ENG: "Shielded Drone Command Module"
 RUS: "Защитный командный модуль"
CA_ThisDroneCommandModuleAs:
 Id: 50982
 ENG: "This drone command module as a basic shield installed as well as an improved software, enabling it to track more than one target."
 RUS: "Альтернативная версия командного модуля. Благодаря снижению вырабатываемой мощности, нам удалось установить небольшой щит и систему поиска целей и ведения огня."
CA_DroneAntimatterBombBay:
 Id: 50983
 ENG: "Drone Anti-Matter Bomb Bay"
 RUS: "Малый отсек антиматер.бомб"
CA_ThisIsASmallBomb:
 Id: 50986
 ENG: "This is a small bomb bay intended for a drone. Typically, it contains only 4 bombs, and the drone will need to resupply at its mothership after two or three bomb runs."
 RUS: "Это небольшой бомбовый отсек, предназначенный для дрона.  Как правило, он содержит всего 4 бомбы и дрону нужно будет пополнить запасы на своем корабле-носителе, после двух или трех запусков бомб."
CA_DronePulseBeam:
 Id: 50987
 ENG: "Drone Pulse Beam"
 RUS: "Малый импульсный луч"
CA_APulseBeamSpecificallyModified:
 Id: 50988
 ENG: "A pulse beam specifically modified for use on a drone. It is very accurate, but not as strong as its larger counterpart."
 RUS: "Импульсный луч, специально модифицированный для использования нашими дронами.  Он очень точный, но не имеет такой разрушительной силы, как у его более крупного аналога."
CA_DroneAttackCannon:
 Id: 50989
 ENG: "Drone Attack Cannon"
 RUS: "Пушка дрона I"
CA_ThisAttackCannonFiresRounds:
 Id: 50990
 ENG: "This attack cannon fires 5 rounds at high velocity in close range bursts. It has limited ammo, usually sufficient enough for a short skirmish."
 RUS: "Эта кинетическая пушка производит 5 выстрелов очередями с высокой скоростью на близком расстояния. Достаточно, чтобы нанести повреждения малым кораблям, к тому же снаряды имеют кумулятивную способность и шанс пробить щиты."
CA_BasicDroneEngine:
 Id: 50991
 ENG: "Basic Drone Engine"
 RUS: "Базовый двигатель дрона"
CA_ThisBasicEngineProvidesThrust:
 Id: 50992
 ENG: "This Basic engine provides thrust and turn thrust for the drone. Drones can withstand much greater G-forces than if a living being were to be present. It is also equipped with a small secondary command unit that can track targets, should the main command module be destroyed."
 RUS: "Базовый двигатель обеспечивает тягу и поворачиваемость для дрона. Дроны могут выдерживать гораздо большее G-сил, чем живые существа. Он также оснащен небольшим вторичным ядром-процессором, который может отслеживать цели, если основной командный модуль будет уничтожен."
CA_ImprovedDroneEngine:
 Id: 50993
 ENG: "Improved Drone Engine"
 RUS: "Улучшеный двигатель дрона"
CA_ThisImprovedEngineProvidesMore:
 Id: 50994
 ENG: "This improved engine provides more thrust, as well as some more power storage for the power hungry weapon modules."
 RUS: "Улучшенный двигатель обеспечивает больше тяги, а также меньше потребляет энергии."
CA_ShieldedDroneEngine:
 Id: 50995
 ENG: "Shielded Drone Engine"
 RUS: "Двигатель дрона со щитом"
CA_ThisDroneEngineModuleProvides:
 Id: 50996
 ENG: "This drone engine module provides a little less thrust than the improved engine module, but also comes fitted with a basic shield, providing increased survivability for the drone."
 RUS: "Этот дигатель дает меньше тяги, но зато поставляется с базовым маленьким щитом, обеспечивая хоть какую-то защиту."
CA_DroneRocketLauncher:
 Id: 50997
 ENG: "Drone Rocket Launcher"
 RUS: "Ракетная установка дрона"
CA_ThisIsASimpleRocket:
 Id: 50998
 ENG: "This is a simple rocket launcher that can be fitted on a drone. It has less range than a standard rocket launcher."
 RUS: "Это простая ракетная установка, которую можно установить на дрон.  У нее более низкая дальность полета, чем у малой ракетной установки."
CA_DroneLaunchTube:
 Id: 50999
 ENG: "Drone Launch Tube"
 RUS: "Труба для запуска дронов"
CA_ATubeUsedToLaunch:
 Id: 51000
 ENG: "A tube used to launch a drone into combat. It is cheaper and smaller in comparison to fighter bays, as airlocks are not needed for the drone."
 RUS: "Труба, используемая для запуска дрона в бой.  Она дешевле и меньше по сравнению с отсеками для истребителей, поскольку для дрона не требуются воздушные шлюзы."
CA_SmallNanoOrdnanceLocker:
 Id: 51001
 ENG: "Small Nano Ordnance Locker"
 RUS: "Малый нано-склад боеприпасов"
CA_ThisStorageLockerHasBeen:
 Id: 51002
 ENG: "This Storage locker has been augmented with an army of small Nanobots that assemble the needed type of ammunition from raw materials. Within, ammunition is created in very small parts, allowing this locker to fit 4 times the ordnance of a normal ordnance pod. Drawbacks are higher production cost and a small explosion if the locker is destroyed."
 RUS: "Этот склад был дополнен армией маленьких наноботов, которые собирают необходимые боеприпасы из сырья.  Внутри боеприпасы создаются из очень маленьких частей, что позволяет разместить в этом складе в 4 раза больше боеприпасов, чем в обычных контейнерах для боеприпасов.  Недостатки - более высокая стоимость производства и небольшой взрыв при разрушении."
CA_Tech_PlasmaVectoringII_Name:
 Id: 51003
 ENG: "Plasma Vectoring II"
 RUS: "Плазменная векторизация II"
CA_Tech_PlasmaVectoringII_Desc:
 Id: 51004
 ENG: "We can accelerate the high-pressure system used to vent plasma from the ship's reactors. This can increase damage output by a high percentage. The density of the plasma will make it slightly more effective versus shields."
 RUS: "Мы можем ускорить работу системы высокого давления, используемой для выпуска плазмы из реакторов корабля.  Это может увеличить наносимый урон на высокий процент.  Плотность плазмы сделает ее немного более эффективной в борьбе с экранами."
CA_Tech_PlasmaVectoringIII_Name:
 Id: 51005
 ENG: "Plasma Vectoring III"
 RUS: "Плазменная векторизация III"
CA_Tech_PlasmaVectoringIII_Desc:
 Id: 51006
 ENG: "We can use calibrated reactor power to further narrow the focus of the plasma streams, making the plasma flame more destructive. This comes with a much higher power cost, but it is more effective against shields."
 RUS: "Мы можем использовать откалиброванную мощность реактора, чтобы еще больше сузить фокус плазменных потоков, сделав плазменное пламя более разрушительным.  Это требует гораздо большей энергии, но более эффективно против щитов."
CA_Tech_PlasmaVectoringIV_Name:
 Id: 51007
 ENG: "Plasma Vectoring IV"
 RUS: "Плазменная векторизация IV"
CA_Tech_PlasmaVectoringIV_Desc:
 Id: 51008
 ENG: "Using more power and higher pressure systems leads to very focused and lethal plasma vents, at the expense of higher power and ordnance consumption."
 RUS: "Использование большей мощности и систем с более высоким давлением приводит к очень целенаправленным и смертоносным плазменным прогарам за счет более высокого потребления энергии и боеприпасов."
CA_HighPressurePlasmaThrower:
 Id: 51009
 ENG: "High Pressure Plasma Thrower"
 RUS: "Плазмотрон высокого давления"
CA_ThisPlasmaThrowerUsesA:
 Id: 51010
 ENG: "This plasma thrower uses a higher pressure vent system and increases the damage of the plasma cloud. It also fares well against shields."
 RUS: "Этот плазмотрон использует систему вентиляции с более высоким давлением и увеличивает повреждение плазменного облака.  Он также хорошо справляется со щитами."
CA_PowerAssistedPlasmaThrower:
 Id: 51011
 ENG: "Power Assisted Plasma Thrower"
 RUS: "Усиленный плазмотрон"
CA_ThisPlasmaThrowerVentsA:
 Id: 51012
 ENG: "This plasma thrower vents a more focused plasma cloud thanks to power transfer from the ship's reactors. It is very good versus Shields, but requires high power and more ordnance."
 RUS: "Этот плазмотрон выпускает более сфокусированное плазменное облако за счет передачи энергии от реакторов корабля.  Он очень хорош против щитов, но требует большой мощности и большего количества боеприпасов."
CA_HyperPlasmaThrower:
 Id: 51013
 ENG: "Hyper Plasma Thrower"
 RUS: "Гиперплазмотрон"
CA_Tech_ImprovedSRMSystems_Name:
 Id: 51014
 ENG: "Anti-Fighter Missiles II"
 RUS: "Ракеты анти истребитель II"
CA_Tech_ImprovedSRMSystems_Desc:
 Id: 51015
 ENG: "We can further improve our short range missile technology by creating more destructive missiles, with additional range and utility."
 RUS: "Мы можем и дальше совершенствовать нашу ракетную технологию малой дальности, создавая более разрушительные ракеты с большей дальностью и полезностью."
CA_LightningStorm:
 Id: 51016
 ENG: "Lightning Storm"
 RUS: "\"Грозовой шторм\""
CA_ThisIsAnImprovedVersion:
 Id: 51017
 ENG: "This is an improved version of the Shadow Storm, with more missiles per salvo, and increased damage per missile. However, they have a slightly lower chance to penetrate enemy shields."
 RUS: "Это улучшенная версия установки \"Шторм Теней\" с большим количеством ракет за залп и увеличенным уроном на каждую ракету.  Однако у них немного ниже шанс пробить вражеские щиты."
CA_AssaultOrbitalMissile:
 Id: 51018
 ENG: "Assault Orbital Missile"
 RUS: "Штурмовые орбитальные ракеты"
CA_LikelyTheLongestRangeWeapon:
 Id: 51019
 ENG: "Likely the longest range weapon ever created, This orbital missile emplacement will launch a barrage of devastatingly powerful and maneuverable missiles, designed to target frigates and larger ships."
 RUS: "Вероятно, самое дальнобойное оружие из когда-либо созданных, эта орбитальная ракетная установка будет запускать поток разрушительно мощных и маневренных ракет, предназначенных для поражения фрегатов и более крупных кораблей."
CA_HeavyOrbitalMissileLauncher:
 Id: 51020
 ENG: "Heavy Orbital Missile Launcher"
 RUS: "Тяжелый орбитальный пускатель"
CA_ThisOrbitalMissileLauncherFires:
 Id: 51021
 ENG: "This orbital missile launcher fires large missiles which are designed to strike frigates and larger ships. It features an extremely long range, and a separation phase when missiles near the target."
 RUS: "Эта орбитальная ракетная установка запускает большие ракеты, которые предназначены для поражения фрегатов и более крупных кораблей.  Она отличается чрезвычайно большой дальностью и фазой разделения, когда ракета приближается к цели."
CA_HeavyLaserEmplacement:
 Id: 51022
 ENG: "Heavy Laser Emplacement"
 RUS: "Тяжелая лазерная установка"
CA_ThisIsThePlanetaryVersion:
 Id: 51023
 ENG: "This is the planetary version of the Heavy Laser Turret. It can target everything in a short planetary range. Several of these are placed on the planet. Their number (translated to rate of fire) increase as the colony becomes bigger."
 RUS: "Это планетарная версия тяжелой лазерной турели. Она может нацеливаться на все, что находится на небольшом меж планетном расстоянии.  Некоторые из них размещены на планете.  Их количество (в переводе на скорострельность) увеличивается по мере увеличения колонии."
CA_FiresHeavyLaserPulsesShort:
 Id: 51024
 ENG: "Fires Heavy Laser pulses. Short Range."
 RUS: "Запускает тяжелые лазерные импульсы на короткой дистанции."
CA_DisruptorEmplacement:
 Id: 51025
 ENG: "Disruptor Emplacement"
 RUS: "Установка \"Разрушитель\""
CA_ThisIsThePlanetaryVersion2:
 Id: 51026
 ENG: "This is the planetary version of the Disruptor Turret. Several of these in key locations have increased damage over the Heavy Laser Turret, but are too imprecise to target Fighters."
 RUS: "Это планетарная версия турели \"разрушителя\".имеет увеличенный урон по сравнению с тяжелой лазерной турелью, но слишком неточна для прицельного огня по истребителям."
CA_FiresHeavyDisruptorPulsesCannot:
 Id: 51027
 ENG: "Fires Heavy Disruptor pulses. Cannot target Fighters."
 RUS: "Запускает тяжелые деструктивные импульсы.Огонь по истребителям не возможен."
CA_PhotonCannonEmplacement:
 Id: 51028
 ENG: "Photon Cannon Emplacement"
 RUS: "Установка фотонной пушки"
CA_ThisIsThePlanetaryVersion3:
 Id: 51029
 ENG: "This is the planetary version of the Photon Turret. Its major advantages are explosive projectiles and longer range. These are placed in multiple location on the planet for maximum coverage."
 RUS: "Это планетарная версия фотонной турели.  Его главные преимущества - разрывные снаряды и большая дальность действия.  Она размещаеться в нескольких местах на планете для максимального охвата."
CA_FiresPhotonChargesMediumRange:
 Id: 51030
 ENG: "Fires Photon Charges. Medium range. Explosive payload."
 RUS: "Запускает фотонные заряды.  Средний диапазон. Разрывные заряды."
CA_VastAmountsOfPowerIs:
 Id: 51031
 ENG: "Vast amounts of power is used to deliver a lethal plasma cloud which is also excellent versus shields. Sadly, with high power requirements and slightly less range."
 RUS: "Огромное количество энергии используется для доставки смертоносного плазменного облака. Отлично справляется со щитами.  К сожалению, требовательна к мощности и имеет чуть меньший радиус действия."
CA_ForwardEnergizerShotgun:
 Id: 51038
 ENG: "Forward Energizer Shotgun"
 RUS: "Передний энерго дробовик"
CA_ThisIsAForwardFacing:
 Id: 51039
 ENG: "This is a forward facing version of the H.V.E Shotgun, designed for Fighter to Frigate roles. It has less range and a limited field of fire, but also lower cost and mass."
 RUS: "Это передняя версия дробовика H.V.E, разработанная для истребителя.  У него меньшая дальность и ограниченное поле огня, но также меньшая стоимость и масса."
CA_ForwardRepeaterShotgun:
 Id: 51040
 ENG: "Forward Repeater Shotgun"
 RUS: "Передний дробовик с повт."
CA_ThisIsAForwardFacing2:
 Id: 51041
 ENG: "This is a forward facing version of the Repeater Shotgun, designed for Fighter to Frigate roles. It has less range and a limited field of fire, but also lower cost and mass."
 RUS: "Это передняя версия дробовика с повторителем, разработанная для истребителя. У него меньшая дальность и ограниченное поле огня, но также меньшая стоимость и масса."
CA_ForwardEsShotgun:
 Id: 51042
 ENG: "Forward E.S Shotgun"
 RUS: "Передний дробовик E.S."
CA_ThisIsAForwardFacing3:
 Id: 51043
 ENG: "This is a forward facing version of the E.S Shotgun, designed for Fighter to Frigate roles. It has less range and a limited field of fire, but also lower cost and mass."
 RUS: "Это передняя версия дробовика E.S, разработанная для истребителя.  У него меньшая дальность и ограниченное поле огня, но также меньшая стоимость и масса."
CA_ForwardDbShotgun:
 Id: 51044
 ENG: "Forward D.B Shotgun"
 RUS: "Передний дробовик Д.Д."
CA_ThisIsAForwardFacing4:
 Id: 51045
 ENG: "This is a forward facing version of the Dragon Breath Shotgun, designed for Fighter to Frigate roles. It has less range and a limited field of fire, but also lower cost and mass."
 RUS: "Это передняя версия дробовика \"Дыхание дракона\", разработанная для истребителя.  У него меньшая дальность и ограниченное поле огня, но также меньшая стоимость и масса."
CA_RapidLaserEmplacement:
 Id: 51046
 ENG: "Rapid Laser Emplacement"
 RUS: "Лазерная установка с повтор."
CA_ThisIsThePlanetaryVersion4:
 Id: 51047
 ENG: "This is the planetary version of the Rapid Laser Cannon. It can target everything in a Medium planetary range and several of these on the planet fire repeating bursts of laser pulses at a high rate."
 RUS: "Это планетарная версия быстрой лазерной пушки.  Она может нацеливаться на все, что находится на среднем планетарном расстоянии, стреляет повторяющимися очередями лазерных импульсов с высокой скоростью."
CA_FiresRapidLaserPulsesMedium:
 Id: 51048
 ENG: "Fires Rapid Laser pulses. Medium Range."
 RUS: "Запускает быстрые лазерные импульсы.Средняя дальность."
CA_RemnantHeavyLaser:
 Id: 51049
 ENG: "Remnant Heavy Laser"
 RUS: "Тяжелый лазер Предтечь"
CA_RemnantCockpit:
 Id: 51050
 ENG: "Remnant Cockpit"
 RUS: "Кабина Предтечь"
CA_RemnantBridge:
 Id: 51051
 ENG: "Remnant Bridge"
 RUS: "Мостик Предтечь"
CA_RemnantEnergyPd:
 Id: 51052
 ENG: "Remnant Energy PD"
 RUS: "Энерго ТЗ Предтечь"
CA_OverdriveCapitalEngines:
 Id: 51056
 ENG: "Overdrive Capital Engines"
 RUS: "Перегруженный мощный двигатель"
CA_AdvancedCapitalEnginesThatProvide:
 Id: 51057
 ENG: "Advanced Capital Engines that provide 50% more thrust, but require double the power."
 RUS: "Усовершенствованный мощный двигатель, который обеспечивают на 50% больше тяги, но требуют вдвое больше энергии взамен."
CA_OverdriveTitanEngines:
 Id: 51058
 ENG: "Overdrive Titan Engines"
 RUS: "Перегруженный двигатель титана"
CA_AdvancedTitanEnginesThatProvide:
 Id: 51059
 ENG: "Advanced Titan Engines that provide 50% more thrust, but require double the power."
 RUS: "Усовершенствованный двигатель титана, который обеспечивают на 50% больше тяги, но требуют вдвое больше энергии взамен."
CA_DualCockpit:
 Id: 51060
 ENG: "Dual Cockpit"
 RUS: "Двойная кабина"
CA_ThisCockpitAllowsForTwo:
 Id: 51061
 ENG: "This Cockpit allows for two pilots to control the craft, with more integration between systems. It's slightly better than 2 separate cockpits."
 RUS: "Эта кабина позволяет управлять кораблем с большей интеграцией между системами и большим количеством экипажа. Это немного лучше, чем две отдельные кабины."
CA_Module_SmallCraftForceField_Name:
 Id: 51062
 ENG: "Small Craft Force Field"
CA_Module_SmallCraftForceField_Desc:
 Id: 51063
 ENG: "A smaller version of the Light Force Field which can be fitted on small craft. It has good coverage and regeneartion."
CA_DroneAntifighterCannonMk:
 Id: 51064
 ENG: "Drone Anti-Fighter Cannon Mk1"
 RUS: "Пушка дрона II"
CA_ThisDroneCannonHasAn:
 Id: 51065
 ENG: "This drone cannon has an increased fire rate and a high chance to penetrate shields. It was designed as an anti-fighter weapon, as fighters often depend specifically on shields."
 RUS: "Пушка с повышенной скорострельностью и высоким шансом пробития щита. Была разработана как средство борьбы с истребителями, поскольку истребители часто зависят именно от щитов."
CA_DroneAntifighterCannonMk2:
 Id: 51066
 ENG: "Drone Anti-Fighter Cannon Mk2"
 RUS: "Пушка дрона III"
CA_ThisDroneCannonIsDesigned:
 Id: 51067
 ENG: "This drone cannon is designed to provide more attack force vs. small craft by causing more damage vs. light armor, which some small craft might be equipped with."
 RUS: "Эта пушка предназначена для обеспечения большей поражающей силы по малым кораблями,за счет лучшего пробития брони. "
CA_DroneAntifighterCannonMk3:
 Id: 51068
 ENG: "Drone Anti-Fighter Cannon Mk3"
 RUS: "Пушка дрона IV"
CA_ImprovmentOfTheMkCannon:
 Id: 51069
 ENG: "Improvment of the Mk2 cannon, this Drone cannon is redesigned to deliver exploding shells."
 RUS: "Последняя разработка пушки для дрона. Значительно повышен урон и задействованы снаряды с взрывчатым наполнителем."
CA_DroneIonPulseBeam:
 Id: 51070
 ENG: "Drone Ion Pulse Beam"
 RUS: "Малый ионно-импульсный луч"
CA_AnIonPulseBeamSpecifically:
 Id: 51071
 ENG: "An Ion pulse beam, specifically modified to fit within a drone. It is very accurate, but not as powerful as its bigger version."
 RUS: "Версия импульсного луча переработанная для дронов. Обеспечивает защиту от управляемых снарядов, не ведет огонь по кораблям."
CA_FighterBattleShield:
 Id: 51076
 ENG: "Small Craft Battle Shield"
CA_ThisIsAnImprovedVersion2:
 Id: 51077
 ENG: "A Battle shield suitable for Frigates, Corvettes and Fighters. It has higher output and recharge than the older Fighter Shield."
CA_AdvancedFighterBattleShield:
 Id: 51080
 ENG: "Adv. Small Craft Battle Shield"
CA_ThisIsAnImprovedVersion3:
 Id: 51081
 ENG: "This is an improved version of the Small Craft Battle Shield. it is less cost effective, but can fit in tight places."
CA_Tech_BioWeapon_Name:
 Id: 51084
 ENG: "Biologic Warfare"
 RUS: "Биологическая война"
CA_Tech_BioWeapon_Desc:
 Id: 51085
 ENG: "Utilizing our knowledge of biospheres and Xeno-Environments, we can design a fearsome biological weapon."
 RUS: "Используя наши знания о биосфере и ксено-окружающей среде, мы можем разработать устрашающее биологическое оружие."
CA_Tech_Xenocide_Name:
 Id: 51086
 ENG: "Xenocide"
 RUS: "Ксеноцид"
CA_Tech_Xenocide_Desc:
 Id: 51087
 ENG: "We can create a deady biological bomb. Assuming we dont mind some... Experimenting. Retaining ethical treatment, we can conduct non life-threatening, temporary trials on test subjects. Be them prisoners of war... Volunteers... Or our own, unsuspecting citizens."
 RUS: "Мы можем создать мертвую биологическую бомбу. При условии, что мы не против ... Экспериментируем. Сохраняя этическое отношение к лечению, мы можем проводить не опасные для жизни временные испытания на подопытных. Будь то военнопленные ... Добровольцы ... Или наши собственные, ничего не подозревающие граждане."
CA_Tech_HighDensityHousing_Name:
 Id: 51088
 ENG: "High Density Housing"
 RUS: "Корпус высокой плотности"
CA_PlanetPopulationStorageInfrastructure:
 Id: 51089
 ENG: "+0.5 planet population, +25 storage, +1 Infrastructure"
 RUS: "+0.5 к населению планеты, +25 места на складе, +1 к инфраструктуре"
CA_FertilityOnBuildMaxPopulation:
 Id: 51090
 ENG: " (-0.2) Fertility on build, +1 max population, +50 storage, +1 Infrastructure"
 RUS: " (-0.2) плодородия за постройку, +1 макс. населения, +50 месте на складе, +1 к инфраструктуре"
CA_MassiveDisruptorTurret:
 Id: 51091
 ENG: "Massive Disruptor Turret"
 RUS: "Массивный деструктор"
CA_ThisIsTheLargestDisruptor:
 Id: 51092
 ENG: "This is the largest Disruptor cannon we can usefully mount on a spaceship. These Dual cannons can disrupt more efficiently, making them more effective against shields. They also have a better chance to completely penetrate shields."
 RUS: "Это самое большое орудие-деструктор, которое мы можем установить на космический корабль. Двойные стволы еще эффективнее уничтожают вражеские щиты. У них также больше шансов полностью пробить щит."
CA_MassiveLaserTurret:
 Id: 51093
 ENG: "Massive Laser Turret"
 RUS: "Массивное лазерное орудие"
CA_ABiggerVersionOfThe:
 Id: 51094
 ENG: "A bigger version of the Heavy Laser Turret. It can pack quite a punch, increasing its effectiveness versus armor."
 RUS: "Самое большое лазероное орудие термального типа с новейшими технологиями. Орудие наносит серьезный и продолжительный урон, имеет большой сектор огня и очень эффективно уничтожает броню. Инженеры советуют использовать это орудие в связке с оружием которое быстро истощает щиты."
CA_MassivePolaronTurret:
 Id: 51095
 ENG: "Massive Polaron Turret"
 RUS: "Массивное поляронное орудие"
CA_MassivePolaronCannonsMountedOn:
 Id: 51096
 ENG: "Massive Polaron Cannons mounted on a turret platform with advanced cooling systems for rapid and sustained fire. Bypasses shields."
 RUS: "Массивные поляронные пушки, установленные на специальной платформе, с лучшими системами наведения и компонентами для быстрого и подавляющего огня. Полоностью игнорирует щиты."
CA_DroneShieldBombBay:
 Id: 51097
 ENG: "Drone Shield Bomb Bay"
 RUS: "Малый отсек щитовых бомб"
CA_DroneClusterBombBay:
 Id: 51098
 ENG: "Drone Cluster Bomb Bay"
 RUS: "Малый отсек кластерных бомб"
CA_ThisIsAUniqueBomb:
 Id: 51099
 ENG: "This is a unique bomb module for drones. It contains 8 miniature fusion bombs designed to strike capital ships. The drone can fire them all in a single bomb run."
 RUS: "Это уникальный бомбовый модуль для дронов. Он содержит 8 миниатюрных термоядерных бомб, предназначенных для поражения крупных кораблей. Дрон может запустить их все за один раз."
CA_Tech_Battle_Stations_Name:
 Id: 51100
 ENG: "Battle Stations"
 RUS: "Боевые станции"
CA_Tech_Battle_Stations_Desc:
 Id: 51101
 ENG: "The need to defend our colonies against enemy invasion grows constantly. Our engineers have designed a substantially large battle station that will bolster the defensive prowess of our more important planets. We have also iterated upon our orbital missile launchers, a step toward nullifying the threat of long range enemy weapons."
 RUS: "Необходимость защиты наших колоний от вражеского вторжения постоянно растет. Наши инженеры спроектировали достаточно большую боевую станцию, которая укрепит оборонительную мощь наших наиболее важных планет. Мы также доработали наши орбитальные ракетные пусковые установки, что стало шагом на пути к устранению угрозы оружия противника дальнего действия."
CA_Tech_SubSpaceProjectors_Name:
 Id: 51104
 ENG: "Subspace Projectors"
 RUS: "Космические проекторы"
CA_Tech_SubSpaceProjectors_Desc:
 Id: 51105
 ENG: "Subspace Projectors greatly speed up stardrive speeds for ships within their influence. We can use them as \"fast lanes\" in our empire. They also have a very large sensor coverage and can be used for spying near enemy borders. Orbital Platforms are also our first step into the colony orbital defense path. These small orbitals, when grouped together, can fend off entire small invasion fleets."
 RUS: "Космические подпространственные проекторы значительно ускоряют скорость кораблей, находящихся под их влиянием. Мы можем использовать их как \"быстрые переулки\" в нашей империи. Они также имеют очень большой охват сенсоров и могут использоваться для шпионажа вблизи границ противника. Орбитальные платформы являются нашим первым шагом на пути к орбитальной защите колонии. Эти небольшие орбитали, когда сгруппированы вместе, могут отражать небольшие флоты вторжения."
CA_Tech_Gravitons_Name:
 Id: 51106
 ENG: "Gravitons"
 RUS: "Гравитоны"
CA_Tech_Gravitons_Desc:
 Id: 51107
 ENG: "For decades, our scientists have understood and been able to utilize the quantum forces of the graviton particle, in applications such as gravitational plating and warp travel. Now, with our newfound mastery over it, we have been able to devise an incredibly powerful weapon."
 RUS: "На протяжении десятилетий наши ученые понимали и могли использовать квантовые силы гравитонной частицы в таких вещах, как гравитационное покрытие и путешествия в варпе. Теперь, когда мы обрели это мастерство, мы смогли изобрести невероятно мощное оружие."
