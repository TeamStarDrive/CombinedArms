 RUS: "С внедрением новых технологий наши усилия по созданию мощной пушки увенчались успехом. Нам удалось создать несколько новых экспериментальных векторных оружий, но, поскольку мы не до конца понимаем наше открытие, это оружие не оптимизировано идеально."
