 RUS: "Форт-броня"
CA_Tech_HSA-Frontier_Desc:
 Id: 50377
 ENG: "A better Shield Amp Armor, which can also store more power than previous armor. Production costs of this armor are very high, but the benefits are obvious. Vulnerability to Energy projectiles is futher reduced with this technology. "
 RUS: "Лучшая щитовая броня, которая может хранить больше энергии, чем предыдущая. Стоимость производства этой брони очень высока, но выгода очевидна. Уязвимость к энергетическим снарядам еще больше снижается с помощью этой технологии."
CA_TheFrontierArmorIsComposed:
 Id: 50378
 ENG: "The Frontier Armor is composed of Ceramic Armor, Composite Armor, amd large Shield Amplification module. This makes it very durable, and almost self sustained. The toughness of the armor is somewhere between Ceramic and Composite Armors. It also nullifies the effect of Armor Piercing I"
 RUS: "Форт-пластина состоит из керамической брони, композитной брони и большого модуля усиления щита. Это делает ее очень прочной и практически самодостаточной. Прочность находится где-то между керамической и композитной броней. Также аннулирует эффект \"Пробитие брони I\""
