 RUS: "Этот небольшой ускоритель, устанавливаеться снаружи корабля, а не в обычном выделенном машинном отделении.Дает хорошую тягу на субсветовых скоростях, но не имеет возможности выхода в варп, или поворота корабля. Отличный вариант, когда требуется большая скорость например для: разведовательных кораблей,кораблей быстрого реагирования, или для бомбардировщиков, чтоб быстрее преодолевать гравитационное поле планет. "
