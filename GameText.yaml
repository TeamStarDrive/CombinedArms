 Id: 50476
 ENG: "Turn Thrusters are small thrusters installed on the side of a ship. They can significantly increase a ship's turn rate."
 RUS: "Усилители поворота - это небольшие устройства, установленные на борту корабля. Они могут значительно увеличить скорость поворота корабля."
CA_TurnThrustCruiser:
