 RUS: "Ксено шахты II"
CA_Tech_XenoMiningII_Desc:
 Id: 50451
 ENG: "As our civilization grows, we must find ways to exploit more of our colonies' industrial potentials. Research in this area involves many steps towards the creation of a robust industrial backbone that will maintain our economy."
 RUS: "По мере роста нашей цивилизации мы должны найти способы использовать больше промышленного потенциала наших колоний. Исследования в этой области включают множество шагов в направлении создания прочной промышленной основы, которая будет поддерживать нашу экономику."
CA_FertilityOnBuildFlatProduction:
 Id: 50452
 ENG: " (-0.5) Fertility On Build, +6 flat production per turn, +1 food per turn, +15% tax, +100 storage, +1 Infrastructure, adds ship repair"
