CA_Tech_FarmingColonyDevelopmentI_Name:
 Id: 50461
 ENG: "Xeno Farming II"
 RUS: "Ксено фермы II"
CA_Tech_FarmingColonyDevelopmentI_Desc:
 Id: 50462
 ENG: "In order to stay happy and useful, our colonists must have sufficient food on their tables. We must invest in more efficient farming methods to increase food output on each colony."
 RUS: "Чтобы оставаться счастливыми и полезными, у наших колонистов должно быть достаточно еды на столах. Мы должны инвестировать в более эффективные методы ведения сельского хозяйства, чтобы увеличить производство продуктов питания в каждой колонии."
CA_UpgradedXenoFarm:
 Id: 50463
 ENG: "Upgraded Xeno Farm"
 RUS: "Улучшенная ксено ферма"
CA_UpgradedXenoFarmsUseEven:
 Id: 50464
 ENG: "Upgraded Xeno Farms use even more advanced farming and husbandry techniques on alien soil."
 RUS: "Модернизированные ксено фермы, используют еще более совершенные методы земледелия на чужеродной почве."
CA_AutoturretType:
 Id: 50469
 ENG: "AutoTurret Type54"
 RUS: "Авто-турель тип 54"
CA_ThisIsABasicTwin:
 Id: 50470
 ENG: "This is a basic, twin barrel Auto Turret designed to operate in vacuum. Its main advantage is that it can be fitted on smaller ships."
 RUS: "Это базовая двухствольная автоматическая турель, предназначенная для работы в вакууме. Ее главное преимущество заключается в том, что она может быть установлена на небольших судах."
CA_AutoturretType2:
 Id: 50471
 ENG: "AutoTurret Type62"
 RUS: "Авто-турель тип 62"
CA_AMediumSizedAutoTurret:
 Id: 50472
 ENG: "A medium sized Auto turret. 3 Barrels, medium to long range, and heavy projectiles. These work well when installed as a group."
 RUS: "Автоматическая турель среднего размера. 3 ствола, средней и большой дальности,тяжелые снаряды. Они хорошо работают при установке в группе."
CA_AutoturretType3:
 Id: 50473
