 Id: 50371
 ENG: "This Armor has much more improved Shield Amplification Technology. It is stronger than Steel Armor, but it costs more, weighs more, but generates more power for the ship. It also nullifies the effect of Armor Piercing I"
 RUS: "Эта броня имеет гораздо более совершенную технологию усиления щита. Он прочнее Стальной брони, но стоит дороже, весит больше, но дает больше мощности для корабля. Он также сводит на нет эффект пробивания брони I."
