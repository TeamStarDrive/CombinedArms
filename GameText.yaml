 Id: 50347
 ENG: "By combining Artificial Organic Material and Previous Bio Armor, we can create a substance with all the characteristics of both materials, while also improving their Energy Weapons and Beam Resistance."
 RUS: "Комбинируя искусственный органический материал и предыдущую биологическую броню, мы можем создать вещество со всеми характеристиками обоих материалов, а также улучшить ее сопротивление луче.Слегка повышает мощность энергетического оружия."
