CA_GatlingTurret:
 Id: 50382
 ENG: "Gatling Turret"
 RUS: "Установка \"Гатлинга\""
CA_AQuicklyRotatingGatlingTurret:
 Id: 50384
 ENG: "A quickly rotating Gatling Turret. The rotating barrels have increased the number of projectiles that can fire. It also features a 180 degree angle of engagement. Will only fire upon enemy missiles."
 RUS: "Орудие точечной защиты \"Гатлинга\". Стволы барабанного типа увеличивают количество выстрелов. Она также имеет угол огня 180 градусов. Стреляет только по вражеским ракетам."
CA_DualGatlingTurret:
 Id: 50386
 ENG: "Dual Gatling Turret"
 RUS: "Тяжелая установка \"Гатлинга\""
CA_ALargerPointDefenseGatling:
 Id: 50388
 ENG: "A larger point defense gatling turret. A high fire rate and an engagement angle of 360 degrees make this the optimal defensive weapon against enemy missiles."
 RUS: "Увеличенная установка \"Гатлинга\" точечной защиты. Высокая скорострельность и угол поражения в 360 градусов делают его оптимальным средством защиты от вражеских ракет."
CA_FlakAaCannon:
 Id: 50390
 ENG: "Flak AA Cannon"
 RUS: "Авто-пушка ТЗ"
CA_FlakAaCannonsHaveTwice:
 Id: 50392
 ENG: "Flak AA Cannons have twice the range of normal PD weapons. A good weapon versus missiles and fighters. They feature a 180 degree fire arc."
 RUS: "Зенитные автоматические орудия имеют в два раза большую дальность действия, чем у обычного оружия ТЗ. Хорошее оружие против ракет и истребителей. Имеет сектор огня в 180 градусов."
CA_AdvancedFlakAaCannon:
 Id: 50394
